async function loadStockUS(){
  if(!stkCode||stkMarket!=="us")return;
  const rk=await Promise.all([
    usFetch("kline","code="+encodeURIComponent(stkCode)+"&type=8&num=2"),
    usFetch("quote","codes="+encodeURIComponent(stkCode))]);
  const k=rk[0],tr=rk[1];
  const rl=(k&&k.data&&k.data[0]&&k.data[0].respList)||[];
  if(!rl.length)return;
  const today=rl[0], prev=rl[1]||rl[0];
  const price=(tr&&tr.data&&tr.data[0]&&+tr.data[0].p)||+today.c;
  const open=+today.o, prevc=+prev.c, vol=+today.v, tv=+today.vw;
  const co=open?(price-open)/open*100:0, cp=prevc?(price-prevc)/prevc*100:0;
  const cls=x=>x>0?"up":(x<0?"dn":"fl"),arw=x=>x>0?"▲":(x<0?"▼":"");
  const en=LANG==="en", tick=stkCode.replace(/\.US$/,"");
  E("stkDetail").innerHTML=
    '<div class="stkhd">'+tick+' <span style="color:var(--sub);font-size:13px;font-weight:600">US</span></div>'
   +'<table class="stktab">'
   +'<tr><td class="k">'+L("price")+'</td><td class="v">'+usPrice(price)+'</td></tr>'
   +'<tr><td class="k">'+L("vsOpen")+'</td><td class="v '+cls(co)+'">'+arw(co)+Math.abs(co).toFixed(2)+'%</td></tr>'
   +'<tr><td class="k">'+L("vsPrev")+'</td><td class="v '+cls(cp)+'">'+arw(cp)+Math.abs(cp).toFixed(2)+'%</td></tr>'
   +'<tr><td class="k">'+L("vol")+'</td><td class="v">'+Math.round(vol).toLocaleString()+(en?"":"주")+'</td></tr>'
   +'<tr><td class="k">'+L("turnover")+'</td><td class="v">'+usMoney(tv)+'</td></tr>'
   +'</table>';
  stkChart.patchLast(price);
  dpPx["us:"+stkCode]=+price; dpShowStockBar();
}
async function loadChartUS(){
  if(!stkCode||stkMarket!=="us")return;
  E("stkChartLbl").textContent=L("chartLoading");
  const kt=US_KT[stkTf]||8;
  let rl=[];
  if(stkTf==="D"&&typeof rlUsDaily==="function"&&ST&&ST.kr&&ST.kr.key&&ST.kr.sec){
    try{rl=await rlUsDaily(stkCode,250);}catch(e){rl=[];}          // 키움 일봉(본인 키)
  }
  if(rl.length<2){const k=await usFetch("kline","code="+encodeURIComponent(stkCode)+"&type="+kt+"&num=250");
    rl=(k&&k.data&&k.data[0]&&k.data[0].respList)||[];}
  if(rl.length<2){E("stkChartLbl").textContent=L("chartNone");return;}
  const asc=rl.slice().reverse();
  const bars=asc.map(b=>[usFmtT(+b.t,stkTf),+b.o,+b.h,+b.l,+b.c,+b.v]);
  const raw=asc.map(b=>[+b.t,+b.o,+b.h,+b.l,+b.c,+b.v]);
  const closes=bars.map(b=>b[4]),cur=closes[closes.length-1];
  const hma=jhma(closes,55),sma=jsma(closes,60),walls=jwalls(raw,cur);
  stkChart.setData({bars,hma,sma,hl:55,gate:60,walls});
  E("stkChartLbl").textContent=LANG==="en"?("Hull MA55 · SMA60 · red=resist green=support · drag/pinch")
    :("헐 이동평균선 HMA55 · SMA60 · 빨강=저항 초록=지지 · 밀어서 과거·핀치");
}

// ---- 공용 헐 차트 엔진 (팬/줌·십자선, 옵션: 지지저항·청산맵) ----
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function jwma(v,n){const out=new Array(v.length).fill(null),den=n*(n+1)/2;
  for(let i=n-1;i<v.length;i++){let s=0,ok=true;for(let k=0;k<n;k++){const x=v[i-n+1+k];if(x==null){ok=false;break;}s+=x*(k+1);}if(ok)out[i]=s/den;}return out;}
function jhma(v,L){const h=Math.floor(L/2),r=Math.round(Math.sqrt(L)),w1=jwma(v,h),w2=jwma(v,L);
  const raw=v.map((_,i)=>(w1[i]!=null&&w2[i]!=null)?2*w1[i]-w2[i]:null);return jwma(raw,r);}
function jsma(v,w){const out=new Array(v.length).fill(null);let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=w)s-=v[i-w];if(i>=w-1)out[i]=s/w;}return out;}
function jwalls(raw,cur){const seg=raw.slice(-240).filter(b=>b[4]>0);if(seg.length<20||cur<=0)return{up:null,dn:null};
  let lo=Math.min.apply(null,seg.map(b=>b[3])),hi=Math.max.apply(null,seg.map(b=>b[2]));if(hi<=lo)return{up:null,dn:null};
  const bins=24,step=(hi-lo)/bins,vol=new Array(bins).fill(0);
  for(const b of seg){const v=b[5]||0;if(v<=0)continue;let k=Math.floor(((b[2]+b[3]+b[4])/3-lo)/step);k=clamp(k,0,bins-1);vol[k]+=v;}
  const mx=Math.max.apply(null,vol)||1,peaks=[];
  for(let i=1;i<bins-1;i++)if(vol[i]>vol[i-1]&&vol[i]>vol[i+1]&&vol[i]>0)peaks.push([lo+step*(i+0.5),vol[i]/mx]);
  const up=peaks.filter(p=>p[0]>cur),dn=peaks.filter(p=>p[0]<cur);
  return{up:up.length?up.reduce((a,b)=>a[0]<b[0]?a:b):null,dn:dn.length?dn.reduce((a,b)=>a[0]>b[0]?a:b):null};}
function jliq(raw,cur){const bins=48,lb=240,mmr=0.005,levs=[10,25,50,100];
  const seg=raw.slice(-lb).filter(b=>b[4]>0);if(seg.length<20||cur<=0)return[];
  let lo=Math.min.apply(null,seg.map(b=>b[3])),hi=Math.max.apply(null,seg.map(b=>b[2]));if(hi<=lo)return[];
  const step=(hi-lo)/bins,grid=new Array(bins).fill(0);
  for(const b of seg){let v=b[5]||0;if(v<=0)v=1;const p=(b[2]+b[3]+b[4])/3;
    for(const L of levs)for(const liq of [p*(1-1/L)/(1-mmr),p*(1+1/L)/(1+mmr)])
      if(liq>=lo&&liq<hi)grid[Math.min(bins-1,Math.floor((liq-lo)/step))]+=v;}
  const mx=Math.max.apply(null,grid)||1,out=[];
  for(let i=0;i<bins;i++){const s=grid[i]/mx;if(s<=0)continue;
    const lft=i>0?grid[i-1]:-1,rgt=i<bins-1?grid[i+1]:-1;
    if(grid[i]>=lft&&grid[i]>=rgt&&s>=0.25)out.push([lo+step*(i+0.5),s]);}
  return out;}

// · Y축 눈금 없음 — 값은 십자선으로. 그래프가 폭을 다 쓴다.

//   두 봉의 종가 사이 — 상승률·금액·봉 수·봉당 평균%·화면 각도. 다음에 한 손가락(PC 는 왼쪽 클릭)으로 누르면 지운다.
// · 봉 = [라벨, 시, 고, 저, 종, 거래량(없을 수 있음)].
const C21_BASE=[["캔들","Candles"],["선","Line"],["영역","Area"],["헤이킨아시","Heikin-Ashi"],["렌코","Renko"],["헐","Hull"]];
const C21_PAGES=[
  ["bb","볼린저밴드","Bollinger Bands","ov"],["ich","일목균형표","Ichimoku","ov"],["env","엔벨로프","Envelope","ov"],
  ["kel","켈트너 채널","Keltner Channel","ov"],["vwap","VWAP","VWAP","ov"],["vwma","VWMA100","VWMA100","ov"],
  ["rsi","RSI","RSI","sub"],["macd","MACD","MACD","sub"],["sto","스토캐스틱","Stochastic","sub"],
  ["vol","거래량","Volume","sub"],["obv","OBV","OBV","sub"],["atr","ATR","ATR","sub"],
  ["vp","매물대","Volume Profile","ov"],["sr","지지·저항선","Support / Resistance","ov"],["ret","누적 수익률","Cumulative Return","sub"],
  ["nz","N자 모양 찾기","N-Pattern","ov"],["ew","엘리어트 파동","Elliott Wave","ov"],["wy","와이코프 패턴","Wyckoff","ov"],
  ["hm","하모닉 패턴","Harmonic Pattern","ov"],["liq","청산맵","Liquidation Map","ov",1]];
const C21_MAX=4, C21_VOLK={vwap:1,vwma:1,vol:1,obv:1,vp:1};
const C21_COL={up:"#00a868",dn:"#ff433d",blue:"#5db4ff",org:"#f59f00",pur:"#9775fa",grn:"#26c281",red:"#ff6b6b",brn:"#e8590c",gry:"#8a93a3"};

// ── 계산 도구 ──
function c21Ema(v,n){const o=new Array(v.length).fill(null),k=2/(n+1);let e=null,c=0;
  for(let i=0;i<v.length;i++){const x=v[i];if(x==null)continue;e=(e==null)?x:(x*k+e*(1-k));c++;if(c>=n)o[i]=e;}return o;}
function c21Sma(v,n){const o=new Array(v.length).fill(null);let s=0,q=[];
  for(let i=0;i<v.length;i++){const x=v[i];if(x==null){s=0;q=[];continue;}q.push(x);s+=x;if(q.length>n)s-=q.shift();if(q.length===n)o[i]=s/n;}return o;}
function c21Atr(B,n){const o=new Array(B.length).fill(null);let a=null;
  for(let i=0;i<B.length;i++){const x=B[i],tr=i?Math.max(x[2]-x[3],Math.abs(x[2]-B[i-1][4]),Math.abs(x[3]-B[i-1][4])):(x[2]-x[3]);
    if(i<n){a=(a||0)+tr/n;if(i===n-1)o[i]=a;}else{a=(a*(n-1)+tr)/n;o[i]=a;}}return o;}
function c21Rng(a,i,n,max){let r=max?-Infinity:Infinity;for(let k=Math.max(0,i-n+1);k<=i;k++)r=max?Math.max(r,a[k]):Math.min(r,a[k]);return r;}
// 고점·저점 뽑기(지그재그) — 되돌림이 2.5×ATR(없으면 3%)을 넘을 때마다 꺾인다
function c21Piv(B){const at=c21Atr(B,14),P=[];if(B.length<5)return P;let dir=0,ei=0,ep=B[0][4];
  for(let i=1;i<B.length;i++){const th=Math.max((at[i]||B[i][4]*0.03)*2.5,B[i][4]*0.012),h=B[i][2],l=B[i][3];
    if(dir>=0){if(h>=ep||dir===0&&h>ep){ep=h;ei=i;if(dir===0)dir=1;}
      if(dir===1&&l<=ep-th){P.push([ei,ep,"H"]);dir=-1;ep=l;ei=i;continue;}
      if(dir===0&&l<=B[0][4]-th){dir=-1;ep=l;ei=i;}}
    if(dir===-1){if(l<=ep){ep=l;ei=i;}if(h>=ep+th){P.push([ei,ep,"L"]);dir=1;ep=h;ei=i;}}}
  P.push([ei,ep,dir===1?"H":"L"]);            // 마지막 꺾임은 아직 확정 전
  return P;}

// 판별 계산 — 자료를 받을 때 한 번(시세 한 칸이 바뀌면 다시)
function c21Calc(key,B,CH){
  const c=B.map(b=>b[4]),h=B.map(b=>b[2]),l=B.map(b=>b[3]),v=B.map(b=>+b[5]||0),N=B.length,R={hasVol:v.some(x=>x>0)};
  const band=(m,up,dn,col,col2)=>{R.lines=[[m,col,1.4],[up,col2,1.1],[dn,col2,1.1]];R.fill=[up,dn];};
  if(key==="bb"){const m=c21Sma(c,20),s=m.map((x,i)=>{if(x==null)return null;let q=0;for(let k=i-19;k<=i;k++)q+=(c[k]-x)*(c[k]-x);return Math.sqrt(q/20);});
    band(m,m.map((x,i)=>x==null?null:x+2*s[i]),m.map((x,i)=>x==null?null:x-2*s[i]),C21_COL.org,C21_COL.blue);}
  if(key==="ich"){const tk=c.map((_,i)=>i<8?null:(c21Rng(h,i,9,1)+c21Rng(l,i,9,0))/2),kj=c.map((_,i)=>i<25?null:(c21Rng(h,i,26,1)+c21Rng(l,i,26,0))/2),
      sb=c.map((_,i)=>i<51?null:(c21Rng(h,i,52,1)+c21Rng(l,i,52,0))/2),A=c.map((_,i)=>i>=26&&tk[i-26]!=null&&kj[i-26]!=null?(tk[i-26]+kj[i-26])/2:null),
      S=c.map((_,i)=>i>=26?sb[i-26]:null),lag=c.map((_,i)=>i+26<N?c[i+26]:null);
    R.lines=[[tk,C21_COL.red,1.2],[kj,C21_COL.blue,1.2],[A,C21_COL.grn,1],[S,C21_COL.brn,1],[lag,C21_COL.pur,1]];R.fill=[A,S];}
  if(key==="env"){const m=c21Sma(c,20);band(m,m.map(x=>x==null?null:x*1.05),m.map(x=>x==null?null:x*0.95),C21_COL.org,C21_COL.blue);}
  if(key==="kel"){const m=c21Ema(c,20),a=c21Atr(B,10);band(m,m.map((x,i)=>x==null||a[i]==null?null:x+2*a[i]),m.map((x,i)=>x==null||a[i]==null?null:x-2*a[i]),C21_COL.org,C21_COL.pur);}
  if(key==="vwap"||key==="vwma"){const n=key==="vwap"?20:100,o=new Array(N).fill(null);
    for(let i=n-1;i<N;i++){let pv=0,vv=0;for(let k=i-n+1;k<=i;k++){const tp=key==="vwap"?(h[k]+l[k]+c[k])/3:c[k];pv+=tp*v[k];vv+=v[k];}o[i]=vv>0?pv/vv:null;}
    R.lines=[[o,key==="vwap"?C21_COL.pur:C21_COL.org,2]];}
  if(key==="rsi"){const o=new Array(N).fill(null);let g=0,s=0;
    for(let i=1;i<N;i++){const d=c[i]-c[i-1],u=Math.max(d,0),w=Math.max(-d,0);
      if(i<=14){g+=u/14;s+=w/14;if(i===14)o[i]=s?100-100/(1+g/s):100;}else{g=(g*13+u)/14;s=(s*13+w)/14;o[i]=s?100-100/(1+g/s):100;}}
    R.sub=[[o,C21_COL.pur,1.5]];R.lv=[30,70];R.rng=[0,100];}
  if(key==="macd"){const f=c21Ema(c,12),s=c21Ema(c,26),m=c.map((_,i)=>f[i]!=null&&s[i]!=null?f[i]-s[i]:null),g=c21Ema(m,9);
    R.sub=[[m,C21_COL.blue,1.4],[g,C21_COL.org,1.2]];R.hist=m.map((x,i)=>x!=null&&g[i]!=null?x-g[i]:null);R.zero=1;}
  if(key==="sto"){const k=c.map((_,i)=>{if(i<13)return null;const hh=c21Rng(h,i,14,1),ll=c21Rng(l,i,14,0);return hh>ll?(c[i]-ll)/(hh-ll)*100:50;}),
      ks=c21Sma(k,3),ds=c21Sma(ks,3);R.sub=[[ks,C21_COL.blue,1.4],[ds,C21_COL.org,1.2]];R.lv=[20,80];R.rng=[0,100];}
  if(key==="vol"){R.hist=v.slice();R.vcol=1;}
  if(key==="obv"){const o=[0];for(let i=1;i<N;i++)o.push(o[i-1]+(c[i]>c[i-1]?v[i]:c[i]<c[i-1]?-v[i]:0));R.sub=[[o,C21_COL.grn,1.5]];}
  if(key==="atr"){R.sub=[[c21Atr(B,14),C21_COL.brn,1.5]];}
  if(key==="ret"){R.ret=1;}
  if(key==="nz"||key==="ew"||key==="hm"){R.piv=c21Piv(B);}
  if(key==="nz"){const P=R.piv,out=[];
    for(let j=2;j<P.length;j++){const a=P[j-2],b=P[j-1],q=P[j];
      if(a[2]==="L"&&b[2]==="H"&&q[2]==="L"&&q[1]>a[1]&&q[1]<b[1])out.push({pts:[a,b,q],up:1,tgt:q[1]+(b[1]-a[1]),ti:q[0]+(b[0]-a[0])});
      if(a[2]==="H"&&b[2]==="L"&&q[2]==="H"&&q[1]<a[1]&&q[1]>b[1])out.push({pts:[a,b,q],up:0,tgt:q[1]-(a[1]-b[1]),ti:q[0]+(b[0]-a[0])});}
    R.nz=out.slice(-3);}
  if(key==="ew"){const P=R.piv;let best=null;
    for(let j=P.length-6;j>=0&&!best;j--){const p=P.slice(j,j+6).map(x=>x[1]),t=P[j][2],s=t==="L"?1:-1;

  }catch(e){ shMsg(SH_URL); }
}

function rlRelay() {

  if (!v) return "";

}

function rlNum(v) {                     // "000000000111777" · "0.0000" → 숫자
  if (v === undefined || v === null) return 0;

// ── 키움 토큰 — 국내·해외가 같은 토큰을 쓴다 ──
async function rlToken() {
  // 🔴 받아 둔 토큰을 다시 쓴다. 키움 토큰은 하루를 간다 — 1분마다 새로 받을 일이 아니다.
  if (RL.tok && RL.tokAt && (Date.now() - RL.tokAt) < 6 * 3600 * 1000) return RL.tok;
  const c = ST.kr;
  if (!c || !c.key || !c.sec) throw new Error("설정에 키움 키가 없습니다");
  const r = await fetch(rlHost() + "/oauth2/token", {
    method: "POST",
    headers: {"Content-Type": "application/json;charset=UTF-8", "api-id": "au10001"},
    body: JSON.stringify({grant_type: "client_credentials",
                          appkey: c.key.trim(), secretkey: c.sec.trim()})
  });
  const j = await r.json();
  const t = j.token || j.access_token;
  if (!t) throw new Error("토큰 실패: " + (j.return_msg || r.status));
  RL.tok = t; RL.tokAt = Date.now();
  return t;
}
async function rlKiwoom(tok, path, apiId, body) {
  const r = await fetch(rlHost() + path, {
    method: "POST",
    headers: {"Content-Type": "application/json;charset=UTF-8",
              "authorization": "Bearer " + tok, "api-id": apiId},
    body: JSON.stringify(body || {})
  });
  return r.json();
}

// ── 미국 일봉 — 키움 usa06012 를 **이용자 본인 키로** (사장님 2026-09-19) ──
//    한 번에 100봉 · 최신이 앞. 이어받기는 cont-yn/next-key 머리(중계기를 거치면 보인다).
//    돌려주는 모양은 허브 /us/kline 의 respList 와 같다 — {t,o,h,l,c,v,vw} 최신이 앞.
//    거래소(ND 나스닥·NY 뉴욕·NA 아멕스)는 처음 한 번 찾아 기억한다.
const RL_STEX = {};
async function rlUsDaily(code, n) {
  const tick = String(code || "").replace(/\.US$/, "").toUpperCase();
  if (!tick) return [];
  const tok = await rlToken();
  const page = async function(stex, nk) {
    const h = {"Content-Type": "application/json;charset=UTF-8",
               "authorization": "Bearer " + tok, "api-id": "usa06012"};
    if (nk) { h["cont-yn"] = "Y"; h["next-key"] = nk; }
    const r = await fetch(rlHost() + "/api/us/chart", {method: "POST", headers: h,
      body: JSON.stringify({stex_tp: stex, stk_cd: tick, upd_stkpc_tp: "1"})});
    const j = await r.json();
    return {j: j, cont: r.headers.get("cont-yn") || "", nk: r.headers.get("next-key") || ""};
  };
  let first = null, stex = RL_STEX[tick];
  for (const s of (stex ? [stex] : ["ND", "NY", "NA"])) {
    try {
      const p = await page(s, "");
      if (p.j && p.j.return_code === 0 && (p.j.result_list || []).length) { first = p; stex = s; break; }
    } catch (e) {}
  }
  if (!first) return [];
  RL_STEX[tick] = stex;
  let rows = (first.j.result_list || []).slice(), cur = first;
  while (rows.length < (n || 250) && cur.cont === "Y" && cur.nk) {
    try { cur = await page(stex, cur.nk); } catch (e) { break; }
    if (!cur.j || cur.j.return_code !== 0) break;
    rows = rows.concat(cur.j.result_list || []);
  }
  const out = [];
  rows.forEach(function(b) {
    const dt = String(b.dt || "").trim();
    const c = rlAbs(b.cur_prc), o = rlAbs(b.open_pric) || c;
    if (dt.length !== 8 || !(c > 0)) return;
    const t = Date.UTC(+dt.slice(0, 4), +dt.slice(4, 6) - 1, +dt.slice(6, 8), 12) / 1000;
    out.push({t: t, o: o, h: rlAbs(b.high_pric) || c, l: rlAbs(b.low_pric) || c, c: c,
              v: rlAbs(b.acc_trde_qty), vw: rlAbs(b.acc_trde_prica)});
  });
  return out.slice(0, n || 250);
}

// ── 국내 지수 — 키움 ka20001(현재가) · ka20006(일봉, 값×100) — 이용자 본인 키 (사장님 2026-09-19) ──
//    "내 컴퓨터(중계기)" 모드에서 국내 묶음을 야후 지연 대신 이것으로 채운다(코스피200 도 여기서만 나온다).
//    업종코드: 코스피 001 · 코스닥 101 · 코스피200 201 (실측 — 201 은 mrkt_tp 0 으로 된다)
const RL_KIDX = [["코스피", "0", "001"], ["코스닥", "1", "101"], ["코스피200", "0", "201"]];
const RL_KSPK = {};
function rlYmd(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); }
async function rlKrIndex() {
  const tok = await rlToken(), out = [], today = rlYmd(new Date());
  for (const x of RL_KIDX) {
    const nm = x[0], mk = x[1], cd = x[2];
    try {
      const j = await rlKiwoom(tok, "/api/dostk/sect", "ka20001", {mrkt_tp: mk, inds_cd: cd});
      if (!j || j.return_code !== 0) continue;
      const cur = rlAbs(j.cur_prc); if (!(cur > 0)) continue;
      let pct = rlAbs(j.flu_rt); const sig = String(j.pred_pre_sig || "");
      if (sig === "4" || sig === "5") pct = -pct; else if (sig !== "1" && sig !== "2") pct = 0;
      let sp = RL_KSPK[cd];
      if (!sp || Date.now() - sp.at > 600000) {           // 일봉은 10분에 한 번
        try {
          const c = await rlKiwoom(tok, "/api/dostk/chart", "ka20006", {inds_cd: cd, base_dt: today});
          const rows = (c && c.inds_dt_pole_qry) || [];
          sp = {at: Date.now(), last: String((rows[0] || {}).dt || ""),
                arr: rows.slice(0, 30).reverse().map(function (r) { return rlAbs(r.cur_prc) / 100; })};
          RL_KSPK[cd] = sp;
        } catch (e) {}
      }
      let arr = (sp && sp.arr) ? sp.arr.slice() : [];
      if (arr.length) { if (sp.last === today) arr[arr.length - 1] = cur; else if (Math.abs(arr[arr.length - 1] - cur) > 1e-9) arr.push(cur); }   // 주말·장 전엔 같은 값을 두 번 찍지 않는다
      out.push({nm: nm, val: cur.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}),
                pct: Math.round(pct * 100) / 100, spark: arr});
    } catch (e) {}
  }
  return out;
}
async function rlKrIdxFill(d) {
  if (!ST || !ST.kr || !ST.kr.key || !ST.kr.sec) return;

// ── OKX — 서명을 단말에서 만든다 ──
async function rlSign(secret, msg) {
  const enc = new TextEncoder();
  const k = await crypto.subtle.importKey("raw", enc.encode(secret),
    {name: "HMAC", hash: "SHA-256"}, false, ["sign"]);
  const sg = await crypto.subtle.sign("HMAC", k, enc.encode(msg));
  return btoa(String.fromCharCode(...new Uint8Array(sg)));
}
async function rlOkx(path) {
  const c = ST.co;
  if (!c || !c.key || !c.sec || !c.pass) throw new Error("설정에 OKX 키가 없습니다");
  const ts = new Date().toISOString().slice(0, 23) + "Z";
  const sg = await rlSign(c.sec.trim(), ts + "GET" + path);
  const r = await fetch(okxHost() + path, {headers: {
    "OK-ACCESS-KEY": c.key.trim(), "OK-ACCESS-SIGN": sg,
    "OK-ACCESS-TIMESTAMP": ts, "OK-ACCESS-PASSPHRASE": c.pass.trim()}});
  const j = await r.json();
  // 🔴 OKX 는 틀려도 200 을 준다. code 를 봐야 빈 목록과 실패가 갈린다.
  if (j && j.code !== undefined && String(j.code) !== "0")
    throw new Error(String(j.code) + " " + (j.msg || ""));
  return j;
}
// ── 실주문 (OKX) ──────────────────────────────────────────────────
// 🔴 여기부터는 **진짜 돈**이다. 부르는 쪽에서 반드시 확인창을 거친다.

    method: "POST",
    headers: {"OK-ACCESS-KEY": c.key.trim(), "OK-ACCESS-SIGN": sg,
              "OK-ACCESS-TIMESTAMP": ts, "OK-ACCESS-PASSPHRASE": c.pass.trim(),
              "Content-Type": "application/json"},
    body: txt});
  const j = await r.json();
  // 🔴 OKX 는 거부도 200 으로 준다. 바깥 code 와 줄별 sCode 를 **둘 다** 본다.
  const d0 = ((j && j.data) || [])[0] || {};
  if (j && j.code !== undefined && String(j.code) !== "0")
    throw new Error(String(d0.sCode || j.code) + " " + (d0.sMsg || j.msg || ""));
  if (d0.sCode !== undefined && String(d0.sCode) !== "0")

  setTimeout(function () { try { rlOsoLoad(); } catch (e) {} }, 1500); [2500, 6000, 12000].forEach(function (ms) { setTimeout(function () { try { if (!RL.busy && typeof rlHas === "function" && rlHas()) rlLoad(true); } catch (e) {} }, ms); });
  return j;
}

// 선물 — 증거금×레버를 계약 수로 바꿔 낸다
async function rlPerpOpen(inst, side, marginUsdt, lev, px, limitPx) {
  try {
    await rlOkxPost("/api/v5/account/set-leverage",
                    {instId: inst, lever: String(lev), mgnMode: "isolated"});
  } catch (e) {}                            // 이미 같은 배율이면 거부될 수 있다 — 넘어간다
  const use = limitPx > 0 ? limitPx : px;
  if (!(use > 0)) throw new Error("값을 못 받았습니다");
  const cv = await rlCtVal(inst), lot = await rlLotSz(inst);
  let sz = (marginUsdt * lev) / (use * cv);
  sz = Math.max(lot, Math.floor(sz / lot) * lot);
  sz = +sz.toFixed(8);
  const b = {instId: inst, tdMode: "isolated", side: (side === "L" ? "buy" : "sell"),
             sz: String(sz)};
  if (limitPx > 0) { b.ordType = "limit"; b.px = String(limitPx); }
  else { b.ordType = "market"; }
  if ((await rlPosMode()) === "long_short_mode") b.posSide = (side === "L" ? "long" : "short");
  const j = await rlOkxPost("/api/v5/trade/order", b);
  return {sz: sz, qty: sz * cv, res: j};
}
// 선물 청산 — 거래소가 들고 있는 계약 수를 그대로 반대로 낸다
async function rlPerpClose(inst, ratio) {
  const j = await rlOkx("/api/v5/account/positions?instType=SWAP&instId="
                        + encodeURIComponent(inst));
  const p = ((j.data || [])[0]) || null;
  if (!p) throw new Error("거래소에 그 자리가 없습니다");
  const ct = rlNum(p.pos);
  if (!ct) throw new Error("계약 수가 0입니다");
  const lot = await rlLotSz(inst);
  let sz = Math.abs(ct) * Math.max(0, Math.min(1, ratio || 1));
  sz = Math.max(lot, Math.floor(sz / lot) * lot);
  sz = +sz.toFixed(8);
  const b = {instId: inst, tdMode: "isolated", ordType: "market", sz: String(sz),
             side: (ct > 0 ? "sell" : "buy")};
  if ((await rlPosMode()) === "long_short_mode") b.posSide = (ct > 0 ? "long" : "short");
  else b.reduceOnly = true;
  return rlOkxPost("/api/v5/trade/order", b);
}
// ── 국내 시세를 폰이 직접 (사용자 자기 키) ─────────────────────
// 🔴 ka10001 실측 칸: stk_nm · cur_prc · open_pric · base_pric(전일종가) · trde_qty
//    값에 부호가 붙어 오므로 절대값을 쓴다(서버도 그렇게 한다).
// 🔴 거래대금·체결강도는 이 TR 에 **없다** — 허브가 채워 준다.
function rlAbs(v) {
  const n = parseFloat(String(v == null ? "" : v).replace(/--/g, "-").replace(/[^0-9.\-]/g, ""));
  return isFinite(n) ? Math.abs(n) : 0;
}

async function rlParseCoin(j) {

              qty: ct * cv, ctr: ct, cv: cv,

              side: (ct >= 0 ? "L" : "S"),

              evl: rlNum(p.margin) || rlNum(p.imr), pl: rlNum(p.upl),
              rt: rlNum(p.uplRatio) * 100});

}

//    OKX 가 평단(accAvgPx)까지 주므로 수익률도 낼 수 있다.
//    자금(Funding) 계좌는 따로다(/api/v5/asset/balances) — 실측 때 비어 있었다.
function rlParseSpot(det) {
  const out = [];
  for (let i = 0; i < (det || []).length; i++) {
    const d = det[i];
    const ccy = String(d.ccy || "");
    if (!ccy || ccy === "USDT") continue;          // USDT 는 예수금이지 보유가 아니다
    const qty = rlNum(d.cashBal) || rlNum(d.availBal);
    const evl = rlNum(d.eqUsd);
    if (!(qty > 0) || evl < 1) continue;           // 먼지는 버린다
    const avg = rlNum(d.accAvgPx);
    const cur = qty ? (evl / qty) : 0;
    const pl = avg ? (cur - avg) * qty : 0;
    out.push({mk: "coin", spot: true, ccy: "USDT",
              code: ccy + "-USDT", name: ccy,
              qty: qty, ctr: qty, cv: 1, lev: 1, side: "L",
              avg: avg, cur: cur, evl: evl, pl: pl,
              rt: (avg && qty) ? (pl / (avg * qty) * 100) : 0});
  }

// 70영업일(60일 만기를 보려고)까지 · 초당 4회 이하 · 폰에 저장 · 수량이 바뀐 종목만 다시 찾는다(하루 한 번).
const RL_HS_KEY = "hold_since_v1";
function rlHsGet() { try { return JSON.parse(localStorage.getItem(RL_HS_KEY) || "{}"); } catch (e) { return {}; } }
function rlHsSave(o) { try { localStorage.setItem(RL_HS_KEY, JSON.stringify(o)); } catch (e) {} }
let RL_HS_BUSY = false;
async function rlHoldSince() {
  if (RL_HS_BUSY || !(ST.kr && ST.kr.key && ST.kr.sec)) return;
  const hs = rlHsGet(), today = new Date().toISOString().slice(0, 10), want = {};
  hs._t = hs._t || {};
  const codes = (RL.kr || []).map(function (p) { return p.code; });
  Object.keys(hs).forEach(function (c) { if (c !== "_t" && codes.indexOf(c) < 0) delete hs[c]; });
  (RL.kr || []).forEach(function (p) {
    const h = hs[p.code];
    if ((!h || h.q !== p.qty) && hs._t[p.code] !== today) want[p.code] = p.qty;
  });
  if (!Object.keys(want).length) { rlHsSave(hs); return; }
  RL_HS_BUSY = true;
  try {
    const tok = await rlToken(), net = {}, got = {};
    Object.keys(want).forEach(function (c) { net[c] = 0; });
    let seen = 0;
    for (let k = 0; seen < 70 && k < 140 && Object.keys(got).length < Object.keys(want).length; k++) {
      const d = new Date(); d.setDate(d.getDate() - k);
      const w = d.getDay(); if (w === 0 || w === 6) continue;
      seen++;
      const ds = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
      let j = null;
      try { j = await rlKiwoom(tok, "/api/dostk/acnt", "ka10170", {base_dt: ds, ottks_tp: "1", ch_crd_tp: "0"}); } catch (e) {}
      await new Promise(function (r) { setTimeout(r, 260); });
      if (!j || String(j.return_code) !== "0") continue;
      for (const kk in j) {
        if (!Array.isArray(j[kk])) continue;
        j[kk].forEach(function (r) {
          const c = String(r.stk_cd || "").replace(/^A/, "").replace(/_.*$/, "");
          if (!(c in want) || got[c]) return;
          const bq = rlNum(r.buy_qty), sq = rlNum(r.sell_qty);
          net[c] += bq - sq;
          if (bq > 0 && net[c] >= want[c] - 0.001) got[c] = ds;
        });
      }
    }
    Object.keys(want).forEach(function (c) { if (got[c]) hs[c] = {d: got[c], q: want[c]}; hs._t[c] = today; });
    rlHsSave(hs);
  } finally {
    RL_HS_BUSY = false;
    try { dpHoldRender(); } catch (e) {}
    try { recoRender(); } catch (e) {}
  }
}
// 산 날부터 오늘까지 영업일 수(주말 뺌) — 못 찾았으면 null
function rlHeldDays(code) {
  const h = rlHsGet()[code]; if (!h || !h.d) return null;
  const s = h.d, a = new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)), b = new Date();
  let n = 0;
  for (let d = new Date(a); d < b; d.setDate(d.getDate() + 1)) { const w = d.getDay(); if (w !== 0 && w !== 6) n++; }
  return {since: s, days: n};
}

// ── OKX 공개 시세 (사장님 2026-09-19 — 코인은 전부 OKX 기준) ──
// 🔴 키 없이 받는 공개 자료다. 돌려주는 모양은 옛 바이낸스 응답과 같게 맞춰 나머지 코드를 안 건드린다.
// 🔴 kind: "F"=무기한선물(BTC-USDT-SWAP) · "S"=현물(BTC-USDT). 선물 거래량은 volCcy24h(코인 수)다.
function okxId(sym,kind){ return String(sym).replace(/-.*$/,"").replace(/USDT$/,"")+"-USDT"+(kind==="F"?"-SWAP":""); }
async function okxTicker(sym,kind){
  const j=await fetch("https://www.okx.com/api/v5/market/ticker?instId="+okxId(sym,kind)).then(function(r){return r.json();});
  const t=(j&&j.data||[])[0]; if(!t) throw new Error("okx ticker");
  const last=+t.last, open=+t.open24h, base=(kind==="F")?+t.volCcy24h:+t.vol24h;
  return {lastPrice:last, price:last, priceChangePercent:open?((last/open-1)*100):0,
          volume:base, quoteVolume:(kind==="F")?base*last:+t.volCcy24h};
}
async function okxKlines(sym,kind,iv,limit){
  const bar={"3m":"3m","5m":"5m","15m":"15m","30m":"30m","1h":"1H","1d":"1Dutc","1w":"1Wutc"}[iv]||"1Dutc";   // 일봉은 UTC 경계(한국 09:00)
  const id=okxId(sym,kind); let out=[];
  let j=await fetch("https://www.okx.com/api/v5/market/candles?instId="+id+"&bar="+bar+"&limit="+Math.min(300,limit)).then(function(r){return r.json();});
  out=(j&&j.data)||[];
  while(out.length&&out.length<limit){          // 한 번에 300봉까지 — 1년치는 나눠 받는다
    j=await fetch("https://www.okx.com/api/v5/market/history-candles?instId="+id+"&bar="+bar
                  +"&limit="+Math.min(100,limit-out.length)+"&after="+out[out.length-1][0]).then(function(r){return r.json();});
    const more=(j&&j.data)||[]; if(!more.length)break; out=out.concat(more);
  }
  // 새것→옛것 순을 뒤집고, 바이낸스 칸 자리로: [시각,시,고,저,종,거래량(코인),_,거래대금(USDT)]
  return out.reverse().map(function(c){ return [+c[0],c[1],c[2],c[3],c[4],(kind==="F")?c[6]:c[5],0,c[7]]; });
}
let _okxList=null;
async function okxBases(){
  if(_okxList)return _okxList;
  const g=function(t){ return fetch("https://www.okx.com/api/v5/public/instruments?instType="+t).then(function(r){return r.json();}); };
  const sp=await g("SPOT"), sw=await g("SWAP");
  const S=new Set(((sp&&sp.data)||[]).filter(function(i){return i.quoteCcy==="USDT"&&i.state==="live";}).map(function(i){return i.baseCcy;}));
  const F=new Set(((sw&&sw.data)||[]).filter(function(i){return i.settleCcy==="USDT"&&i.state==="live";}).map(function(i){return i.ctValCcy;}));
  const all=Array.from(new Set(Array.from(F).concat(Array.from(S)))).sort();
  _okxList={all:all,S:S,F:F}; return _okxList;
}

function dpOrder(side){
  const en=LANG==="en";
  if(dpBusyS){ dpMsg("dpMsg",en?"Previous order in flight":"앞 주문을 보내는 중입니다"); return; }
  if(!stkCode){ dpMsg("dpMsg",en?"Pick a stock":"종목을 먼저 고르세요"); return; }
  const mk=stkMarket==="us"?"us":"kr", key=mk+":"+stkCode;
  const qty=dpNum(E("dpQty").value), ask=dpNum(E("dpPx").value);
  const cur=dpPx[key]||0;
  if(qty<=0){ dpMsg("dpMsg",en?"Enter quantity":"수량을 넣으세요"); return; }
  if(cur<=0){ dpMsg("dpMsg",en?"No price yet":"현재가를 아직 못 받았습니다"); return; }
  const px=ask>0?ask:cur;
  // 🔴 실주문 — 키움으로 진짜 나간다. 장부는 안 건드린다(실계좌 갱신이 가져온다).
  if(typeof rlCanLiveStock==="function" && rlCanLiveStock(mk)){
    const oc=(mk==="us")?String(stkCode).replace(/\.US$/,""):stkCode;
    if(!dpAsk((en?"REAL ":"실주문 · ")+(side==="B"?(en?"BUY ":"매수 "):(en?"SELL ":"매도 "))+oc
              +"  "+qty+(en?" shares":"주")
              +(ask>0?(" @ "+ask):(en?" (market)":" (시장가)"))))return;
    dpBusyS=true; dpMsg("dpMsg",en?"Sending to Kiwoom…":"키움으로 보내는 중…");
    rlStockOrder(mk,side,oc,qty,ask>0?ask:0).then(function(res){
      DP.log.unshift({oid:rlOrdId(res),lim:ask>0,ts:Date.now(),t:dpNow(),kind:mk,code:oc,name:(E("stkq").value||oc),side:side,
                      qty:qty,px:px,
                      how:(ask>0?(en?"limit":"지정가"):(en?"market":"시장가"))
                          +(en?" · REAL":" · 실주문")});
      DP.log=DP.log.slice(0,60); dpSave(); dpBusyS=false;
      dpMsg("dpMsg",en?"Sent to Kiwoom":"키움으로 나갔습니다");
      try{ rlLoad(true); }catch(e){}
    }).catch(function(e){
      dpBusyS=false; dpMsg("dpMsg",(en?"Rejected: ":"거부됨: ")+(e&&e.message||e));
    });
    return;
  }
  dpBusyS=true; dpMsg("dpMsg",(en?"Sending… ":"주문 내는 중… ")+(ask>0?(en?"limit":"지정가"):(en?"market":"시장가")));
  setTimeout(function(){                       // 주문 → 체결까지의 흐름을 보이게 한다
    const p=DP.pos[key]||{mk:mk,code:stkCode,name:(E("stkq").value||stkCode),qty:0,avg:0};
    if(side==="B"){
      const cost=px*qty;
      p.avg=(p.avg*p.qty+cost)/(p.qty+qty); p.qty+=qty;
      if(mk==="kr")DP.krw-=cost; else DP.usd-=cost;
    }else{
      if(p.qty<qty){ dpBusyS=false; dpMsg("dpMsg",en?"Not enough holdings":"보유 수량이 모자랍니다"); return; }
      p.qty-=qty;
      if(mk==="kr")DP.krw+=px*qty; else DP.usd+=px*qty;
    }
    DP.pos[key]=p; if(p.qty<=0)delete DP.pos[key];
    DP.log.unshift({t:dpNow(),kind:mk,code:stkCode,name:p.name,side:side,qty:qty,px:px,

function dpCoinSpot(side){
  const en=LANG==="en";

  const pk="coin:"+coinSym, cur=dpPx[pk]||0, key="coinS:"+coinSym;
  const amt=dpNum(E("dpSpQ")&&E("dpSpQ").value);     // 🔴 USDT 금액이다 — 코인 수량이 아니다
  const isLim=!!(E("dpTpL")&&E("dpTpL").classList.contains("on"));
  const lim=isLim?dpNum(E("dpCPx").value):0;
  if(amt<=0){ dpMsg("dpMsgC",en?"Enter amount (USDT)":"금액(USDT)을 넣으세요"); return; }

  const fill=isLim?lim:cur;
  const p=DP.pos[key]||{mk:"coinS",code:coinSym,name:coinSym,qty:0,avg:0};
  const q=amt/fill;                                  // 금액 → 코인 수량
  // 🔴 이 길은 **매수 전용**이다. 파는 것은 dpSpotSell() 의 수량 판으로 간다.
  if(amt>DP.usdt){ dpMsg("dpMsgC",en?"Not enough USDT":"USDT가 모자랍니다"); return; }
  // 🔴 실주문이면 거래소로 보낸다. 장부는 건드리지 않는다 — 실계좌 갱신이 가져온다.
  if(dpLive()){
    const inst=String(coinSym).replace(/USDT$/,"")+"-USDT";
    if(!dpAsk((en?"REAL spot BUY ":"실주문 · 현물 매수 ")+inst+"  "+amt+" USDT"
              +(isLim?(" @ "+lim):(en?" (market)":" (시장가)"))))return;
    dpBusyC=true; dpMsg("dpMsgC",en?"Sending to OKX…":"OKX 로 보내는 중…");
    rlSpotBuy(inst,amt,isLim?lim:0).then(function(res){
      DP.log.unshift({oid:rlOrdId(res),lim:!!isLim,ts:Date.now(),t:dpNow(),kind:"coin",code:coinSym,name:coinSym,side:"B",qty:q,px:fill,
        how:(en?"spot ":"현물 ")+(isLim?(en?"limit":"지정가"):(en?"market":"시장가"))
            +(en?" · REAL":" · 실주문")});
      DP.log=DP.log.slice(0,60); dpSave(); dpBusyC=false;
      dpMsg("dpMsgC",(en?"Sent to OKX ":"OKX 로 나갔습니다 ")+amt+" USDT");
      try{ rlLoad(true); }catch(e){}          // 실계좌를 바로 다시 읽는다
    }).catch(function(e){
      dpBusyC=false; dpMsg("dpMsgC",(en?"Rejected: ":"거부됨: ")+(e&&e.message||e));
    });
    return;
  }
  dpBusyC=true; dpMsg("dpMsgC",en?"Sending…":"주문 내는 중…");
  setTimeout(function(){
    const cost=fill*q;
    p.avg=(p.avg*p.qty+cost)/(p.qty+q); p.qty+=q; DP.usdt-=cost;
    DP.pos[key]=p;
    DP.log.unshift({t:dpNow(),kind:"coin",code:coinSym,name:coinSym,side:"B",qty:q,px:fill,
      how:(en?"spot ":"현물 ")+(isLim?(en?"limit":"지정가"):(en?"market":"시장가"))});

      +"$"+(+cost.toFixed(2)).toLocaleString()+" · "+(+q.toFixed(8))+" "+_sym
      +" @ $"+fill.toLocaleString());
  },420);
}

// \U0001f534 매도·청산 판은 모의 줄과 실계좌 줄이 같이 쓴다.
//    실계좌 줄은 DP.pos 에 없으므로 여기서 모의 줄 **모양으로 맞춰** 돌려준다.
//    열쇠는 "real:<번째>". _real 이 붙은 것은 장부를 고치면 안 된다.
function dpPosOf(key){
  const k=String(key||"");
  if(k.indexOf("real:")!==0) return DP.pos[k];
  const rows=(typeof rlRows==="function")?rlRows():[];
  const p=rows[+k.slice(5)]; if(!p) return null;
  const px=(typeof rlPxKey==="function")?rlPxKey(p):"";
  // 🔴 실계좌 코인 현물은 청산이 아니라 **매도**다 — 주식과 같은 수량 판으로 보낸다.
  //    OKX 는 선물(positions)과 현물(계좌 잔고)을 보는 자리가 다르고, 파는 법도 다르다.
  if (p.mk==="coin" && p.spot)
    return {mk:"coinS",code:String(p.code).split("-").slice(0,2).join(""),
            name:p.name||p.code,qty:p.qty,avg:p.avg,
            _real:true,_pxkey:px,_cur:p.cur};
  return (p.mk==="coin")
    ? {mk:"coin",code:p.code,name:p.code,side:p.side,lev:p.lev||1,
       margin:p.evl,entry:p.avg,_real:true,_pxkey:px,_cur:p.cur}
    : {mk:p.mk,code:p.code,name:p.name,qty:p.qty,avg:p.avg,
       _real:true,_pxkey:px,_cur:p.cur};
}
function dpPxOf(key,p){
  if(p&&p._real) return dpPx[p._pxkey]||p._cur||0;
  return dpPx[key]||0;
}

// 코인 자리 청산 — 표에서도 부른다. 손익(USDT)을 돌려준다(자리 없으면 null)
function dpCloseKey(key,ratio){
  const p=DP.pos[key]; if(!p||p.mk!=="coin")return null;
  const r=Math.max(0,Math.min(1,ratio==null?1:ratio)); if(r<=0)return null;
  const cur=dpPx[key]||p.entry;
  const part=p.margin*r;
  const pnl=(p.side==="L"?1:-1)*(cur/p.entry-1)*p.lev*part;
  DP.usdt+=part+pnl;
  if(r>=0.999)delete DP.pos[key]; else { p.margin-=part; DP.pos[key]=p; }
  DP.log.unshift({t:dpNow(),kind:"coin",code:p.code,name:p.code,side:"X",qty:part,px:cur,
                  how:(LANG==="en"?((p.side==="L"?"long":"short")+" close "):
                       ((p.side==="L"?"롱":"숏")+" 청산 "))+Math.round(r*100)+"%",pnl:pnl});
  DP.log=DP.log.slice(0,60); dpSave(); dpRender();
  return pnl;
}

  if(amt<=0){ E("dpCloseMsg").textContent=en?"Enter an amount":"수량을 넣으세요"; return; }

  if(p._real&&dpLive()){
    // 🔴 실주문 — 거래소가 들고 있는 계약 수를 그대로 반대로 낸다

                      px:dpPxOf(key,p)||p.entry,
                      how:(en?"close ":"청산 ")+Math.round(r*100)+"%"+(en?" · REAL":" · 실주문")});
      DP.log=DP.log.slice(0,60); dpSave();
      E("dpCloseMsg").textContent=en?"Sent to OKX":"OKX 로 나갔습니다";

      setTimeout(dpCloseCancel,1200);
    }).catch(function(e){
      E("dpCloseMsg").textContent=(en?"Rejected: ":"거부됨: ")+(e&&e.message||e);
    });
    return;
  }
  if(p._real){
    const cur=dpPxOf(key,p)||p.entry;
    const pl=(p.side==="L"?1:-1)*(cur/p.entry-1)*(p.lev||1)*amt;
    DP.log.unshift({t:dpNow(),kind:"coin",code:p.code,name:p.code,side:"X",qty:amt,px:cur,

                    pnl:pl});

  dpMsg("dpMsgC",(en?"Closed ":"청산 ")+Math.round(r*100)+"% · "+(pnl>=0?"+":"")+pnl.toFixed(2)+" USDT");

// 수량 뒤에 붙는 단위 — 코인 현물은 "주"가 아니라 코인 이름이다

function dpSellCancel(){ dpSellCur=null; const b=E("dpClose"); if(b)b.innerHTML=""; }

function dpSellTp(limit){

function dpSellSync(from){
  const p=dpPosOf(dpSellCur); if(!p)return;
  const rng=E("dpSRng"), q=E("dpSQty"); if(!rng||!q)return;
  // 🔴 코인은 소수점이 있다. 주식처럼 버리면 0 이 된다.
  if(from===1){ const raw=p.qty*(+rng.value)/100;
    q.value=(p.mk==="coinS")?(+raw.toFixed(8)):Math.max(0,Math.floor(raw)); }
  else { let v=dpNum(q.value); if(v>p.qty)v=p.qty; rng.value=Math.round(v/p.qty*100); }
  const en=LANG==="en";
  E("dpSellMsg").textContent=(en?"Selling ":"매도 ")+rng.value+"% · "+(+q.value).toLocaleString()
    +(p.mk==="coinS"?dpUnit(p,en):(en?" shares":"주"));
}
function dpSellGo(){
  const en=LANG==="en", key=dpSellCur, p=dpPosOf(key);
  if(!p){ dpSellCancel(); return; }
  const q=dpNum(E("dpSQty").value);
  if(q<=0){ E("dpSellMsg").textContent=en?"Enter quantity":"수량을 넣으세요"; return; }
  if(q>p.qty){ E("dpSellMsg").textContent=en?"Not enough holdings":"보유 수량이 모자랍니다"; return; }
  const isLim=!!(E("dpSL")&&E("dpSL").classList.contains("on"));
  const lim=isLim?dpNum(E("dpSPx").value):0;
  if(isLim&&lim<=0){ E("dpSellMsg").textContent=en?"Enter limit price":"지정가 가격을 넣으세요"; return; }
  const px=isLim?lim:(dpPxOf(key,p)||p.avg);
  const pnl=(px-p.avg)*q;                       // 실현손익
  const how=(isLim?(en?"limit":"지정가"):(en?"market":"시장가"));
  if(p._real&&p.mk==="coinS"&&dpLive()){
    // 🔴 실주문 — 코인 현물 매도. 수량(코인 수)으로 낸다.
    const inst=String(p.code).replace(/USDT$/,"")+"-USDT";
    if(!dpAsk((en?"REAL spot SELL ":"실주문 · 현물 매도 ")+inst+"  "+(+q.toFixed(8))
              +(isLim?(" @ "+lim):(en?" (market)":" (시장가)"))))return;
    E("dpSellMsg").textContent=en?"Sending to OKX…":"OKX 로 보내는 중…";
    rlSpotSell(inst,q,isLim?lim:0).then(function(res){
      DP.log.unshift({oid:rlOrdId(res),lim:!!isLim,ts:Date.now(),t:dpNow(),kind:"coin",code:p.code,name:p.name,side:"S",qty:q,px:px,
                      how:how+(en?" · REAL":" · 실주문"),pnl:pnl});
      DP.log=DP.log.slice(0,60); dpSave();
      E("dpSellMsg").textContent=en?"Sent to OKX":"OKX 로 나갔습니다";
      try{ rlLoad(true); }catch(e){}
      setTimeout(dpSellCancel,1200);
    }).catch(function(e){
      E("dpSellMsg").textContent=(en?"Rejected: ":"거부됨: ")+(e&&e.message||e);
    });
    return;
  }
  if(p._real&&(p.mk==="kr"||p.mk==="us")
     &&typeof rlCanLiveStock==="function"&&rlCanLiveStock(p.mk)){
    // 🔴 실주문 — 들고 있는 주식을 진짜로 판다
    const oc=(p.mk==="us")?String(p.code).replace(/\.US$/,""):p.code;
    if(!dpAsk((en?"REAL SELL ":"실주문 · 매도 ")+oc+"  "+q+(en?" shares":"주")
              +(isLim?(" @ "+lim):(en?" (market)":" (시장가)"))))return;
    E("dpSellMsg").textContent=en?"Sending to Kiwoom…":"키움으로 보내는 중…";
    rlStockOrder(p.mk,"S",oc,q,isLim?lim:0).then(function(res){
      DP.log.unshift({oid:rlOrdId(res),lim:!!isLim,ts:Date.now(),t:dpNow(),kind:p.mk,code:oc,name:p.name,side:"S",qty:q,px:px,
                      how:how+(en?" · REAL":" · 실주문"),pnl:pnl});
      DP.log=DP.log.slice(0,60); dpSave();
      E("dpSellMsg").textContent=en?"Sent to Kiwoom":"키움으로 나갔습니다";
      try{ rlLoad(true); }catch(e){}
      setTimeout(dpSellCancel,1200);
    }).catch(function(e){
      E("dpSellMsg").textContent=(en?"Rejected: ":"거부됨: ")+(e&&e.message||e);
    });
    return;
  }
  if(p._real){
    // 🔴 실계좌 줄은 증권사가 가진 값이다. 여기서 줄이면 1분 뒤 되돌아와 거짓말이 된다.
    DP.log.unshift({t:dpNow(),kind:p.mk,code:p.code,name:p.name,side:"S",qty:q,px:px,
                    how:how+(en?" · demo":" · 모의"),pnl:pnl});
    DP.log=DP.log.slice(0,60); dpSave(); dpRender();
    dpDemoSaid("dpSellMsg",en); return;
  }
  p.qty-=q;
  // 🔴 코인 현물을 팔면 원화·달러가 아니라 USDT 로 들어온다
  if(p.mk==="kr")DP.krw+=px*q; else if(p.mk==="coinS")DP.usdt+=px*q; else DP.usd+=px*q;
  if(p.qty<=0)delete DP.pos[key]; else DP.pos[key]=p;
  DP.log.unshift({t:dpNow(),kind:p.mk,code:p.code,name:p.name,side:"S",qty:q,px:px,
                  how:(isLim?(en?"limit":"지정가"):(en?"market":"시장가")),pnl:pnl});
  DP.log=DP.log.slice(0,60); dpSave(); dpRender();
  dpSellCancel();
}
// [내 보유종목] 카드 — 주식과 코인을 한 표에. 지움(✕) 대신 매도·청산.
function dpHoldRender(){
  const en=LANG==="en", box=E("mhBody"); if(!box)return;
  // 🔴 매도·청산 판이 열려 있으면 표를 다시 그리지 않는다 — 그리면 판이 사라진다(10초 갱신)
  if(dpCloseCur||dpSellCur)return;
  const keys=Object.keys(DP.pos);
  const real=(typeof rlRows==="function")?rlRows():[];
  if(!keys.length && !real.length){ box.innerHTML='<div class="mhempty">'+(en
    ?"Buy a stock or coin below, or load your real account above."
    :"아래에서 종목이나 코인을 사거나, 위에서 실계좌를 불러오세요.")+'</div>'; return; }
  const cls=x=>x>0?"up":(x<0?"dn":"fl"), arw=x=>x>0?"▲":(x<0?"▼":"");
  let h='<table class="mhtab"><tr><th>'+(en?"Item":"종목")+'</th><th>'+(en?"Qty<br>Margin":"수량<br>증거금")
   +'</th><th>'+(en?"Entry":"매입<br>진입")+'</th><th>'+(en?"Now":"현재가")+'</th><th>'+(en?"Value":"평가")
   +'</th><th>'+(en?"P/L amt<br>P/L %":"손익금<br>손익률")+'</th><th></th></tr>';
  // 🔴 실계좌 줄이 먼저 — 증권사·거래소에서 그대로 받은 값이다.
  //    단위가 셋 다 달라 여기서 한 표로 맞춘다(원/달러/USDT, 주/계약).
  real.forEach(function(p,ri){
    // 🔴 증권사 손익금엔 수수료·세금이 들어 있다. 다시 곱하지 말고 **차이만 더한다**.
    //    그래야 값이 안 튀고, 새 시세가 아직 없으면 받은 값 그대로 남는다.
    // 🔴 기준점은 증권사가 준 값이 아니라 **처음 본 시세**다.
    //    바이낸스 현물과 OKX 마크값은 같은 순간에도 다르다 — 섞어 빼면 그 차이가 손익으로 둔갑한다.
    const live=dpPx[rlPxKey(p)]||0;
    if(live && !p.px0) p.px0=live;
    const cur=live||p.cur;
    const dx=(live&&p.px0)?((live-p.px0)*p.qty):0;
    // 🔴 코인도 $ 로 적는다 — USDT 네 글자가 칸을 밀어낸다. 뜻은 표 아래 주석에.
    const mny=function(v){ return (p.mk==="kr")?(Math.round(v).toLocaleString()+"원")
      :("$"+v.toLocaleString(undefined,{maximumFractionDigits:2})); };
    // 🔴 평가 칸은 자산을 안 가리고 같은 셈이다 — 수량 × 현재가.
    //    코인도 명목가치를 적는다(OKX 의 Size 와 같은 값). 증거금은 머리글대로 수량 아래.
    const evl=(p.mk==="coin")?(Math.abs(p.qty)*cur):(p.evl+dx);
    const pl=p.pl+dx;
    // 손익률 바닥 — 선물은 증거금(OKX 와 같게), 현물은 산 돈(평단×수량)
    const base=(p.mk==="coin"&&!p.spot)?p.evl:(p.avg*p.qty);
    const rt=base?(pl/base*100):p.rt;
    const unit=(p.mk==="coin")?"계약":"주";
    // 코인은 계약 수 옆에 코인 수, 그 아래에 증거금 — 0.13 계약(0.0013 BTC) / 49.55 USDT
    const sym=(p.mk==="coin")?String(p.code).split("-")[0]:"";
    const qtx=(p.mk==="coin"&&p.spot)
      ? ((+p.qty.toFixed(8))+" "+sym+"<br><span class=\"dplbl\">-</span>")   // 현물엔 증거금이 없다
      : (p.mk==="coin")
      ? ("<span title=\""+p.ctr.toLocaleString()+" "+unit+"\">"
         +(+p.qty.toFixed(8))+" "+sym+"</span><br>"+mny(p.evl))
      : (p.qty.toLocaleString()+" "+unit);
    // 🔴 OKX 는 선물과 현물을 보는 자리가 다르다 — 선물은 positions, 현물은 계좌 잔고.
    //    한 표에 같이 올리므로 배지로 갈라 적는다.
    const tag=(p.mk==="kr")?"KR":(p.mk==="us")?"US"
      :p.spot?(en?"SPOT":"현물")
      :((en?"PERP ":"선물 ")+(p.side==="L"?(en?"LONG":"롱"):(en?"SHORT":"숏"))+" "+p.lev+"x");
    const tagc=(p.mk==="coin")?(p.spot?" sp":" fu"):"";
    h+='<tr><td>'+dpEsc(p.name||p.code)+' <span class="mkt'+tagc+'">'+tag+'</span>'
     +'<span class="rlb">'+(en?"REAL":"실계좌")+'</span>'
     +((p.mk==="kr"&&typeof rlHeldDays==="function"&&rlHeldDays(p.code))
        ?'<br><span class="dplbl">'+(en?"day ":"")+rlHeldDays(p.code).days+(en?"":"일째")+'</span>':'')+'</td>'
     +'<td>'+qtx+'</td><td>'+mny(p.avg)+'</td><td>'+mny(cur)+'</td>'
     +'<td>'+mny(evl)+'</td>'
     +'<td class="'+cls(pl)+'">'+(pl>=0?"+":"-")+mny(Math.abs(pl))
     +'<br>'+arw(pl)+Math.abs(rt).toFixed(2)+'%</td>'
     +'<td><button class="dpb '+((p.mk==="coin"&&!p.spot)?"flat":"sell")+' dpsm" onclick="dpSellKey(\'real:'
     +ri+'\')">'+((p.mk==="coin"&&!p.spot)?(en?"CLOSE":"청산"):(en?"SELL":"매도"))+'</button></td></tr>';
  });
  keys.forEach(function(k){
    const p=DP.pos[k], cur=dpPx[k]||0;
    if(p.mk==="coin"){
      const pnl=cur?((p.side==="L"?1:-1)*(cur/p.entry-1)*p.lev*p.margin):0;
      const pct=cur?((p.side==="L"?1:-1)*(cur/p.entry-1)*p.lev*100):0;
      h+='<tr><td>'+dpEsc(p.code)+' <span class="mkt fu">'+(en?"PERP":"선물")+' '
       +(p.side==="L"?(en?"LONG":"롱"):(en?"SHORT":"숏"))+' '+p.lev+'x</span></td>'
       // 🔴 머리글대로 수량 위·증거금 아래 — 실계좌 줄과 같게(코인 수 = 증거금×배율÷진입가). 2026-09-19 도면에서 빠진 것 발견
       +'<td>'+(+(p.margin*p.lev/p.entry).toFixed(6))+' '+String(p.code).replace(/USDT$/,'')+'<br>'+p.margin.toLocaleString()+' USDT</td><td>$'+p.entry.toLocaleString()+'</td>'
       +'<td>'+(cur?("$"+cur.toLocaleString()):"-")+'</td><td>'+(cur?((p.margin+pnl).toFixed(2)+" USDT"):"-")+'</td>'
       +'<td class="'+cls(pnl)+'">'+(cur?((pnl>=0?"+":"-")+Math.abs(pnl).toFixed(2)+" USDT<br>"
         +arw(pnl)+Math.abs(pct).toFixed(2)+"%"):"-")+'</td>'
       +'<td><button class="dpb flat dpsm" onclick="dpSellKey(\''+k+'\')">'+(en?"CLOSE":"청산")+'</button></td></tr>';
    }else if(p.mk==="coinS"){
      // 🔴 현물은 주식 줄과 같은 셈이다 — 수량 × 현재가. 증거금도 배율도 없다.
      const sym=String(p.code).replace(/USDT$/,"");
      const pct=cur?((cur-p.avg)/p.avg*100):0;
      const pl=cur?((cur-p.avg)*p.qty):0;
      h+='<tr><td>'+dpEsc(p.code)+' <span class="mkt sp">'+(en?"SPOT":"현물")+'</span></td>'
       +'<td>'+(+p.qty.toFixed(8))+' '+sym+'</td><td>$'+p.avg.toLocaleString()+'</td>'
       +'<td>'+(cur?("$"+cur.toLocaleString()):"-")+'</td>'
       +'<td>'+(cur?("$"+(cur*p.qty).toLocaleString(undefined,{maximumFractionDigits:2})):"-")+'</td>'
       +'<td class="'+cls(pl)+'">'+(cur?((pl>=0?"+":"-")+"$"+Math.abs(pl).toLocaleString(undefined,{maximumFractionDigits:2})
         +"<br>"+arw(pl)+Math.abs(pct).toFixed(2)+"%"):"-")+'</td>'
       +'<td><button class="dpb sell dpsm" onclick="dpSellKey(\''+k+'\')">'+(en?"SELL":"매도")+'</button></td></tr>';
    }else{
      const pct=cur?((cur-p.avg)/p.avg*100):0;
      h+='<tr><td>'+dpEsc(p.name)+' <span class="mkt'+(p.mk==="us"?" us":"")+'">'+(p.mk==="us"?"US":"KR")+'</span></td>'
       +'<td>'+p.qty.toLocaleString()+'</td><td>'+dpMoney(p.mk,p.avg)+'</td>'
       +'<td>'+(cur?dpMoney(p.mk,cur):"-")+'</td><td>'+(cur?dpMoney(p.mk,cur*p.qty):"-")+'</td>'
       +'<td class="'+cls(pct)+'">'+(cur?((pct>=0?"+":"-")+dpMoney(p.mk,Math.abs((cur-p.avg)*p.qty))
         +"<br>"+arw(pct)+Math.abs(pct).toFixed(2)+"%"):"-")+'</td>'
       +'<td><button class="dpb sell dpsm" onclick="dpSellKey(\''+k+'\')">'+(en?"SELL":"매도")+'</button></td></tr>';
    }
  });
  const hasCoin=real.some(function(x){return x.mk==="coin";})
    || keys.some(function(k){return k.indexOf("coin:")===0||k.indexOf("coinS:")===0;});
  const note=hasCoin?('<div class="mhnote">'+(en
    ? "In crypto, $ means USDT."
    : "암호화폐에서 $는 USDT를 의미함")+'</div>'):"";
  box.innerHTML=h+'</table>'+note+'<div id="dpClose"></div>';
}

// 원형 그래프 — 조각 = [이름, 원화 금액, 구분]. 큰 순서로 · 2% 미만은 '기타'로 묶는다.
function recoPie(parts){
  const en=LANG==="en";
  parts=parts.filter(function(p){return p[1]>0;}).sort(function(a,b){return b[1]-a[1];});
  const tot=parts.reduce(function(s,p){return s+p[1];},0); if(!(tot>0))return "";
  let small=0; const big=[];
  parts.forEach(function(p){ if(p[1]/tot<0.01)small+=p[1]; else big.push(p); });
  if(small>0)big.push([en?"Others":"기타",small,"etc"]);
  // 채도 낮춘 한 줄기 색띠 — 무지개로 흩뿌리지 않는다 (사장님 2026-09-20)
  const PAL=["#3D6B8E","#4C93A6","#5AA189","#C9A03F","#C4764F","#A85A66","#7A6B93","#4E7A5E",
             "#8E6E53","#5D7FA6","#B08A3E","#8F6A8C","#6B8F7A","#A9604E","#4B6E8A","#96884F"];
  let ci=0; const CASH=["#9AA3AB","#B7BEC4","#848D96"];
  big.forEach(function(p){ if(p[2]==="cash")p[3]=CASH[(ci++)%3]; });
  const col=function(p,i){ return p[2]==="cash"?p[3]:(p[2]==="etc"?"#868e96":PAL[i%PAL.length]); };
  // 색 밝기 조절 — 겉면 그라데이션·옆면(그늘)
  const sh=function(hex,f){ const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    const m=function(v){return Math.max(0,Math.min(255,Math.round(f<1?v*f:v+(255-v)*(f-1))));};
    return "#"+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1); };

  // 입체 — 타원으로 눕히고 옆면을 겹쳐 쌓아 두께를 만든다
  const cx=130, cy=92, rx=112, ry=64, dep=24;
  const uid="dp"+(recoPie.n=(recoPie.n||0)+1)+"_";       // 같은 화면에 둘 이상이면 id 가 겹친다
  const wedge=function(a0,a1,dy){
    const x0=cx+rx*Math.cos(a0), y0=cy+ry*Math.sin(a0)+dy;
    const x1=cx+rx*Math.cos(a1), y1=cy+ry*Math.sin(a1)+dy;
    return 'M'+cx+','+(cy+dy)+' L'+x0.toFixed(2)+','+y0.toFixed(2)
      +' A'+rx+','+ry+' 0 '+((a1-a0)>Math.PI?1:0)+',1 '+x1.toFixed(2)+','+y1.toFixed(2)+' Z'; };
  const disc=function(dy){ return '<ellipse cx="'+cx+'" cy="'+(cy+dy)+'" rx="'+rx+'" ry="'+ry+'"'; };

  const seg=[]; let a=-Math.PI/2;
  big.forEach(function(p,i){ const f=p[1]/tot;
    seg.push({c:col(p,i),f:f,a0:a,a1:a+f*2*Math.PI}); a+=f*2*Math.PI; });
  const one=(seg.length===1||seg[0].f>0.9999);

  let defs="",sides="",tops="",labels="";
  seg.forEach(function(x,i){
    defs+='<linearGradient id="'+uid+i+'" x1="0.1" y1="0" x2="0.5" y2="1">'
      +'<stop offset="0" stop-color="'+sh(x.c,1.3)+'"/>'

  ov.innerHTML = (typeof mpWait === "function") ? mpWait("3D 준비 중…") : '<div id="t3dmsg" style="background:rgba(0,0,0,0.72);padding:10px 16px;border-radius:12px;color:#cdd5e0">3D 준비 중…</div>';
  document.body.appendChild(ov);
  var data = [];
  for (var i = 0; i < list.length; i++) {
    var it = list[i], cs = null;
    try { cs = await bkBars(it); } catch (e) { cs = null; }
    var mm = document.querySelector("#tower3dOv .mpTxt") || document.getElementById("t3dmsg"); if (mm) mm.textContent = "3D 준비 중… " + (i + 1) + "/" + list.length;
    if (!cs || cs.length < 10) { data.push({ n: it.name, b: 100, r: 0, v: 1 }); continue; }
    var n = Math.min(60, cs.length - 1), from = cs[cs.length - 1 - n], to = cs[cs.length - 1];
    var r = (from > 0) ? (to / from - 1) : 0;
    var seg = cs.slice(cs.length - 1 - n), dd = [];
    for (var k = 1; k < seg.length; k++) dd.push(seg[k] / seg[k - 1] - 1);
    var m = dd.reduce(function (s, x) { return s + x; }, 0) / (dd.length || 1);
    var sd = Math.sqrt(dd.reduce(function (s, x) { return s + (x - m) * (x - m); }, 0) / (dd.length || 1)) * 100;
    data.push({ n: it.name, b: 100, r: +r.toFixed(4), v: +Math.max(0.05, sd).toFixed(2) });
  }
  if (!document.getElementById("tower3dOv")) return;
  var enc = ""; try { enc = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data))))); } catch (e) {}

    + '<button onclick="var o=document.getElementById(\'tower3dOv\');if(o)o.remove()" style="position:absolute;top:14px;right:14px;z-index:2;background:rgba(0,0,0,0.6);color:#fff;border:1px solid #666;border-radius:20px;width:42px;height:42px;font-size:20px;font-weight:800;cursor:pointer">\u2715</button>';
}
function bkRender(){
  var card=E("bkCard");
  if(!card){ var rc=E("recoCard"); if(!rc)return; card=document.createElement("div"); card.className="card"; card.id="bkCard"; rc.parentNode.insertBefore(card,rc.nextSibling); }

  if(!a.length){ h+='<div class="mhempty">'+KE("아직 담긴 종목이 없습니다.","No items yet.")+'</div>'; card.innerHTML=h; return; }

  h+='<div id="bkMsg" class="c21msg" hidden></div><div id="bkOut"></div>';
  h+='<div class="dpmsg" style="margin-top:6px">'+KE("과거 수익률이며 미래 수익을 보장하지 않습니다. 배당·세금·수수료는 뺀 값입니다.","Past returns; no guarantee of future returns. Excludes dividends, taxes and fees.")+'</div>';
  card.innerHTML=h;
}
async function bkRun(days){
  var a=bkGet(); if(!a.length)return;
  bkMsg(KE("받는 중\u2026 종목마다 몇 초 걸립니다","Loading\u2026 a few seconds per item"));
  E("bkOut").innerHTML="";
  var rows=[];
  for(var i=0;i<a.length;i++){
    var cs=null; try{ cs=await bkBars(a[i]); }catch(e){ cs=null; }
    if(!cs||cs.length<5){ rows.push({nm:a[i].name,err:true}); continue; }
    var n=Math.min(days,cs.length-1);
    var from=cs[cs.length-1-n], to=cs[cs.length-1];
    if(!(from>0)){ rows.push({nm:a[i].name,err:true}); continue; }
    rows.push({nm:a[i].name,r:to/from-1,n:n,cs:cs.slice(cs.length-1-n)});
  }
  var ok=rows.filter(function(x){ return !x.err; });
  if(!ok.length){ bkMsg(KE("자료를 못 받았습니다. 잠시 뒤 다시 눌러 주세요.","Could not load data. Please try again shortly.")); return; }
  bkMsg("");
  var L2=Math.min.apply(null,ok.map(function(x){ return x.cs.length; }));
  var daily=[];
  for(var t=1;t<L2;t++){ var s=0; ok.forEach(function(x){ var c=x.cs.slice(x.cs.length-L2); s+=c[t]/c[t-1]-1; }); daily.push(s/ok.length); }
  var eq=1; daily.forEach(function(r){ eq*=(1+r); });
  var worst=ok.slice().sort(function(p,q){ return p.r-q.r; })[0];
  var best=ok.slice().sort(function(p,q){ return q.r-p.r; })[0];
  var pc=function(v){ return (v>=0?"+":"")+(v*100).toFixed(1)+"%"; };
  var cls=function(v){ return v>0?"up":(v<0?"dn":"fl"); };
  var h='<table class="mhtab"><tr><th>'+KE("종목","Item")+'</th><th>'+(L2-1)+KE("일 수익률","-day return")+'</th></tr>';
  h+='<tr class="mhsum"><td style="text-align:left"><b>'+KE("바스켓(균등)","Basket (equal)")+'</b></td><td class="'+cls(eq-1)+'"><b>'+pc(eq-1)+'</b></td></tr>';
  ok.slice().sort(function(p,q){ return q.r-p.r; }).forEach(function(x){ h+='<tr><td style="text-align:left">'+dpEsc(x.nm)+'</td><td class="'+cls(x.r)+'">'+pc(x.r)+'</td></tr>'; });
  rows.filter(function(x){ return x.err; }).forEach(function(x){ h+='<tr><td style="text-align:left">'+dpEsc(x.nm)+'</td><td class="fl">'+KE("자료 없음","No data")+'</td></tr>'; });
  h+='</table>';
  h+='<div class="dpmsg">'+KE("제일 좋았던 것 ","Best: ")+dpEsc(best.nm)+' '+pc(best.r)+KE(' \u00b7 제일 나빴던 것 '," \u00b7 Worst: ")+dpEsc(worst.nm)+' '+pc(worst.r)+'</div>';
  E("bkOut").innerHTML=h;
}

function brandMark(){
  var k=(typeof LANG!=="undefined"&&LANG==="en")?"en":"ko";
  var m=MK[k], dk=MK[k+"_dark"];
  /* 밝은판·어두운판을 둘 다 넣고 CSS 가 고른다 — 테마를 바꿔도 다시 그릴 일이 없다 */
  return '<span class="mk"><img class="dk" alt="Daily Brief Live" src="'+dk.src+'">'
    +'<img class="lt" alt="" src="'+m.src+'">'
    +'<i style="left:'+(m.cx*100).toFixed(3)+'%;top:'+(m.cy*100).toFixed(3)
    +'%;width:'+(m.d*100).toFixed(3)+'%"></i></span>';
}
try{var _t=document.getElementById("ttl");if(_t)_t.innerHTML=brandMark();}catch(e){}
/* 고객의 소리 — 허브로 보낸다 */
function vcSend(){
  var el=document.getElementById("vcTxt"), msg=document.getElementById("vcMsg"), en=(typeof LANG!=="undefined"&&LANG==="en");
  var t=(el&&el.value||"").trim(); if(!t){ if(msg)msg.textContent=en?"Please write something.":"내용을 적어 주세요."; return; }
  var app=/\/demo\/|live-demo/.test(location.pathname)?"demo":"live";
  var vid=""; try{vid=localStorage.getItem("brief_vid")||"";}catch(e){}
  var base=(typeof HUB!=="undefined"&&HUB)?HUB.replace(/\/$/,""):"";
  if(!base){ if(msg)msg.textContent=en?"Not available here.":"여기서는 보낼 수 없습니다."; return; }
  fetch(base+"/voice?t="+encodeURIComponent(t)+"&app="+app+"&vid="+encodeURIComponent(vid),{cache:"no-store"})
    .then(function(r){return r.json();}).then(function(j){
      if(j&&j.ok){ el.value=""; if(msg)msg.textContent=en?"Sent. Thank you!":"보냈습니다. 고맙습니다!"; }
      else if(msg) msg.textContent=en?"Failed. Try again.":"보내지 못했습니다. 다시 눌러 주세요."; })
    .catch(function(){ if(msg)msg.textContent=en?"Failed. Try again.":"보내지 못했습니다. 다시 눌러 주세요."; });
}
(function(){ /* 영문 화면이면 칸 글자도 영어로 */
  function lang(){ var en=(typeof LANG!=="undefined"&&LANG==="en");
    var h=document.getElementById("vcH"); if(h)h.textContent=en?"Feedback":"고객의 소리";
    var b=document.getElementById("vcBtn"); if(b)b.textContent=en?"Send":"보내기";
    var t=document.getElementById("vcTxt"); if(t)t.placeholder=en?"Features you want, problems, or brokers you use":"바라는 기능, 불편한 점을 적어 주세요"; }
  lang(); var lb=document.getElementById("lng"); if(lb)lb.addEventListener("click",function(){setTimeout(lang,50);});
})();

<script>
// 고객의 소리 — 몇 자 썼는지 오른쪽 아래에 조그맣게 (사장님 2026-09-20)
// 🔴 한도는 입력칸의 maxlength 를 그대로 읽는다 — 앱마다 달라도 알아서 맞는다.
(function () {
  function vcCount() {
    var el = document.getElementById("vcTxt");
    if (!el) return;
    var max = +el.getAttribute("maxlength") || 200;
    var c = document.getElementById("vcCnt");
    if (!c) {
      c = document.createElement("div");
      c.id = "vcCnt";
      c.setAttribute("style", "text-align:right;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.2");
      el.insertAdjacentElement("afterend", c);
    }
    var n = (el.value || "").length;
    c.textContent = n + " / " + max;
    c.style.color = (n >= max) ? "#e8590c" : "var(--sub)";
  }
  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "vcTxt") vcCount();
  });
  setTimeout(vcCount, 1200);
})();

</script>
</body></html>
