<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>머니퍼즐 — 어린이용</title>
<style>
:root{--nm:#23324a;--sub:#6b7686;--line:#23324a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#fff7e6,#e9f6ff 60%,#fdeef6);color:var(--nm);
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;overflow-x:hidden;touch-action:manipulation}
.app{max-width:460px;margin:0 auto;min-height:100%;padding:16px 16px 96px;position:relative}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:-.5px}
.brand .p{width:24px;height:24px;border-radius:7px;
  background:linear-gradient(135deg,#FFD766,#F7A600);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.brand .kid{font-size:12px;background:#FFE08A;color:#8a5a00;font-weight:900;border-radius:999px;padding:2px 9px}
.screen{display:none;animation:pop .25s ease}
.screen.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.big{display:block;width:100%;border:3px solid var(--line);border-radius:18px;padding:14px;
  font-size:18px;font-weight:900;cursor:pointer;background:#fff;color:var(--nm);
  box-shadow:0 5px 0 rgba(35,50,74,.22);margin:10px 0}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(35,50,74,.22)}
.big.go{background:linear-gradient(135deg,#FFD766,#FFB020);color:#5a3b00}

/* 성향 게임 */
.q{font-size:24px;font-weight:900;text-align:center;margin:10px 0 4px}
.qsub{text-align:center;color:var(--sub);font-size:14px;margin-bottom:14px}
.choice{display:flex;align-items:center;gap:12px;width:100%;border:3px solid var(--line);
  border-radius:18px;padding:12px 14px;background:#fff;cursor:pointer;margin:9px 0;text-align:left;
  box-shadow:0 5px 0 rgba(35,50,74,.18)}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(35,50,74,.18)}
.choice .em{font-size:34px;flex:0 0 auto}
.choice .tx{font-size:16px;font-weight:800;line-height:1.3}
.choice .tx small{display:block;color:var(--sub);font-weight:700;font-size:12.5px;margin-top:2px}

/* 결과 */
.result{text-align:center;padding:20px 8px}
.result .face{font-size:88px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.result .rnm{font-size:26px;font-weight:900;margin:10px 0 2px}
.result .rds{color:var(--sub);font-size:15px;line-height:1.6;margin-bottom:6px}

/* 퍼즐 보드 */
.hd{font-size:17px;font-weight:900;margin:2px 0 2px}
.hdsub{color:var(--sub);font-size:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{position:relative;aspect-ratio:1/1;border-radius:16px;cursor:pointer;perspective:800px}
.cface{position:absolute;inset:0;border-radius:16px;border:3px solid var(--line);
  backface-visibility:hidden;transition:transform .45s cubic-bezier(.4,.1,.2,1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.cfront{color:#fff;box-shadow:inset 0 -7px 0 rgba(0,0,0,.16),inset 0 4px 0 rgba(255,255,255,.35)}
.cfront .qm{font-size:46px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.22)}
.cback{transform:rotateY(180deg);background:#fff}
.cback .em{font-size:40px;line-height:1}
.cback .nm{font-size:13px;font-weight:900;margin-top:3px;text-align:center}
.cback .hint{font-size:10.5px;color:var(--sub);text-align:center;line-height:1.2;padding:0 3px}
.cell.open .cfront{transform:rotateY(180deg)}
.cell.open .cback{transform:rotateY(360deg)}
.cell.inbag .cback{opacity:.4}
.cell.inbag::after{content:"🛒✓";position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:26px;z-index:3}

/* 장바구니 */
#bag{position:fixed;right:12px;bottom:80px;width:66px;height:66px;border-radius:50%;
  border:3px solid var(--line);background:#fff;display:none;align-items:center;justify-content:center;
  font-size:32px;z-index:40;box-shadow:0 5px 0 rgba(35,50,74,.22);transition:transform .12s}
#bag.hot{transform:scale(1.15);background:#FFF2CC}
#bag .cnt{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:999px;
  background:#e5484d;color:#fff;font-size:13px;font-weight:900;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;padding:0 5px}

/* 하단 바 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;gap:10px;
  max-width:460px;margin:0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(#ffffff00,#ffffffcc 30%,#fff)}
.bar button{flex:1;border:3px solid var(--line);border-radius:16px;padding:13px;font-size:16px;
  font-weight:900;cursor:pointer;box-shadow:0 4px 0 rgba(35,50,74,.22)}
.bar button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(35,50,74,.22)}
.plant{background:linear-gradient(135deg,#37D67A,#16a34a);color:#fff}
.plant:disabled{filter:grayscale(.7) opacity(.6)}
.reset{background:#fff;color:var(--nm)}

/* 정원 */
.mlbl{font-size:14px;font-weight:900;margin:4px 0 6px}
.mlbl span{font-weight:700;color:var(--sub);font-size:12px;margin-left:4px}
.modes{display:flex;gap:7px;margin:0 0 12px;flex-wrap:wrap}
.keep{display:block;width:100%;border:3px solid var(--line);border-radius:16px;padding:12px;
  font-size:16px;font-weight:900;cursor:pointer;margin:0 0 12px;
  background:linear-gradient(135deg,#37D67A,#16a34a);color:#fff;box-shadow:0 5px 0 rgba(35,50,74,.22)}
.keep:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(35,50,74,.22)}
.keep small{display:block;font-weight:700;font-size:11.5px;opacity:.92;margin-top:2px}
.modes button{border:3px solid var(--line);border-radius:13px;padding:8px 12px;font-size:14px;
  font-weight:900;background:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(35,50,74,.18)}
.modes button.on{background:#FFD766;color:#5a3b00}
.modes .real{background:#e9f6ff}
.modes .real.on{background:#3AA6F0;color:#fff}
.total{border:3px solid var(--line);border-radius:20px;background:#fff;padding:14px;text-align:center;
  box-shadow:0 6px 0 rgba(35,50,74,.18);margin-bottom:12px}
.total .big2{font-size:78px;line-height:1}
.bigplant{width:130px;height:130px;margin:0 auto}
.bigplant svg,.peplant svg{width:100%;height:100%;display:block}
.peplant{width:56px;height:56px;margin:0 auto}
.total .pct{font-size:40px;font-weight:900;-webkit-text-stroke:1.5px rgba(35,50,74,.2)}
.total .msg{color:var(--sub);font-size:13.5px;margin-top:4px;line-height:1.5}
.pots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
.pot{border:3px solid var(--line);border-radius:15px;background:#fff;padding:9px 5px;text-align:center;
  box-shadow:0 4px 0 rgba(35,50,74,.14)}
.pot .pe{font-size:38px;line-height:1}
.pot .pn{font-size:11.5px;font-weight:900;margin-top:2px}
.pot .pp{font-size:12px;font-weight:900}
.grow{animation:grow .6s ease}
@keyframes grow{0%{transform:scale(.4) translateY(10px);opacity:.2}100%{transform:none;opacity:1}}

/* 오버레이(꽃 선택·축하) */
.ov{position:fixed;inset:0;z-index:120;background:rgba(20,25,40,.55);display:none;
  align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.ov .box{background:#fff;border:4px solid var(--line);border-radius:24px;max-width:360px;width:100%;
  padding:22px 18px;text-align:center;box-shadow:0 14px 0 rgba(35,50,74,.25)}
.ov .ttl{font-size:20px;font-weight:900;margin-bottom:4px}
.ov .sub2{color:var(--sub);font-size:13.5px;margin-bottom:12px}
.flowers{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.flowers button{font-size:38px;border:3px solid var(--line);border-radius:16px;background:#fff;
  width:64px;height:64px;cursor:pointer;box-shadow:0 4px 0 rgba(35,50,74,.18)}
.flowers button:active{transform:translateY(3px)}
.bloom{font-size:96px;line-height:1;margin:6px 0}
.conf{position:fixed;top:-20px;z-index:115;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.note{color:var(--sub);font-size:11.5px;margin-top:14px;line-height:1.5;text-align:center}
</style></head><body>
<div class="app">
  <div class="brand"><span class="p"></span>머니퍼즐<span class="kid">어린이</span></div>

  <!-- ① 성향 게임 -->
  <section class="screen on" id="scQuiz">
    <div class="q">만 원이 생겼네! 💰</div>
    <div class="qsub">어떻게 할래? 하나만 골라 봐</div>
    <div id="choices"></div>
    <div class="note">※ 정답은 없어요. 네 마음에 드는 걸 고르면 성향이 정해져요.</div>
  </section>

  <!-- ② 결과 -->
  <section class="screen" id="scResult">
    <div class="result">
      <div class="face" id="rFace">🐢</div>
      <div class="rnm" id="rNm">안정 투자자</div>
      <div class="rds" id="rDs"></div>
      <button class="big go" onclick="startPlay()">퍼즐 시작! 🧩</button>
    </div>
  </section>

  <!-- ③ 퍼즐맵 -->
  <section class="screen" id="scPlay">
    <div class="hd" id="pHd">🧩 회사 퍼즐</div>
    <div class="hdsub">카드를 눌러 회사를 열어 봐 · 마음에 들면 🛒로 끌어다(또는 톡) 담아!</div>
    <div class="grid" id="grid"></div>
    <div class="note">담은 회사를 <b>씨앗으로 심어</b> 키울 거예요 🌱</div>
  </section>

  <!-- ④ 정원 -->
  <section class="screen" id="scGarden">
    <div class="hd">🪴 나의 정원</div>
    <div class="hdsub">회사가 잘되면 무럭무럭 자라 꽃이 피고, 못되면 시들어요.</div>
    <div class="mlbl">🔮 빨리 키워보기 <span>시간을 빨리 감아 봐요</span></div>
    <div class="modes" id="modes">
      <button data-m="3">3개월</button>
      <button data-m="6">6개월</button>
      <button data-m="12" class="on">1년</button>
    </div>
    <div class="total" id="total"></div>
    <div id="keepBox"></div>
    <div class="pots" id="pots"></div>
  </section>
</div>

<div id="bag" title="장바구니">🛒<span class="cnt" id="bagCnt" style="display:none">0</span></div>

<div class="bar" id="barPlay" style="display:none">
  <button class="reset" onclick="resetAll()">↺ 다시 처음부터</button>
  <button class="plant" id="plantBtn" onclick="goGarden()" disabled>🌱 심기</button>
</div>
<div class="bar" id="barGarden" style="display:none">
  <button class="reset" onclick="resetAll()">↺ 처음부터</button>
  <button class="reset" onclick="care()" id="careBtn">🌿 정원 돌보기</button>
  <button class="plant" id="bloomBtn" onclick="askFlower()" disabled>🌸 꽃 피우기</button>
</div>

<div id="ghost" style="position:fixed;z-index:100;width:74px;height:74px;border-radius:16px;border:3px solid var(--line);background:#fff;display:none;align-items:center;justify-content:center;font-size:40px;pointer-events:none;box-shadow:0 8px 16px rgba(0,0,0,.28);transform:translate(-50%,-50%)"></div>

<!-- 꽃 선택 -->
<div class="ov" id="ovFlower"><div class="box">
  <div class="ttl">활짝 필 준비 완료! 🎉</div>
  <div class="sub2">어떤 꽃으로 피울까?</div>
  <div class="flowers" id="flowers"></div>
</div></div>
<!-- 개화 축하 -->
<div class="ov" id="ovBloom"><div class="box">
  <div class="bloom" id="bloomEmoji">🌷</div>
  <div class="ttl" id="bloomTtl">우리 정원에 꽃이 활짝!</div>
  <div class="sub2" id="bloomMsg"></div>
  <button class="big go" onclick="hide('ovBloom')">계속 보기</button>
  <button class="big" onclick="resetAll()">↺ 처음부터</button>
</div></div>

<script>
const CHOICES=[
 {em:"🐷", g:1, tx:"저금통에 쏙 넣는다", sub:"집에 차곡차곡 모아요"},
 {em:"🍫", g:2, tx:"조금 사 먹고 나머지는 저축", sub:"지금도 즐기고 반은 모아요"},
 {em:"🤱", g:0, tx:"엄마에게 맡긴다", sub:"제일 안전하게 지켜요"},
 {em:"🏦", g:1, tx:"은행에 가서 예금한다", sub:"안전하게 두면 조금 불어나요"},
 {em:"🚀", g:3, tx:"친구들이 좋아하는 걸 사뒀다 나중에 더 비싸게 판다", sub:"조금 모험! 더 벌 수도 있어요"},
 {em:"🌱", g:4, tx:"만 원 전부로 씨앗을 사서 키워 장사한다", sub:"크게 모험! 대박날 수도, 잃을 수도"},
];
const GRADE=[
 {nm:"안정 투자자", face:"🐢", ds:"천천히·안전하게! 잃지 않는 걸 제일 좋아해요."},
 {nm:"안정추구 투자자", face:"🐥", ds:"안전이 먼저, 조금씩 불리는 것도 좋아요."},
 {nm:"균형 투자자", face:"🦊", ds:"즐길 땐 즐기고 지킬 땐 지키는 똑똑이!"},
 {nm:"적극 투자자", face:"🐯", ds:"모험을 즐겨요! 더 벌기 위해 조금 위험도 감수해요."},
 {nm:"공격 투자자", face:"🦁", ds:"용감한 도전자! 크게 벌려고 크게 걸어요(잃을 수도 있어요)."},
];
// 회사 — 그림 + 1년 성적(r). 3·6개월은 r에서 만든다.
const SAFE=[
 {nm:"코카콜라",em:"🥤",hint:"음료를 만들어요",r:7},{nm:"맥도날드",em:"🍔",hint:"햄버거 가게",r:12},
 {nm:"삼성전자",em:"💾",hint:"반도체를 만들어요",r:-6},{nm:"현대차",em:"🚗",hint:"자동차를 만들어요",r:9},
 {nm:"KODEX200",em:"🧺",hint:"여러 회사를 한 바구니에",r:5},{nm:"네이버",em:"🔎",hint:"검색·인터넷",r:-3},
 {nm:"나이키",em:"👟",hint:"운동화를 만들어요",r:-14},{nm:"카카오",em:"💬",hint:"메신저를 만들어요",r:-11},
 {nm:"신한은행",em:"🏦",hint:"은행이에요",r:6},
];
const GROWTH=[
 {nm:"엔비디아",em:"🎮",hint:"게임·AI 칩",r:85},{nm:"테슬라",em:"⚡",hint:"전기차를 만들어요",r:40},
 {nm:"애플",em:"📱",hint:"휴대폰을 만들어요",r:22},{nm:"쿠팡",em:"📦",hint:"온라인 쇼핑·배송",r:30},
 {nm:"넷플릭스",em:"🎬",hint:"영화·드라마",r:25},{nm:"삼성전자",em:"💾",hint:"반도체를 만들어요",r:-6},
 {nm:"카카오",em:"💬",hint:"메신저를 만들어요",r:-11},{nm:"팔란티어",em:"🛰️",hint:"데이터 분석",r:120},
 {nm:"레모네이드",em:"🍋",hint:"보험을 파는 새 회사",r:-22},
];
const PAL=["#FF8A5B","#3AA6F0","#37D67A","#FFC93C","#FF6BB3","#9B7BFF","#20C4B8","#F7A600","#5B8DEF"];
const FLOWERS=[["🌹","장미"],["🌻","해바라기"],["🌷","튤립"],["🌸","벚꽃"],["🏵️","금잔화"]];

let grade=0, pool=[], bag=[], planted=[], period="12";
const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");};
const hide=id=>$(id).classList.remove("on");
function mix(hex,f){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255,
  m=v=>Math.max(0,Math.min(255,Math.round(f<1?v*f:v+(255-v)*(f-1))));
  return "#"+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1);}
// 기간별 성적 — 3·6개월은 1년 성적을 줄여서(짧을수록 폭이 작다)
function ret(comp){return period==="3"?comp.r*0.35:period==="6"?comp.r*0.6:comp.r;}
// 식물 모습 (성적 = 건강)
function plant(v){
  if(v>=40) return {em:"🌸",lb:"활짝!"};
  if(v>=15) return {em:"🌳",lb:"무성해요"};
  if(v>=3)  return {em:"🌿",lb:"잘 자라요"};
  if(v>-3)  return {em:"🌱",lb:"새싹"};
  if(v>-15) return {em:"🥀",lb:"살짝 시듦"};
  if(v>-30) return {em:"🍂",lb:"잎이 져요"};
  return {em:"🪵",lb:"말라가요"};
}
// 직접 그린 식물 그림(SVG) — 성적(v)에 따라 씨앗~꽃, 시듦~마름
function leaf(x,y,s,col){return '<path d="M'+x+' '+y+' C'+(x+s*3)+' '+(y-9)+' '+(x+s*13)+' '+(y-11)+' '+(x+s*17)+' '+(y-16)
  +' C'+(x+s*10)+' '+(y-8)+' '+(x+s*6)+' '+(y-4)+' '+x+' '+y+' Z" fill="'+col+'" stroke="#23324a" stroke-width="2.4" stroke-linejoin="round"/>';}
function plantSVG(v){
  var soil='<ellipse cx="50" cy="70" rx="16" ry="4" fill="#7a5230"/>';
  var pot='<path d="M34 72 L66 72 L62 95 Q50 99 38 95 Z" fill="#E8894B" stroke="#23324a" stroke-width="3" stroke-linejoin="round"/>'
    +'<rect x="30" y="65" width="40" height="11" rx="3" fill="#F2A366" stroke="#23324a" stroke-width="3"/>';
  var g;
  if(v>=40){
    g='<path d="M50 71 V34" stroke="#2f9e44" stroke-width="5" stroke-linecap="round"/>'
     +leaf(50,54,-1,"#37D67A")+leaf(50,50,1,"#4fe08c")
     +'<circle cx="50" cy="22" r="8" fill="#FF6BB3" stroke="#23324a" stroke-width="2.4"/>'
     +'<circle cx="61" cy="30" r="8" fill="#FF6BB3" stroke="#23324a" stroke-width="2.4"/>'
     +'<circle cx="57" cy="42" r="8" fill="#FF8FC4" stroke="#23324a" stroke-width="2.4"/>'
     +'<circle cx="43" cy="42" r="8" fill="#FF8FC4" stroke="#23324a" stroke-width="2.4"/>'
     +'<circle cx="39" cy="30" r="8" fill="#FF6BB3" stroke="#23324a" stroke-width="2.4"/>'
     +'<circle cx="50" cy="32" r="7" fill="#FFC93C" stroke="#23324a" stroke-width="2.4"/>';
  } else if(v>=15){
    g='<path d="M50 72 V52" stroke="#6b4a2b" stroke-width="6" stroke-linecap="round"/>'
     +'<circle cx="50" cy="40" r="17" fill="#37D67A" stroke="#23324a" stroke-width="3"/>'
     +'<circle cx="37" cy="46" r="12" fill="#4fe08c" stroke="#23324a" stroke-width="3"/>'
     +'<circle cx="63" cy="46" r="12" fill="#2fb46a" stroke="#23324a" stroke-width="3"/>';
  } else if(v>=3){
    g='<path d="M50 71 V44" stroke="#2f9e44" stroke-width="5" stroke-linecap="round"/>'
     +leaf(50,58,-1,"#37D67A")+leaf(50,54,1,"#37D67A")+leaf(50,46,-1,"#4fe08c");
  } else if(v>-3){
    g='<path d="M50 71 V60" stroke="#2f9e44" stroke-width="4.5" stroke-linecap="round"/>'
     +leaf(50,62,-1,"#37D67A")+leaf(50,62,1,"#4fe08c");
  } else if(v>-15){
    g='<path d="M50 71 Q56 58 49 50" stroke="#8a9a3a" stroke-width="4.5" fill="none" stroke-linecap="round"/>'
     +leaf(52,58,1,"#CDBE4C")+leaf(50,52,-1,"#BBAA3E");
  } else if(v>-30){
    g='<path d="M50 71 Q52 62 49 56" stroke="#8a7a4a" stroke-width="4" fill="none" stroke-linecap="round"/>'
     +leaf(49,58,-1,"#A9853A")
     +'<path d="M63 66 q7 2 5 9 q-7 0 -5 -9 z" fill="#B0894A" stroke="#23324a" stroke-width="2"/>';
  } else {
    g='<path d="M50 71 V56 M50 62 L43 54 M50 60 L58 53" stroke="#8a6a4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
     +'<ellipse cx="40" cy="68" rx="5" ry="2.4" fill="#9a7a4a"/><ellipse cx="60" cy="68" rx="5" ry="2.4" fill="#9a7a4a"/>';
  }
  return '<svg viewBox="0 0 100 100">'+soil+g+pot+'</svg>';
}

// ── 성향 게임 ──
function drawQuiz(){$("choices").innerHTML=CHOICES.map(c=>
  '<button class="choice" onclick="pick('+c.g+')"><span class="em">'+c.em+'</span>'
  +'<span class="tx">'+c.tx+'<small>'+c.sub+'</small></span></button>').join("");}
function pick(g){grade=g;const G=GRADE[g];
  $("rFace").textContent=G.face;$("rNm").textContent="너는 "+G.nm+"!";$("rDs").textContent=G.ds;show("scResult");}

// ── 퍼즐맵 ──
function startPlay(){
  bag=[]; pool=(grade<=2?SAFE:GROWTH).slice(0,9);
  $("pHd").textContent=(grade<=2?"🧺 안전한 회사 퍼즐":"🚀 성장 회사 퍼즐");
  $("grid").innerHTML=pool.map((c,i)=>{const col=PAL[i%PAL.length];
    return '<div class="cell" data-i="'+i+'">'
      +'<div class="cface cfront" style="background:linear-gradient(150deg,'+mix(col,1.16)+','+mix(col,.9)+')"><span class="qm">?</span></div>'
      +'<div class="cface cback"><span class="em">'+c.em+'</span><span class="nm">'+c.nm+'</span><span class="hint">'+c.hint+'</span></div>'
      +'</div>';}).join("");
  bindCells(); $("barPlay").style.display="flex"; $("barGarden").style.display="none";
  $("bag").style.display="flex"; updateBag(); show("scPlay");
}
let drag=null;
function bindCells(){document.querySelectorAll("#grid .cell").forEach(cell=>{
  cell.addEventListener("pointerdown",e=>{const i=+cell.dataset.i;
    if(!cell.classList.contains("open")){cell.classList.add("open");return;}
    if(cell.classList.contains("inbag"))return;
    drag={i:i,x:e.clientX,y:e.clientY,moved:false};
    const g=$("ghost");g.textContent=pool[i].em;g.style.left=e.clientX+"px";g.style.top=e.clientY+"px";g.style.display="flex";
    try{cell.setPointerCapture(e.pointerId);}catch(_){}});
  cell.addEventListener("pointermove",e=>{if(!drag)return;
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8)drag.moved=true;
    const g=$("ghost");g.style.left=e.clientX+"px";g.style.top=e.clientY+"px";
    $("bag").classList.toggle("hot",overBag(e.clientX,e.clientY));});
  cell.addEventListener("pointerup",e=>{if(!drag)return;
    $("ghost").style.display="none";$("bag").classList.remove("hot");
    if(!drag.moved||overBag(e.clientX,e.clientY))addToBag(drag.i);drag=null;});
});}
function overBag(x,y){const r=$("bag").getBoundingClientRect();return x>r.left-14&&x<r.right+14&&y>r.top-14&&y<r.bottom+14;}
function addToBag(i){if(bag.indexOf(i)>=0)return;bag.push(i);
  document.querySelector('#grid .cell[data-i="'+i+'"]').classList.add("inbag");
  $("bag").animate([{transform:"scale(1)"},{transform:"scale(1.25)"},{transform:"scale(1)"}],{duration:260});updateBag();}
function updateBag(){const c=$("bagCnt");c.textContent=bag.length;c.style.display=bag.length?"flex":"none";
  $("plantBtn").disabled=bag.length===0;}

// ── 정원 ──
function goGarden(){
  planted=bag.slice(); period="12";
  $("bag").style.display="none"; $("barPlay").style.display="none"; $("barGarden").style.display="flex";
  document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.m==="12"));
  renderGarden(); show("scGarden");
}
$("modes").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  period=b.dataset.m; document.querySelectorAll("#modes button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  if(period==="real"){realGrow();return;} renderGarden(); fan();});
function renderGarden(){
  const comps=planted.map(i=>pool[i]);
  const rs=comps.map(ret), avg=rs.reduce((a,b)=>a+b,0)/(rs.length||1);
  const P=plant(avg);
  $("total").innerHTML='<div class="bigplant grow">'+plantSVG(avg)+'</div>'
    +'<div class="pct" style="color:'+(avg>=0?"#16a34a":"#e5484d")+'">'+(avg>=0?"+":"")+avg.toFixed(1)+'%</div>'
    +'<div class="msg">'+gardenMsg(avg)+'</div>';
  $("pots").innerHTML=comps.map((c,k)=>{const v=rs[k];
    return '<div class="pot"><div class="peplant grow" style="animation-delay:'+(k*0.06)+'s">'+plantSVG(v)+'</div>'
      +'<div class="pn">'+c.em+' '+c.nm+'</div>'
      +'<div class="pp" style="color:'+(v>=0?"#16a34a":"#e5484d")+'">'+(v>=0?"+":"")+v.toFixed(0)+'%</div></div>';}).join("");
  $("bloomBtn").disabled = avg<20;                    // 잘 자라야 꽃을 피운다
  $("careBtn").style.display = (avg<3 && planted.length>1)?"block":"none";  // 시들면 돌보기
  // 빨리 키워본 뒤 → "이대로 계속 키울래?"(진짜로 키우기 B)
  $("keepBox").innerHTML='<button class="keep" onclick="realGrow()">🌱 이대로 계속 키울래?'
    +'<small>진짜로 심어 두고 날마다 키워요</small></button>';
}
function gardenMsg(avg){
  if(avg>=40)return "우와! 정원이 활짝 폈어요. 꽃을 피워 볼까요? 🌸";
  if(avg>=20)return "무럭무럭! 이제 꽃을 피울 수 있어요 🌳";
  if(avg>=3) return "잘 자라고 있어요 🌿";
  if(avg>-3) return "이제 막 새싹이에요 🌱 기다려 볼까요?";
  if(avg>-15)return "조금 시들었어요. 정원을 돌봐 줄까요? 🥀";
  return "많이 시들었어요 😢 돌보거나, 다시 심어도 돼요.";
}
// 돌보기 = 리밸런싱: 제일 시든 화분 뽑고 잘 자라는 데 물 주기
function care(){
  if(planted.length<=1)return;
  let worst=0; planted.forEach((idx,k)=>{if(ret(pool[idx])<ret(pool[planted[worst]]))worst=k;});
  const gone=pool[planted[worst]];
  planted.splice(worst,1);
  renderGarden();
  $("total").querySelector(".msg").textContent="🪓 제일 시든 "+gone.nm+"를 뽑고 ☀️💧 잘 자라는 데 물을 줬어요! (리밸런싱)";
  fan();
}
// 꽃 고르기 → 개화
function askFlower(){
  $("flowers").innerHTML=FLOWERS.map((f,i)=>'<button onclick="bloom('+i+')" title="'+f[1]+'">'+f[0]+'</button>').join("");
  $("ovFlower").classList.add("on");
}
function bloom(i){
  hide("ovFlower");
  const f=FLOWERS[i];
  const comps=planted.map(k=>pool[k]), avg=comps.map(ret).reduce((a,b)=>a+b,0)/(comps.length||1);
  $("bloomEmoji").textContent=f[0];
  $("bloomTtl").textContent="우리 정원에 "+f[1]+"이 활짝! 🎉";
  $("bloomMsg").textContent="만 원이 "+Math.round(10000*(1+avg/100)).toLocaleString()+"원이 됐어요. 오래 잘 키운 덕분이에요!";
  $("ovBloom").classList.add("on"); fanfare(); confetti(f[0]);
}
// 실전 키우기 — 진짜로 심어 두고 날마다 자란다(프로토타입: 저장 + 안내)
function realGrow(){
  try{localStorage.setItem("kids_garden",JSON.stringify({names:planted.map(i=>pool[i].nm),at:new Date().toISOString().slice(0,10)}));}catch(_){}
  const comps=planted.map(i=>pool[i]);
  $("total").innerHTML='<div class="bigplant grow">'+plantSVG(0)+'</div><div class="pct" style="color:#3AA6F0">키우는 중…</div>'
    +'<div class="msg">진짜로 심었어요! <b>날마다 앱을 열면</b> 그날 회사 성적으로 정원이 자라거나 시들어요 🌤️<br>물도 주고 햇빛도 쬐어 주며 오래오래 키워 보세요.</div>';
  $("pots").innerHTML=comps.map((c,k)=>'<div class="pot"><div class="peplant grow" style="animation-delay:'+(k*0.06)+'s">'+plantSVG(0)+'</div>'
    +'<div class="pn">'+c.em+' '+c.nm+'</div><div class="pp" style="color:#3AA6F0">심음</div></div>').join("");
  $("keepBox").innerHTML=""; document.querySelectorAll("#modes button").forEach(b=>b.classList.remove("on"));
  $("bloomBtn").disabled=true; $("careBtn").style.display="none"; fan();
}

function resetAll(){
  hide("ovFlower");hide("ovBloom");
  bag=[];planted=[]; $("bag").style.display="none";
  $("barPlay").style.display="none";$("barGarden").style.display="none";updateBag();
  document.querySelectorAll("#grid .cell").forEach(c=>c.classList.remove("open","inbag"));
  show("scQuiz");
}

// 소리·효과
function fan(){try{const A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();
  o.type="triangle";o.frequency.value=660;g.gain.setValueAtTime(0.0001,A.currentTime);
  g.gain.exponentialRampToValueAtTime(0.2,A.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+0.18);
  o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+0.2);}catch(e){}}
function fanfare(){try{const A=new(window.AudioContext||window.webkitAudioContext)(),ns=[523,659,784,1047],t0=A.currentTime;
  ns.forEach((f,i)=>{const o=A.createOscillator(),g=A.createGain();o.type="triangle";o.frequency.value=f;
    const t=t0+i*0.12;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+0.3);});}catch(e){}}
function confetti(flower){const em=[flower,"🎉","🎊","⭐","✨","🌸","💐"];
  for(let i=0;i<44;i++){const d=document.createElement("div");d.className="conf";d.textContent=em[i%em.length];
    d.style.left=Math.random()*100+"vw";d.style.animationDuration=(1.6+Math.random()*1.6)+"s";
    d.style.animationDelay=(Math.random()*0.5)+"s";d.style.fontSize=(16+Math.random()*20)+"px";
    document.body.appendChild(d);setTimeout(()=>d.remove(),3600);}}

drawQuiz();
// 데모 미리보기 — ?demo=garden|bloom
(function(){const q=new URLSearchParams(location.search).get("demo");
  if(q==="garden"||q==="bloom"){grade=3;startPlay();[0,1,2,3].forEach(addToBag);goGarden();
    if(q==="bloom"){askFlower();bloom(2);}}
})();
</script></body></html>
