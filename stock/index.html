 transform:translate(-50%,-50%);animation:blink 1.6s infinite}

.svcard .svq{font-size:13px;color:var(--nm);margin:6px 0 8px;font-weight:700}

  border-radius:10px;background:var(--card);color:var(--nm);font-size:13px;cursor:pointer}

.injh .srow{padding:6px 2px;color:var(--nm);font-size:14px}
.injh h3{color:var(--sub);font-size:13px;margin-bottom:4px}.injh .chdr{color:var(--soon);font-size:11px;font-weight:400}
@media(max-width:520px){
 body{padding:10px 12px 40px}
 h1{font-size:14px}h1 .lv{font-size:9px;margin-left:2px}

}

<script>
// ---- 스파크라인 ----
function spark(a){
  if(!a||a.length<2)return"";
  const w=(window.innerWidth<520?38:54),h=18,lo=Math.min(...a),hi=Math.max(...a),rg=(hi-lo)||1,n=a.length;
  const up=a[a.length-1]>=a[0],c=up?"#00a868":"#ff433d";
  let p="";for(let i=0;i<n;i++){p+=(i?" ":"")+(2+(w-4)*i/(n-1)).toFixed(1)+","+(h-2-(h-4)*(a[i]-lo)/rg).toFixed(1);}
  return'<svg width="'+w+'" height="'+h+'" style="vertical-align:middle"><polyline points="'+p+'" fill="none" stroke="'+c+'" stroke-width="1.4"/></svg>';
}
function pcrow(it){
  const p=it.pct,cls=p>0?"up":(p<0?"dn":"fl"),arw=p>0?"▲":(p<0?"▼":"");
  return'<div class="row"><span class="nm">'+tr(it.nm)+(it.d?' <span style="font-size:9px;color:#e0a020;font-weight:700;vertical-align:middle">D</span>':'')+'</span><span class="rt">'
    +spark(it.spark)+'<span class="val">'+it.val+'</span>'
    +'<span class="pc '+cls+'">'+arw+Math.abs(p).toFixed(2)+'%</span></span></div>';
}
const TAG={"국내":'<span class="tag soon">실시간 예정</span>'};
function grpTag(t){return TAG[t]||'<span class="tag delay">D 지연</span>';}

// 배포 허브(Cloudflare WebSocket). 비우면 data.json 폴링(로컬/깃허브).
const HUB="https://brief-live-hub.emhwang3.workers.dev";  // Cloudflare WebSocket 허브
try{var _vid=localStorage.getItem("brief_vid");if(!_vid){_vid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem("brief_vid",_vid);}
  var _src="";try{_src=(new URLSearchParams(location.search)).get("src")||"";}catch(e){}
  if(!_src){var _r=document.referrer||"";
    if(/youtu/i.test(_r))_src="yt";else if(/x\.com|twitter|t\.co/i.test(_r))_src="x";
    else if(/naver|blog/i.test(_r))_src="blog";else if(/kakao|kko|daum/i.test(_r))_src="kt";
    else if(/telegram|t\.me/i.test(_r))_src="tg";else _src=_r?"ref":"direct";}
  if(HUB)fetch(HUB.replace(/\/$/,"")+"/hit?vid="+_vid+"&src="+encodeURIComponent(_src),{mode:"no-cors"}).catch(function(){});}catch(e){}  // 방문 카운트+경로
// ---- PWA(홈 화면 앱) ----
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
// 설치바는 앱으로 실행 중이 아니면 무조건 뜬다. 설치 신호(beforeinstallprompt)가 없는 곳(인앱브라우저·이미 설치·삼성 등)은 버튼이 안내/바깥 브라우저로 넘김
var _deferPrompt=null,_iosHint=false;
var _ua=navigator.userAgent||"";
var _iOS=/iPad|iPhone|iPod/.test(_ua)||(/Macintosh/.test(_ua)&&navigator.maxTouchPoints>1);
var _android=/Android/i.test(_ua);
var _kakao=/KAKAOTALK/i.test(_ua);
var _inapp=_kakao||/NAVER\(|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|Telegram|; wv\)/i.test(_ua)||(_iOS&&!/Safari/.test(_ua));
var _samsung=/SamsungBrowser/i.test(_ua);
function _standalone(){try{return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}catch(e){return false;}}
function dismissInstall(){var b=document.getElementById("installBar");if(b)b.hidden=true;}  // 이번 화면에서만 닫힘
function _openExternal(){var u=location.href;
  if(_kakao){location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(u);return true;}
  if(_android){location.href="intent://"+location.host+location.pathname+location.search+"#Intent;scheme=https;package=com.android.chrome;end";return true;}
  return false;}
function doInstall(){
  if(_deferPrompt){_deferPrompt.prompt();_deferPrompt.userChoice.then(function(){_deferPrompt=null;});return;}
  if(_inapp&&_openExternal())return;
  _iosHint=true;_il();}
function _il(){var en=false;try{en=(LANG==="en");}catch(e){}
  var t=document.getElementById("installTxt"),b=document.getElementById("installBtn");if(!t)return;
  if(b)b.hidden=false;
  if(_deferPrompt){t.textContent=en?"📲 Add to your home screen and open instantly":"📲 홈 화면에 앱으로 추가하고 바로 여세요";if(b)b.textContent=en?"Install app":"앱설치";return;}
  if(_inapp&&(_kakao||_android)){t.textContent=en?"📲 Install works in "+(_iOS?"Safari":"Chrome"):"📲 앱 설치는 "+(_iOS?"사파리":"크롬")+"에서 됩니다";if(b)b.textContent=en?"Open in "+(_iOS?"Safari":"Chrome"):(_iOS?"사파리로 열기":"크롬으로 열기");return;}
  if(b)b.textContent=en?"Install app":"앱설치";
  if(!_iosHint){t.textContent=en?"📲 Add to your home screen and open instantly":"📲 홈 화면에 앱으로 추가하고 바로 여세요";return;}
  if(_inapp)t.textContent=en?"📲 Menu (⋯) → “Open in "+(_iOS?"Safari":"browser")+"”, then add to home screen":"📲 메뉴(⋯) → ‘"+(_iOS?"Safari":"다른 브라우저")+"로 열기’ 후 홈 화면에 추가";
  else if(_iOS)t.textContent=en?"📲 Tap Share → “Add to Home Screen”":"📲 공유 버튼 → ‘홈 화면에 추가’";
  else if(_samsung)t.textContent=en?"📲 Menu (≡) → “Add page to” → “Home screen”":"📲 메뉴(≡) → ‘현재 페이지 추가’ → ‘홈 화면’";
  else if(_android)t.textContent=en?"📲 Menu (⋮) → “Add to Home screen” or “Install app”":"📲 메뉴(⋮) → ‘홈 화면에 추가’ 또는 ‘앱 설치’";
  else t.textContent=en?"📲 Click the install icon at the right of the address bar":"📲 주소창 오른쪽 설치 아이콘을 누르세요";}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();_deferPrompt=e;_iosHint=false;_il();});
window.addEventListener("appinstalled",function(){dismissInstall();});
// 🔴 카톡 안에서 열렸으면 바깥 브라우저로 자동으로 넘긴다 — 설치가 거기서만 된다(2026-09-16)
try{
  if(_kakao&&!_standalone()){
    var _j=false; try{_j=sessionStorage.getItem("brief_jump")==="1";}catch(e){}
    if(!_j){
      try{sessionStorage.setItem("brief_jump","1");}catch(e){}
      setTimeout(function(){ try{_openExternal();}catch(e){} },400);
    }
  }
}catch(e){}
function _showInstall(){if(_standalone())return;_il();var b=document.getElementById("installBar");if(b)b.hidden=false;}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",_showInstall);else _showInstall();
// ---- 언어(한/영) ----
let LANG="ko"; try{var _lp=(new URLSearchParams(location.search)).get("lang");
  LANG=(_lp==="en"||_lp==="ko")?_lp:(localStorage.getItem("brief_lang")||"ko");
  localStorage.setItem("brief_lang",LANG);}catch(e){}
const NM={"국내":"KR Indices","미국 지수":"US Indices","미국 야간선물":"US Futures (Night)","아시아":"Asia",
 "금리·채권":"Rates / Bonds","환율·달러":"FX / Dollar","원자재":"Commodities",
 "코스피":"KOSPI","코스닥":"KOSDAQ","코스피200":"KOSPI200","코스피200 야간선물":"KOSPI200 Night Fut.",
 "S&P500":"S&P500","나스닥100":"NASDAQ100","다우":"Dow","러셀2000":"Russell2000","반도체(SOX)":"SOX",
 "S&P 선물":"S&P Futures","나스닥 선물":"NASDAQ Futures","니케이225":"Nikkei225","상하이":"Shanghai","항셍":"Hang Seng",
 "미 10년물":"US 10Y","미 13주":"US 13W","미 30년물":"US 30Y",
 "원/달러":"USD/KRW","달러지수":"Dollar Index","엔/달러":"USD/JPY","위안/달러":"USD/CNY",
 "WTI 원유":"WTI Crude","브렌트":"Brent","금":"Gold","구리":"Copper","천연가스":"Nat Gas",
 "한국 기준금리":"BOK Base Rate","CD 91일":"CD 91D","국고채 3년":"KTB 3Y","국고채 10년":"KTB 10Y",
 "미국 10Y−13주":"US 10Y−13W","한국 10Y−3Y":"KR 10Y−3Y",
 "한국":"Korea","미국":"US","중국":"China","일본":"Japan","유로존":"Eurozone","독일":"Germany","영국":"UK","유럽":"Europe"};
function tr(k){return LANG==="en"?(NM[k]||k):k;}
const T={title:{ko:"일일브리핑",en:"Daily Brief"},stockH:{ko:"종목 조회",en:"Stock Search"},coinH:{ko:"코인 조회",en:"Coin Search"},
 krateH:{ko:"한국 금리",en:"Korea Rates"},spreadH:{ko:"장단기 금리차이",en:"Yield Spread"},spreadN:{ko:"음수=역전",en:"neg=inverted"},
 changesH:{ko:"주요 자산 전일대비",en:"Key Assets"},calH:{ko:"경제지표 일정 (오늘)",en:"Economic Calendar (Today)"},newsH:{ko:"헤드라인 뉴스",en:"Headlines (KR)"},coinCardH:{ko:"암호화폐",en:"Crypto"},
 live:{ko:"● 실시간",en:"● LIVE"},delay:{ko:"D 지연",en:"D delayed"},closed:{ko:"장마감",en:"Closed"},delayed2:{ko:"지연(장마감)",en:"Delayed (Closed)"},
 mtemp:{ko:"시장온도",en:"Mkt Temp"},vixL:{ko:"VIX · 공포",en:"VIX · Fear"},fgL:{ko:"공포·탐욕",en:"Fear & Greed"},
 gnote:{ko:"시장온도 · VIX · 공포·탐욕 — 주식시장 기준",en:"Market Temp · VIX · Fear&Greed — stock market basis"},
 price:{ko:"현재가",en:"Price"},vsOpen:{ko:"시초가 대비",en:"vs Open"},vsPrev:{ko:"전일종가 대비",en:"vs Prev Close"},
 vol:{ko:"거래량",en:"Volume"},turnover:{ko:"거래대금",en:"Turnover"},strength:{ko:"체결강도",en:"Trade Strength"},
 chg24:{ko:"24시간 변동율",en:"24h Change"},vol24:{ko:"거래량(24h)",en:"Volume (24h)"},tv24:{ko:"거래대금(24h)",en:"Turnover (24h)"},
 inverted:{ko:"역전⚠",en:"inverted⚠"},normal:{ko:"정상",en:"normal"},loading:{ko:"불러오는 중…",en:"Loading…"},
 chartLoading:{ko:"차트 불러오는 중…",en:"Loading chart…"},chartNone:{ko:"차트 없음",en:"No chart"},
 stkPH:{ko:"국내·미국 (예: 005930, 삼성, AAPL, Tesla)",en:"KR·US (e.g. 005930, AAPL, Tesla)"},
 coinPH:{ko:"코인 심볼 (예: BTC, ETH, SOL)",en:"Coin symbol (e.g. BTC, ETH, SOL)"},
 ophrs:{ko:"실시간 운영 05:00 ~ 익일 02:00 (KST) · 그 밖의 시간은 마지막 값",
  en:"Live 05:00–02:00 KST · outside these hours, last values shown"},
 asof:{ko:" 기준",en:""},binance:{ko:"● 바이낸스",en:"● Binance"},snap:{ko:" · 스냅샷",en:" · snapshot"}};
function L(k){const t=T[k];return t?(t[LANG]||t.ko):k;}
const TEMPW={ko:["차가움","서늘","미지근","따뜻","뜨거움"],en:["Cold","Cool","Neutral","Warm","Hot"]};
const TFW={"3":{ko:"3분",en:"3m"},"5":{ko:"5분",en:"5m"},"15":{ko:"15분",en:"15m"},"30":{ko:"30분",en:"30m"},"60":{ko:"60분",en:"60m"},"D":{ko:"일",en:"1D"}};
function toggleLang(){LANG=LANG==="en"?"ko":"en";try{localStorage.setItem("brief_lang",LANG);}catch(e){}applyLang();}
// 묶음이 지금 실시간인가 — 카드 머리와 주요자산 막대가 **같은 자를 쓴다**
function grpLive(gr){
  if(!gr)return false;
  const t=gr.title;
  if(t==="국내")return krLiveNow();                       // 국내: 평일 08~20시
  if(t==="미국 지수")return !!gr.rt&&usIndexLive();        // 미국주식: 정규장 09:30~16:00 ET
  if(t==="원자재"||t==="금리·채권")return !!gr.rt&&usFutLive();   // CME 선물: ~24h
  if(t==="환율·달러")return !!gr.rt&&usFxLive();           // FX: 24h
  // 🔴 아시아는 Infoway 실시간이 된 뒤(09-18)로 장 시간 검사 없이 늘 '실시간'이었다 — 닫혔으면 장마감
  if(t==="아시아")return !!gr.rt&&asiaLiveNow();
  return !!gr.rt;
}
// 지연 자료인가 — 아시아는 늘 지연이라 장중이면 '지연', 닫혔으면 '장마감'
function grpDelay(gr){
  if(!gr)return false;
  if(gr.title==="아시아")return asiaLiveNow();
  return false;
}
function render(d){
  window._lastD=d;
  {
    document.getElementById("asof").textContent=d.asof+L("asof")+(d.__snap?L("snap"):"");
    // 게이지 (+ 시장온도)
    let g="";
    if(d.temp!=null){const t=d.temp,li=t<=25?0:t<=45?1:t<=60?2:t<=75?3:4,lab=TEMPW[LANG][li],
      col=t>=70?"#ff433d":(t<=30?"#3b82f6":"#e0a020");
      g+='<div class="stat"><div class="n" style="color:'+col+'">'+t+'°</div><div class="l">'+L("mtemp")+' · '+lab+'</div></div>';}
    if(d.gauges){
      if(d.gauges.vix!=null)g+='<div class="stat"><div class="n" style="color:'+(d.gauges.vix<20?"#00a868":(d.gauges.vix>30?"#ff433d":"#e0a020"))+'">'+d.gauges.vix+'</div><div class="l">'+L("vixL")+'</div></div>';
      if(d.gauges.fg!=null)g+='<div class="stat"><div class="n" style="color:'+(d.gauges.fg>=75?"#ff433d":(d.gauges.fg<=25?"#00a868":"#e0a020"))+'">'+d.gauges.fg+'</div><div class="l">'+L("fgL")+'</div></div>';
    }
    document.getElementById("gauges").innerHTML=g;
    // 카드 조각들(순서: 특이일 → 캘린더 → 주요자산막대 → 지수그룹 → 한국금리 → 장단기 → [코인] → 뉴스)
    let sGroups="";
    // 선그래프가 무엇인지 지표 시작점에 한 줄 (사장님 2026-09-18) — 서버가 일봉 30개(closes[-30:])를 보낸다
    if(d.groups.some(g=>g.items&&g.items.length))
      sGroups+='<div class="gnote">'+(LANG==="en"?"Line charts — last 30 trading days (daily)"
        :"선그래프 — 최근 30거래일(일봉) 기준")+'</div>';
    for(const gr of d.groups){
      if(!gr.items.length)continue;
      let live=grpLive(gr);
      let tagTxt=live?L("live"):L("closed");
      // 아시아는 지연 자료다 — 장중이면 '지연(장중)', 닫혔을 때만 '장마감'
      if(gr.title==="아시아"&&!live&&asiaLiveNow())tagTxt=L("delay");   // D 지연 으로 통일
      const tag=live?'<span class="tag live">'+tagTxt+'</span>':'<span class="tag delay">'+tagTxt+'</span>';
      sGroups+='<div class="card"><h3>'+tr(gr.title)+' '+tag+'</h3>'+gr.items.map(pcrow).join("")+'</div>';
    }
    let sKrates="";
    if(d.krates&&d.krates.length){
      sKrates='<div class="card"><h3>'+L("krateH")+' <span class="tag delay">'+(krLiveNow()?L("delay"):L("closed"))+'</span></h3>'
        +d.krates.map(k=>{const c=k.chg>0?"up":(k.chg<0?"dn":"fl"),a=k.chg>0?"▲":(k.chg<0?"▼":"");
          return'<div class="row"><span class="nm">'+tr(k.nm)+'</span><span class="rt">'+spark(k.spark)+'<span class="val">'+k.val+'</span>'
          +'<span class="pc '+c+'">'+a+Math.abs(k.chg).toFixed(2)+'%p</span></span></div>';}).join("")+'</div>';
    }
    let sSpreads="";
    if(d.spreads&&d.spreads.length){
      sSpreads='<div class="card"><h3>'+L("spreadH")+' <span style="color:var(--soon);font-weight:400;font-size:11px">'+L("spreadN")+'</span></h3>'
        +d.spreads.map(s=>'<div class="row"><span class="nm">'+tr(s.nm)+'</span><span class="rt"><span class="val">'+s.val+'</span>'
          +'<span class="pc '+(s.inv?"dn":"up")+'">'+(s.inv?L("inverted"):L("normal"))+'</span></span></div>').join("")+'</div>';
    }
    let sChanges="";
    if(d.changes&&d.changes.length){
      const mx=Math.max.apply(null,d.changes.map(c=>Math.abs(c.pct)).concat([1]));
      // 🔴 이 카드는 여러 시장을 한데 모은 것이라 열린 것과 닫힌 것이 섞인다.
      //    어느 묶음에서 온 줄인지 찾아 줄마다 표시한다.
      const gOf={}, dOf={};
      for(const g of d.groups){for(const it of (g.items||[])){
        if(!(it.nm in gOf)){ gOf[it.nm]=g; dOf[it.nm]=!!it.d; }}}
      sChanges='<div class="card"><h3>'+L("changesH")
        +' <span class="bleg"><span class="bdot on"></span>'+(LANG==="en"?"live":"실시간")
        +' <span class="bdot dl"></span>'+(LANG==="en"?"delayed":"지연")
        +' <span class="bdot"></span>'+(LANG==="en"?"closed":"장마감")+'</span></h3>'
        +d.changes.map(c=>{
        // 🔴 줄 자체가 지연값(d)이면 묶음이 실시간이어도 지연으로 적는다
        const _g=gOf[c.nm], _di=!!dOf[c.nm];
        const _lv=!_di&&grpLive(_g), _dl=!_lv&&(_di||grpDelay(_g));
        const dot='<span class="bdot'+(_lv?" on":(_dl?" dl":""))+'" title="'
          +(_lv?(LANG==="en"?"live":"실시간"):(_dl?(LANG==="en"?"delayed":"지연")
            :(LANG==="en"?"closed":"장마감")))+'"></span>';
        const up=c.pct>=0,half=Math.abs(c.pct)/mx*50,col=up?"#00a868":"#ff433d";
        const bar=up?'<span style="position:absolute;left:50%;top:0;height:11px;width:'+half+'%;background:'+col+';border-radius:0 3px 3px 0"></span>'
                    :'<span style="position:absolute;right:50%;top:0;height:11px;width:'+half+'%;background:'+col+';border-radius:3px 0 0 3px"></span>';
        return '<div class="brow"><span class="bn">'+dot+tr(c.nm)+'</span><span class="bbar">'+bar+'</span>'
          +'<span class="bp" style="color:'+col+'">'+(up?"+":"")+c.pct.toFixed(2)+'%</span></div>';}).join("")+'</div>';
    }
    let sSpecial="";
    if(d.kr_status){const st=d.kr_status;const wk=!st.open,openNow=(!wk)&&krLiveNow();
      const en=LANG==="en";
      const icon=wk?"🔴":(openNow?"🟢":"🌙");
      const stx=en?(wk?st.en:(openNow?"Open (trading hours)":"Closed (after hours)"))
                  :(wk?st.ko:(openNow?"개장 중":"장 마감 (오늘 거래일)"));
      const col=wk?"#ff433d":(openNow?"#00a868":"var(--sub)");
      let h='<div class="card injh"><h3>'+(en?"Korea Market Status":"국내 증시 현황")+'</h3>';

// ---- 공용 헐 차트 엔진 (팬/줌·십자선, 옵션: 지지저항·청산맵) ----
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function jwma(v,n){const out=new Array(v.length).fill(null),den=n*(n+1)/2;
  for(let i=n-1;i<v.length;i++){let s=0,ok=true;for(let k=0;k<n;k++){const x=v[i-n+1+k];if(x==null){ok=false;break;}s+=x*(k+1);}if(ok)out[i]=s/den;}return out;}
function jhma(v,L){const h=Math.floor(L/2),r=Math.round(Math.sqrt(L)),w1=jwma(v,h),w2=jwma(v,L);
  const raw=v.map((_,i)=>(w1[i]!=null&&w2[i]!=null)?2*w1[i]-w2[i]:null);return jwma(raw,r);}
function jsma(v,w){const out=new Array(v.length).fill(null);let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=w)s-=v[i-w];if(i>=w-1)out[i]=s/w;}return out;}
function jwalls(raw,cur){const seg=raw.slice(-240).filter(b=>b[4]>0);if(seg.length<20||cur<=0)return{up:null,dn:null};
  let lo=Math.min.apply(null,seg.map(b=>b[3])),hi=Math.max.apply(null,seg.map(b=>b[2]));if(hi<=lo)return{up:null,dn:null};
  const bins=24,step=(hi-lo)/bins,vol=new Array(bins).fill(0);
  for(const b of seg){const v=b[5]||0;if(v<=0)continue;let k=Math.floor(((b[2]+b[3]+b[4])/3-lo)/step);k=clamp(k,0,bins-1);vol[k]+=v;}
  const mx=Math.max.apply(null,vol)||1,peaks=[];
  for(let i=1;i<bins-1;i++)if(vol[i]>vol[i-1]&&vol[i]>vol[i+1]&&vol[i]>0)peaks.push([lo+step*(i+0.5),vol[i]/mx]);
  const up=peaks.filter(p=>p[0]>cur),dn=peaks.filter(p=>p[0]<cur);
  return{up:up.length?up.reduce((a,b)=>a[0]<b[0]?a:b):null,dn:dn.length?dn.reduce((a,b)=>a[0]>b[0]?a:b):null};}
function jliq(raw,cur){const bins=48,lb=240,mmr=0.005,levs=[10,25,50,100];
  const seg=raw.slice(-lb).filter(b=>b[4]>0);if(seg.length<20||cur<=0)return[];
  let lo=Math.min.apply(null,seg.map(b=>b[3])),hi=Math.max.apply(null,seg.map(b=>b[2]));if(hi<=lo)return[];
  const step=(hi-lo)/bins,grid=new Array(bins).fill(0);
  for(const b of seg){let v=b[5]||0;if(v<=0)v=1;const p=(b[2]+b[3]+b[4])/3;
    for(const L of levs)for(const liq of [p*(1-1/L)/(1-mmr),p*(1+1/L)/(1+mmr)])
      if(liq>=lo&&liq<hi)grid[Math.min(bins-1,Math.floor((liq-lo)/step))]+=v;}
  const mx=Math.max.apply(null,grid)||1,out=[];
  for(let i=0;i<bins;i++){const s=grid[i]/mx;if(s<=0)continue;
    const lft=i>0?grid[i-1]:-1,rgt=i<bins-1?grid[i+1]:-1;
    if(grid[i]>=lft&&grid[i]>=rgt&&s>=0.25)out.push([lo+step*(i+0.5),s]);}
  return out;}

// ── 계산 도구 ──
function c21Ema(v,n){const o=new Array(v.length).fill(null),k=2/(n+1);let e=null,c=0;
  for(let i=0;i<v.length;i++){const x=v[i];if(x==null)continue;e=(e==null)?x:(x*k+e*(1-k));c++;if(c>=n)o[i]=e;}return o;}
function c21Sma(v,n){const o=new Array(v.length).fill(null);let s=0,q=[];
  for(let i=0;i<v.length;i++){const x=v[i];if(x==null){s=0;q=[];continue;}q.push(x);s+=x;if(q.length>n)s-=q.shift();if(q.length===n)o[i]=s/n;}return o;}
function c21Atr(B,n){const o=new Array(B.length).fill(null);let a=null;
  for(let i=0;i<B.length;i++){const x=B[i],tr=i?Math.max(x[2]-x[3],Math.abs(x[2]-B[i-1][4]),Math.abs(x[3]-B[i-1][4])):(x[2]-x[3]);
    if(i<n){a=(a||0)+tr/n;if(i===n-1)o[i]=a;}else{a=(a*(n-1)+tr)/n;o[i]=a;}}return o;}
function c21Rng(a,i,n,max){let r=max?-Infinity:Infinity;for(let k=Math.max(0,i-n+1);k<=i;k++)r=max?Math.max(r,a[k]):Math.min(r,a[k]);return r;}
// 고점·저점 뽑기(지그재그) — 되돌림이 2.5×ATR(없으면 3%)을 넘을 때마다 꺾인다
function c21Piv(B){const at=c21Atr(B,14),P=[];if(B.length<5)return P;let dir=0,ei=0,ep=B[0][4];
  for(let i=1;i<B.length;i++){const th=Math.max((at[i]||B[i][4]*0.03)*2.5,B[i][4]*0.012),h=B[i][2],l=B[i][3];
    if(dir>=0){if(h>=ep||dir===0&&h>ep){ep=h;ei=i;if(dir===0)dir=1;}
      if(dir===1&&l<=ep-th){P.push([ei,ep,"H"]);dir=-1;ep=l;ei=i;continue;}
      if(dir===0&&l<=B[0][4]-th){dir=-1;ep=l;ei=i;}}
    if(dir===-1){if(l<=ep){ep=l;ei=i;}if(h>=ep+th){P.push([ei,ep,"L"]);dir=1;ep=h;ei=i;}}}
  P.push([ei,ep,dir===1?"H":"L"]);            // 마지막 꺾임은 아직 확정 전
  return P;}

// 판별 계산 — 자료를 받을 때 한 번(시세 한 칸이 바뀌면 다시)
function c21Calc(key,B,CH){
  const c=B.map(b=>b[4]),h=B.map(b=>b[2]),l=B.map(b=>b[3]),v=B.map(b=>+b[5]||0),N=B.length,R={hasVol:v.some(x=>x>0)};
  const band=(m,up,dn,col,col2)=>{R.lines=[[m,col,1.4],[up,col2,1.1],[dn,col2,1.1]];R.fill=[up,dn];};
  if(key==="bb"){const m=c21Sma(c,20),s=m.map((x,i)=>{if(x==null)return null;let q=0;for(let k=i-19;k<=i;k++)q+=(c[k]-x)*(c[k]-x);return Math.sqrt(q/20);});
    band(m,m.map((x,i)=>x==null?null:x+2*s[i]),m.map((x,i)=>x==null?null:x-2*s[i]),C21_COL.org,C21_COL.blue);}
  if(key==="ich"){const tk=c.map((_,i)=>i<8?null:(c21Rng(h,i,9,1)+c21Rng(l,i,9,0))/2),kj=c.map((_,i)=>i<25?null:(c21Rng(h,i,26,1)+c21Rng(l,i,26,0))/2),
      sb=c.map((_,i)=>i<51?null:(c21Rng(h,i,52,1)+c21Rng(l,i,52,0))/2),A=c.map((_,i)=>i>=26&&tk[i-26]!=null&&kj[i-26]!=null?(tk[i-26]+kj[i-26])/2:null),
      S=c.map((_,i)=>i>=26?sb[i-26]:null),lag=c.map((_,i)=>i+26<N?c[i+26]:null);
    R.lines=[[tk,C21_COL.red,1.2],[kj,C21_COL.blue,1.2],[A,C21_COL.grn,1],[S,C21_COL.brn,1],[lag,C21_COL.pur,1]];R.fill=[A,S];}
  if(key==="env"){const m=c21Sma(c,20);band(m,m.map(x=>x==null?null:x*1.05),m.map(x=>x==null?null:x*0.95),C21_COL.org,C21_COL.blue);}
  if(key==="kel"){const m=c21Ema(c,20),a=c21Atr(B,10);band(m,m.map((x,i)=>x==null||a[i]==null?null:x+2*a[i]),m.map((x,i)=>x==null||a[i]==null?null:x-2*a[i]),C21_COL.org,C21_COL.pur);}
  if(key==="vwap"||key==="vwma"){const n=key==="vwap"?20:100,o=new Array(N).fill(null);
    for(let i=n-1;i<N;i++){let pv=0,vv=0;for(let k=i-n+1;k<=i;k++){const tp=key==="vwap"?(h[k]+l[k]+c[k])/3:c[k];pv+=tp*v[k];vv+=v[k];}o[i]=vv>0?pv/vv:null;}
    R.lines=[[o,key==="vwap"?C21_COL.pur:C21_COL.org,2]];}
  if(key==="rsi"){const o=new Array(N).fill(null);let g=0,s=0;
    for(let i=1;i<N;i++){const d=c[i]-c[i-1],u=Math.max(d,0),w=Math.max(-d,0);
      if(i<=14){g+=u/14;s+=w/14;if(i===14)o[i]=s?100-100/(1+g/s):100;}else{g=(g*13+u)/14;s=(s*13+w)/14;o[i]=s?100-100/(1+g/s):100;}}
    R.sub=[[o,C21_COL.pur,1.5]];R.lv=[30,70];R.rng=[0,100];}
  if(key==="macd"){const f=c21Ema(c,12),s=c21Ema(c,26),m=c.map((_,i)=>f[i]!=null&&s[i]!=null?f[i]-s[i]:null),g=c21Ema(m,9);
    R.sub=[[m,C21_COL.blue,1.4],[g,C21_COL.org,1.2]];R.hist=m.map((x,i)=>x!=null&&g[i]!=null?x-g[i]:null);R.zero=1;}
  if(key==="sto"){const k=c.map((_,i)=>{if(i<13)return null;const hh=c21Rng(h,i,14,1),ll=c21Rng(l,i,14,0);return hh>ll?(c[i]-ll)/(hh-ll)*100:50;}),
      ks=c21Sma(k,3),ds=c21Sma(ks,3);R.sub=[[ks,C21_COL.blue,1.4],[ds,C21_COL.org,1.2]];R.lv=[20,80];R.rng=[0,100];}
  if(key==="vol"){R.hist=v.slice();R.vcol=1;}
  if(key==="obv"){const o=[0];for(let i=1;i<N;i++)o.push(o[i-1]+(c[i]>c[i-1]?v[i]:c[i]<c[i-1]?-v[i]:0));R.sub=[[o,C21_COL.grn,1.5]];}

  if(key==="nz"){const P=R.piv,out=[];
    for(let j=2;j<P.length;j++){const a=P[j-2],b=P[j-1],q=P[j];
      if(a[2]==="L"&&b[2]==="H"&&q[2]==="L"&&q[1]>a[1]&&q[1]<b[1])out.push({pts:[a,b,q],up:1,tgt:q[1]+(b[1]-a[1]),ti:q[0]+(b[0]-a[0])});
      if(a[2]==="H"&&b[2]==="L"&&q[2]==="H"&&q[1]<a[1]&&q[1]>b[1])out.push({pts:[a,b,q],up:0,tgt:q[1]-(a[1]-b[1]),ti:q[0]+(b[0]-a[0])});}
    R.nz=out.slice(-3);}
  if(key==="ew"){const P=R.piv;let best=null;
    for(let j=P.length-6;j>=0&&!best;j--){const p=P.slice(j,j+6).map(x=>x[1]),t=P[j][2],s=t==="L"?1:-1;
      const q=p.map(x=>x*s);          // 하락 충동파는 뒤집어서 같은 규칙으로
      const w1=q[1]-q[0],w3=q[3]-q[2],w5=q[5]-q[4];
      if(q[1]>q[0]&&q[2]>q[0]&&q[3]>q[1]&&q[4]>q[1]&&q[5]>q[3]&&!(w3<w1&&w3<w5))best={j,imp:P.slice(j,j+6),abc:P.slice(j+6,j+9)};}
    R.ew=best;R.ewAbc=best?null:P.slice(-3);}
  if(key==="hm"){const P=R.piv,PAT=[["가틀리","Gartley",[.55,.68],[.38,.89],[1.13,1.62],[.74,.83]],["배트","Bat",[.38,.5],[.38,.89],[1.62,2.62],[.85,.93]],

    const inr=(x,r)=>x>=r[0]&&x<=r[1];let hit=null;
    for(let j=P.length-5;j>=0&&!hit;j--){const [X,A,Bp,C,D]=P.slice(j,j+5).map(x=>x[1]),XA=Math.abs(A-X),AB=Math.abs(Bp-A),BC=Math.abs(C-Bp),CD=Math.abs(D-C);

    const av=v.slice(s0).reduce((a,x)=>a+x,0)/w||0,ev=[];
    let ex=s0;for(let i=s0;i<N;i++)if(acc?(B[i][3]<B[ex][3]):(B[i][2]>B[ex][2]))ex=i;
    ev.push([ex,acc?B[ex][3]:B[ex][2],acc?"SC":"BC"]);
    for(let i=s0+1;i<N;i++){const b=B[i];
      if(acc&&b[3]<sup&&b[4]>sup&&i!==ex)ev.push([i,b[3],"Spring"]);
      if(!acc&&b[2]>res&&b[4]<res&&i!==ex)ev.push([i,b[2],"UTAD"]);
      if(acc&&b[4]>res&&(!av||v[i]>av))ev.push([i,b[2],"SOS"]);
      if(!acc&&b[4]<sup&&(!av||v[i]>av))ev.push([i,b[3],"SOW"]);}
    const keep=[],seen={};for(let k=ev.length-1;k>=0;k--){if(seen[ev[k][2]])continue;seen[ev[k][2]]=1;keep.push(ev[k]);}
    R.wy={s0,sup,res,acc,ev:keep};}
  return R;
}

      ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText(t,W/2,H/2+1);ctx.textAlign="left";}}
  // 판 넘기기 — 옛 판이 옆으로 밀려나가고 새 판이 들어온다(0.25초). hold 가 있으면 그 순간에서 멈춘다(도면용).

function asiaLiveNow(){       // 한국시각 평일 09:00~19:00 (니케이·호주 개장 ~ 인도 니프티·센섹스 마감 15:30 IST)

function _etnow(){var p={};
  new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false})
    .formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  var wd={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[p.weekday],hh=parseInt(p.hour,10);if(hh>=24)hh-=24;
  return {d:wd,m:hh*60+parseInt(p.minute,10)};}
function usIndexLive(){var e=_etnow();return e.d>=1&&e.d<=5&&e.m>=570&&e.m<960;}   // 미국주식 정규장 09:30~16:00 ET
function usFutLive(){var e=_etnow();                                                // CME 선물(원자재·국채) ~24h
  if(e.d===6)return false; if(e.d===0&&e.m<1080)return false;                       // 토 휴장·일 18:00 ET 개장 전
  if(e.d===5&&e.m>=1020)return false; if(e.m>=1020&&e.m<1080)return false;          // 금 17:00 마감·매일 17~18시 정산휴장
  return true;}

function cardFull(id){
  try{
    if(id==="myhold"){
      const b=document.getElementById("mhBody");
      return !!(b && b.querySelector("table"));      // 표가 그려졌으면 찼다
    }
    if(id==="stock") return !!(typeof stkCode!=="undefined" && stkCode);
    if(id==="coin2") return !!(typeof coinSym!=="undefined" && coinSym);
  }catch(e){}
  return false;
}
let _ordKey="";
function orderCards(){
  try{
    const ids=["stock","coin2"];   // 🔴 myhold 는 빼둔다 — 실계좌 단추가 그 안에 있다
    const key=ids.map(cardFull).join(",");
    if(key===_ordKey)return;                          // 바뀔 때만 움직인다
    _ordKey=key;
    const head=document.getElementById("gauges");     // 값 카드들이 시작하는 자리
    const tail=document.getElementById("news");       // 아래쪽 자리
    if(!head||!tail)return;
    // 찬 것은 위로(원래 순서 유지), 빈 것은 아래로
    ids.forEach(function(id){
      const el=document.getElementById(id); if(!el)return;
      if(cardFull(id)) head.parentNode.insertBefore(el,head);
    });
    ids.forEach(function(id){
      const el=document.getElementById(id); if(!el)return;
      if(!cardFull(id)) tail.parentNode.insertBefore(el,tail);
    });
  }catch(e){}
}

function shDone(){ const p=E("shPanel"); if(p)setTimeout(function(){p.hidden=true;},200); }
function shMsg(m){ const e=E("shMsg"); if(e)e.textContent=m; }
function shCopy(){
  const en=LANG==="en";
  const done=function(){ shMsg(en?"Link copied":"링크를 복사했습니다"); };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(SH_URL).then(done).catch(shCopyOld);
    } else shCopyOld();
  }catch(e){ shCopyOld(); }
}
function shCopyOld(){
  try{
    const ta=document.createElement("textarea"); ta.value=SH_URL;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    shMsg(LANG==="en"?"Link copied":"링크를 복사했습니다");
  }catch(e){ shMsg(SH_URL); }
}
function shKakao(){
  const en=LANG==="en";
  // 🔴 SDK 는 **미리** 불러 둔다(위 script 태그). 누른 뒤에 불러오면 클릭 권한이 풀려
  //    카카오 팝업창이 막히고 '복사'로 떨어진다(2026-09-16 실측).
  if(KAKAO_JS_KEY&&window.Kakao&&window.Kakao.Share){
    try{
      if(!window.Kakao.isInitialized())window.Kakao.init(KAKAO_JS_KEY);
      // 🔴 카카오 창은 몇 초 걸린다 — 안내를 먼저 띄운다("안 되는 줄 알고 나간다", 사장님 2026-09-16)
      shMsg(en?"Connecting… please wait":"연결중… 잠시 대기해주세요");
      setTimeout(function(){ shMsg(""); }, 6000);
      window.Kakao.Share.sendDefault({objectType:"feed",
        content:{title:SH_TTL_KO,description:shTxt(),imageUrl:SH_URL.replace("live.html","cover.png"),
                 link:{mobileWebUrl:SH_URL,webUrl:SH_URL}},
        buttons:[{title:en?"Open":"열어보기",link:{mobileWebUrl:SH_URL,webUrl:SH_URL}}]});
      return;                       // 패널은 열어 둔다 — 안내 문구가 보여야 한다

    }catch(e){ shMsg("카카오 공유 실패 — 링크를 복사합니다"); }
  }
  // ② 키가 없으면 — 폰은 기본 공유창(카톡 포함), PC 는 링크 복사
  if(navigator.share){
    navigator.share({title:SH_TTL_KO,text:shTxt(),url:SH_URL}).then(shDone).catch(function(){});
    return;
  }
  shCopy(); shMsg(LANG==="en"?"Link copied — paste into KakaoTalk":"링크를 복사했습니다 — 카카오톡에 붙여넣기");
}

  var oh=document.getElementById("ophrs"); if(oh)oh.textContent=L("ophrs");

}

  var vid=""; try{vid=localStorage.getItem("brief_vid")||"";}catch(e){}

}

const SV_PAL = ["#3D6B8E", "#4C93A6", "#5AA189", "#C9A03F", "#C4764F", "#A85A66", "#7A6B93"];
// 🔴 색은 순서가 아니라 **갈래**에 붙인다 — 등급이 달라져도 정기예금은 늘 같은 남색이다.

function svColor(nm, i) { return SV_COLOR[nm] || SV_PAL[i % SV_PAL.length]; }

// 색 밝기 조절 — 겉면 그라데이션·옆면(그늘) 만들기
function svShade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const m = function (v) { return Math.max(0, Math.min(255, Math.round(f < 1 ? v * f : v + (255 - v) * (f - 1)))); };
  return "#" + ((1 << 24) + (m(r) << 16) + (m(g) << 8) + m(b)).toString(16).slice(1);
}

function svGet() { try { return JSON.parse(localStorage.getItem(SV_KEY) || "null"); } catch (e) { return null; } }
function svSave(o) { try { localStorage.setItem(SV_KEY, JSON.stringify(o)); } catch (e) {} }
function svBroker() { try { return localStorage.getItem(SV_BROKER) || ""; } catch (e) { return ""; } }
function svDaysLeft(at) {
  const d = new Date(at); d.setFullYear(d.getFullYear() + 1);
  return Math.ceil((d - new Date()) / 86400000);
}
// 별지 제2호 — 합계(총점 32)를 100점으로 환산한 뒤 20/40/60/80 으로 가른다.
function svScore100(raw) { return raw / SV_MAX * 100; }
function svGradeOf(raw) {

// 입체 원그래프 — 타원으로 눕히고 옆면을 겹쳐 쌓아 두께를 만든다 (사장님 2026-09-20).
//   옆면은 조각 전체를 아래로 한 칸씩 내려 그린 뒤 겉면을 덮는다. 그러면 앞쪽 옆면만 남아 두께로 보인다.
function svPie(mix) {
  const tot = mix.reduce(function (s, m) { return s + m[1]; }, 0) || 1;
  const cx = 130, cy = 92, rx = 112, ry = 64, dep = 24;
  // 🔴 한 화면에 그래프가 둘 이상이면 id 가 겹쳐 앞 그래프 색을 따라간다 — 부를 때마다 다른 이름을 준다.
  const uid = "sv" + (svPie.n = (svPie.n || 0) + 1) + "_";
  const seg = mix.map(function (m, i) { return {nm: m[0], v: m[1], c: svColor(m[0], i)}; });
  let a = -Math.PI / 2;
  seg.forEach(function (s) { s.a0 = a; a += (s.v / tot) * 2 * Math.PI; s.a1 = a; });

  function wedge(a0, a1, dy) {
    const x0 = cx + rx * Math.cos(a0), y0 = cy + ry * Math.sin(a0) + dy;
    const x1 = cx + rx * Math.cos(a1), y1 = cy + ry * Math.sin(a1) + dy;
    return 'M' + cx + ',' + (cy + dy) + ' L' + x0.toFixed(2) + ',' + y0.toFixed(2)
         + ' A' + rx + ',' + ry + ' 0 ' + ((a1 - a0) > Math.PI ? 1 : 0) + ',1 ' + x1.toFixed(2) + ',' + y1.toFixed(2) + ' Z';
  }

  let defs = "", sides = "", tops = "", labels = "";
  seg.forEach(function (s, i) {
    defs += '<linearGradient id="' + uid + i + '" x1="0.1" y1="0" x2="0.5" y2="1">'
          + '<stop offset="0" stop-color="' + svShade(s.c, 1.3) + '"/>'
          + '<stop offset="0.5" stop-color="' + s.c + '"/>'
          + '<stop offset="1" stop-color="' + svShade(s.c, 0.85) + '"/></linearGradient>';
  });
  for (let d = dep; d >= 1; d--) {
    const t = 1 - d / dep;                                  // 아래로 갈수록 어둡게
    seg.forEach(function (s) {
      sides += '<path d="' + wedge(s.a0, s.a1, d) + '" fill="' + svShade(s.c, 0.64 + 0.16 * t) + '"/>';
    });
  }
  seg.forEach(function (s, i) {
    tops += '<path d="' + wedge(s.a0, s.a1, 0) + '" fill="url(#' + uid + i + ')" stroke="rgba(255,255,255,.5)" stroke-width="0.9"/>';
    if (s.v / tot >= 0.05) {
      const am = (s.a0 + s.a1) / 2;
      labels += '<text x="' + (cx + rx * 0.64 * Math.cos(am)).toFixed(1) + '" y="' + (cy + ry * 0.64 * Math.sin(am) + 4.5).toFixed(1)
             + '" font-size="13" font-weight="800" text-anchor="middle" fill="#fff"'
             + ' stroke="rgba(0,0,0,.30)" stroke-width="2.6" style="paint-order:stroke">' + s.v + '%</text>';
    }
  });
  return '<div style="text-align:center;margin:2px 0 8px">'
    + '<svg viewBox="0 0 260 186" width="100%" style="max-width:300px">'
    + '<defs>' + defs
    + '<radialGradient id="' + uid + 'sh"><stop offset="0.35" stop-color="rgba(0,0,0,.26)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/></radialGradient>'
    + '</defs>'
    + '<ellipse cx="' + cx + '" cy="' + (cy + dep + 14) + '" rx="' + (rx * 0.95) + '" ry="' + (ry * 0.28) + '" fill="url(#' + uid + 'sh)"/>'
    + sides + tops + labels + '</svg></div>'
    + '<div class="svleg">' + seg.map(function (s) {
        return '<span><i style="background:linear-gradient(145deg,' + svShade(s.c, 1.24) + ',' + svShade(s.c, 0.8) + ')"></i>'
             + s.nm + ' ' + s.v + '%</span>';
      }).join("") + '</div>';
}
function svRecoRender() {
  const box = document.getElementById("svRecoBody");

  h += '<div class="svsub">상품은 성향에 맞는 갈래를 보여 드리는 것이고, 사고파는 결정과 주문은 사장님이 증권사에서 하십니다.</div>';
  box.innerHTML = h;
}

// 🔴 패키지 이름이 틀릴 수 있어, 앱이 없으면 스토어 '검색'으로 떨어뜨린다(엉뚱한 앱을 열지 않게).
function svOpenMts(code) {

    + SV_MTS.map(function (m) {

      }).join("") + '</div>';

<script>
// 설치 도우미 (사장님 2026-09-20 "사용자가 신경 안 쓰게 깔리게 못 하나")
// 🔴 웹앱을 사용자 몰래 깔 수는 없다 — 브라우저가 반드시 사용자에게 묻는다. 그래서 **누를 자리를 우리가 띄운다.**
//   ① 카톡·네이버 등 앱 안 브라우저 : 설치 기능 자체가 없다 → 크롬으로 튕겨 보낸다(안드로이드는 한 번에).
//   ② 안드로이드 크롬 : beforeinstallprompt 를 잡아 두었다가 우리 단추로 진짜 설치창을 띄운다(메뉴 뒤질 일 없음).
//   ③ 아이폰 : 사파리의 공유 → 홈 화면에 추가 뿐이다. 그림으로 짚어 준다.
(function () {
  var UA = navigator.userAgent || "";
  var isKakao = /KAKAOTALK/i.test(UA);
  var isLine = /Line\//i.test(UA);
  var inApp = isKakao || isLine || /NAVER\(inapp|Instagram|FB_IAB|FBAN|FBAV|DaumApps|everytimeApp/i.test(UA);

  var isIOS = /iPhone|iPad|iPod/i.test(UA);

  // ── 카톡에서 열었을 때 : 톡 안 브라우저를 빠져나간다 ───────────────────
  // 카톡이 열어 주는 전용 주소(kakaotalk://web/openExternal)가 있다. 안드로이드·아이폰 둘 다 먹는다.
  // 한 번만 튕긴다(sessionStorage). 주소에 ?stay=1 을 붙이면 안 튕긴다.
  (function jump() {
    if (!inApp) return;
    if (/[?&]stay=1/.test(location.search)) return;
    try { if (sessionStorage.getItem("ins_jumped")) return; sessionStorage.setItem("ins_jumped", "1"); } catch (e) {}
    var url = location.href.split("#")[0];
    if (isKakao) { location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url); return; }
    if (isLine) { location.href = url + (url.indexOf("?") < 0 ? "?" : "&") + "openExternalBrowser=1"; return; }
    if (isAnd) { toChrome(); }
  })();

  function installed() {
    try {
      return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
    } catch (e) { return false; }
  }
  function muted() {
    try { return Date.now() < (+localStorage.getItem(dismissKey) || 0); } catch (e) { return false; }
  }
  function mute(days) {
    try { localStorage.setItem(dismissKey, Date.now() + days * 86400000); } catch (e) {}
  }
  function kill() { var b = document.getElementById("insBar"); if (b) b.remove(); shown = false; }

  // 카톡 → 크롬. 안드로이드는 intent 로 곧바로 넘어간다(크롬 없으면 스토어로).
  function toChrome() {
    var u = location.href.replace(/^https?:\/\//, "");
    location.href = "intent://" + u + "#Intent;scheme=https;package=com.android.chrome;"
      + "S.browser_fallback_url=" + encodeURIComponent(location.href) + ";end";
  }
  function doInstall() {
    if (!prompt_) return;
    prompt_.prompt();
    prompt_.userChoice.then(function (r) { if (r && r.outcome === "accepted") kill(); });
    prompt_ = null;
  }
  window.insToChrome = toChrome;
  window.insInstall = doInstall;
  window.insOut = function () {                    // 톡 밖으로 — 카톡 전용 주소가 먼저, 안드로이드는 크롬 인텐트
    var url = location.href.split("#")[0];
    if (isKakao) { location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url); return; }
    if (isLine) { location.href = url + (url.indexOf("?") < 0 ? "?" : "&") + "openExternalBrowser=1"; return; }
    if (isAnd) { toChrome(); }
  };
  window.insClose = function () { mute(7); kill(); };

  function bar(html) {
    if (shown || installed() || muted()) return;
    shown = true;
    var d = document.createElement("div");
    d.id = "insBar";
    d.setAttribute("style",
      "position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:12px 14px calc(12px + env(safe-area-inset-bottom));"
      + "background:var(--card,#fff);color:var(--nm,#212529);border-top:1px solid var(--bd,#dee2e6);"
      + "box-shadow:0 -6px 24px rgba(0,0,0,.18);font-size:13.5px;line-height:1.5");
    d.innerHTML = '<button onclick="insClose()" style="position:absolute;top:6px;right:8px;border:0;background:transparent;'
      + 'color:var(--sub,#868e96);font-size:18px;line-height:1;padding:4px 6px;cursor:pointer">×</button>' + html;
    document.body.appendChild(d);
  }
  var BTN = "display:block;width:100%;margin-top:9px;padding:12px;border:0;border-radius:12px;"
          + "background:var(--tint,#1c7ed6);color:#fff;font-size:14.5px;font-weight:800;cursor:pointer";

  function go() {
    if (installed()) return;
    if (inApp) {
      // 자동으로 튕겼는데도 여기 남아 있다면(차단·구버전) 누를 자리를 준다.
      bar('<b>앱으로 설치하시려면 한 번만 누르십니다.</b>'
        + '<div style="color:var(--sub,#868e96);font-size:12px;margin-top:3px">'
        + '카카오톡 안에서는 설치가 안 됩니다. ' + (isIOS ? "사파리로" : "크롬으로") + ' 넘어가면 설치 단추가 바로 뜹니다.</div>'
        + '<button onclick="insOut()" style="' + BTN + '">' + (isIOS ? "사파리로" : "크롬으로") + ' 열기</button>');
      return;
    }
    if (isIOS) {                       // 사파리 — 애플은 설치창을 안 준다
      bar('<b>홈 화면에 앱으로 추가하십니다.</b><div style="color:var(--sub,#868e96);font-size:12px;margin-top:3px">'
        + '아래쪽 <b>공유</b> 단추(□↑)를 누르고 <b>홈 화면에 추가</b>를 고르십니다.</div>');
      return;
    }
    if (prompt_) {
      bar('<b>앱으로 설치하시겠습니까?</b><div style="color:var(--sub,#868e96);font-size:12px;margin-top:3px">'
        + '홈 화면에 아이콘이 생기고, 주소창 없이 앱처럼 열립니다.</div>'
        + '<button onclick="insInstall()" style="' + BTN + '">앱 설치</button>');
    }
  }

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); prompt_ = e;
    if (!shown) go();
  });
  window.addEventListener("appinstalled", function () { mute(3650); kill(); });
  // 크롬이 beforeinstallprompt 를 늦게 준다 — 조금 기다렸다가 안내를 띄운다.
  setTimeout(go, 2500);
})();

</script>
</body></html>
