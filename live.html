 body{padding:10px 12px 40px}
 h1{font-size:14px}h1 .lv{font-size:9px;margin-left:2px}

}

</style></head><body>
<div class="top">

<script>
// ---- 스파크라인 ----
function spark(a){
  if(!a||a.length<2)return"";
  const w=(window.innerWidth<520?38:54),h=18,lo=Math.min(...a),hi=Math.max(...a),rg=(hi-lo)||1,n=a.length;
  const up=a[a.length-1]>=a[0],c=up?"#00a868":"#ff433d";
  let p="";for(let i=0;i<n;i++){p+=(i?" ":"")+(2+(w-4)*i/(n-1)).toFixed(1)+","+(h-2-(h-4)*(a[i]-lo)/rg).toFixed(1);}
  return'<svg width="'+w+'" height="'+h+'" style="vertical-align:middle"><polyline points="'+p+'" fill="none" stroke="'+c+'" stroke-width="1.4"/></svg>';
}
function pcrow(it){
  const p=it.pct,cls=p>0?"up":(p<0?"dn":"fl"),arw=p>0?"▲":(p<0?"▼":"");
  return'<div class="row"><span class="nm">'+tr(it.nm)+(it.d?' <span style="font-size:9px;color:#e0a020;font-weight:700;vertical-align:middle">D</span>':'')+'</span><span class="rt">'
    +spark(it.spark)+'<span class="val">'+it.val+'</span>'
    +'<span class="pc '+cls+'">'+arw+Math.abs(p).toFixed(2)+'%</span></span></div>';
}
const TAG={"국내":'<span class="tag soon">실시간 예정</span>'};
function grpTag(t){return TAG[t]||'<span class="tag delay">D 지연</span>';}

// 배포 허브(Cloudflare WebSocket). 비우면 data.json 폴링(로컬/깃허브).
const HUB="https://brief-live-hub.emhwang3.workers.dev";  // Cloudflare WebSocket 허브
try{var _vid=localStorage.getItem("brief_vid");if(!_vid){_vid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem("brief_vid",_vid);}
  var _src="";try{_src=(new URLSearchParams(location.search)).get("src")||"";}catch(e){}
  if(!_src){var _r=document.referrer||"";
    if(/youtu/i.test(_r))_src="yt";else if(/x\.com|twitter|t\.co/i.test(_r))_src="x";
    else if(/naver|blog/i.test(_r))_src="blog";else if(/kakao|kko|daum/i.test(_r))_src="kt";
    else if(/telegram|t\.me/i.test(_r))_src="tg";else _src=_r?"ref":"direct";}
  if(HUB)fetch(HUB.replace(/\/$/,"")+"/hit?vid="+_vid+"&src="+encodeURIComponent(_src),{mode:"no-cors"}).catch(function(){});}catch(e){}  // 방문 카운트+경로
// ---- PWA(홈 화면 앱) ----
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
// 설치바는 앱으로 실행 중이 아니면 무조건 뜬다. 설치 신호(beforeinstallprompt)가 없는 곳(인앱브라우저·이미 설치·삼성 등)은 버튼이 안내/바깥 브라우저로 넘김
var _deferPrompt=null,_iosHint=false;
var _ua=navigator.userAgent||"";
var _iOS=/iPad|iPhone|iPod/.test(_ua)||(/Macintosh/.test(_ua)&&navigator.maxTouchPoints>1);
var _android=/Android/i.test(_ua);
var _kakao=/KAKAOTALK/i.test(_ua);
var _inapp=_kakao||/NAVER\(|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|Telegram|; wv\)/i.test(_ua)||(_iOS&&!/Safari/.test(_ua));
var _samsung=/SamsungBrowser/i.test(_ua);
function _standalone(){try{return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}catch(e){return false;}}
function dismissInstall(){var b=document.getElementById("installBar");if(b)b.hidden=true;}  // 이번 화면에서만 닫힘
function _openExternal(){var u=location.href;
  if(_kakao){location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(u);return true;}
  if(_android){location.href="intent://"+location.host+location.pathname+location.search+"#Intent;scheme=https;package=com.android.chrome;end";return true;}
  return false;}
function doInstall(){
  if(_deferPrompt){_deferPrompt.prompt();_deferPrompt.userChoice.then(function(){_deferPrompt=null;});return;}
  if(_inapp&&_openExternal())return;
  _iosHint=true;_il();}
function _il(){var en=false;try{en=(LANG==="en");}catch(e){}
  var t=document.getElementById("installTxt"),b=document.getElementById("installBtn");if(!t)return;
  if(b)b.hidden=false;
  if(_deferPrompt){t.textContent=en?"📲 Add to your home screen and open instantly":"📲 홈 화면에 앱으로 추가하고 바로 여세요";if(b)b.textContent=en?"Install app":"앱설치";return;}

  return tf==="D"?(p(d.getMonth()+1)+"/"+p(d.getDate())):(p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()));}
function renderStkResults(){
  const en=LANG==="en";
  let h=(lastResults||[]).map(r=>{const dn=((en&&r.en)?r.en:r.name)||r.code;
    return '<a onclick="pickStock(\''+r.code+'\',\''+dn.replace(/[\'"]/g,"")+'\')"><span>'+dn+' <span class="mkt">KR</span></span><span class="c">'+r.code+'</span></a>';}).join("");
  h+=(usResults||[]).map(r=>{const dn=(r.name||r.tick).replace(/[\'"]/g,"");
    return '<a onclick="pickStockUS(\''+r.code+'\',\''+dn+'\')"><span>'+dn+' <span class="mkt us">US</span></span><span class="c">'+r.tick+'</span></a>';}).join("");

E("stkq").addEventListener("input",function(){
  clearTimeout(searchTimer); const q=this.value.trim();
  if(q.length<1){E("stkResults").innerHTML="";lastResults=[];usResults=[];return;}
  const seq=++searchSeq;
  searchTimer=setTimeout(function(){
    E("stkResults").innerHTML='<div class="soonrow">'+(LANG==="en"?"Searching…":"검색 중…")+'</div>';
    const latin=/[A-Za-z]/.test(q)&&!/[가-힣]/.test(q);
    lastResults=[]; usResults=[];
    if(latin)usFetch("search","q="+encodeURIComponent(q)).then(function(d){if(seq!==searchSeq)return;usResults=(d&&d.data)||[];renderStkResults();});
    krFetch("search","q="+encodeURIComponent(q),4).then(function(rows){if(seq!==searchSeq)return;lastResults=rows||[];renderStkResults();});
  },350);
});
E("stkq").addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  if(lastResults.length){const r=lastResults[0];pickStock(r.code,(LANG==="en"&&r.en)?r.en:r.name);this.blur();}
  else if(usResults.length){const r=usResults[0];pickStockUS(r.code,r.name);this.blur();}
});

async function loadStockUS(){
  if(!stkCode||stkMarket!=="us")return;
  const rk=await Promise.all([
    usFetch("kline","code="+encodeURIComponent(stkCode)+"&type=8&num=2"),
    usFetch("quote","codes="+encodeURIComponent(stkCode))]);
  const k=rk[0],tr=rk[1];
  const rl=(k&&k.data&&k.data[0]&&k.data[0].respList)||[];
  if(!rl.length)return;
  const today=rl[0], prev=rl[1]||rl[0];
  const price=(tr&&tr.data&&tr.data[0]&&+tr.data[0].p)||+today.c;
  const open=+today.o, prevc=+prev.c, vol=+today.v, tv=+today.vw;
  const co=open?(price-open)/open*100:0, cp=prevc?(price-prevc)/prevc*100:0;
  const cls=x=>x>0?"up":(x<0?"dn":"fl"),arw=x=>x>0?"▲":(x<0?"▼":"");
  const en=LANG==="en", tick=stkCode.replace(/\.US$/,"");

    '<div class="stkhd">'+tick+' <span style="color:var(--sub);font-size:13px;font-weight:600">US</span></div>'
   +'<table class="stktab">'
   +'<tr><td class="k">'+L("price")+'</td><td class="v">'+usPrice(price)+'</td></tr>'
   +'<tr><td class="k">'+L("vsOpen")+'</td><td class="v '+cls(co)+'">'+arw(co)+Math.abs(co).toFixed(2)+'%</td></tr>'
   +'<tr><td class="k">'+L("vsPrev")+'</td><td class="v '+cls(cp)+'">'+arw(cp)+Math.abs(cp).toFixed(2)+'%</td></tr>'
   +'<tr><td class="k">'+L("vol")+'</td><td class="v">'+Math.round(vol).toLocaleString()+(en?"":"주")+'</td></tr>'
   +'<tr><td class="k">'+L("turnover")+'</td><td class="v">'+usMoney(tv)+'</td></tr>'
   +'</table>';

async function loadChartUS(){
  if(!stkCode||stkMarket!=="us")return;
  E("stkChartLbl").textContent=L("chartLoading");
  const kt=US_KT[stkTf]||8;
  const k=await usFetch("kline","code="+encodeURIComponent(stkCode)+"&type="+kt+"&num=250");
  const rl=(k&&k.data&&k.data[0]&&k.data[0].respList)||[];
  if(rl.length<2){E("stkChartLbl").textContent=L("chartNone");return;}
  const asc=rl.slice().reverse();
  const bars=asc.map(b=>[usFmtT(+b.t,stkTf),+b.o,+b.h,+b.l,+b.c]);
  const raw=asc.map(b=>[+b.t,+b.o,+b.h,+b.l,+b.c,+b.v]);
  const closes=bars.map(b=>b[4]),cur=closes[closes.length-1];
  const hma=jhma(closes,55),sma=jsma(closes,60),walls=jwalls(raw,cur);

}

// ---- 공용 헐 차트 엔진 (팬/줌·십자선, 옵션: 지지저항·청산맵) ----
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function jwma(v,n){const out=new Array(v.length).fill(null),den=n*(n+1)/2;
  for(let i=n-1;i<v.length;i++){let s=0,ok=true;for(let k=0;k<n;k++){const x=v[i-n+1+k];if(x==null){ok=false;break;}s+=x*(k+1);}if(ok)out[i]=s/den;}return out;}
function jhma(v,L){const h=Math.floor(L/2),r=Math.round(Math.sqrt(L)),w1=jwma(v,h),w2=jwma(v,L);
  const raw=v.map((_,i)=>(w1[i]!=null&&w2[i]!=null)?2*w1[i]-w2[i]:null);return jwma(raw,r);}
function jsma(v,w){const out=new Array(v.length).fill(null);let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=w)s-=v[i-w];if(i>=w-1)out[i]=s/w;}return out;}
function jwalls(raw,cur){const seg=raw.slice(-240).filter(b=>b[4]>0);if(seg.length<20||cur<=0)return{up:null,dn:null};
  let lo=Math.min.apply(null,seg.map(b=>b[3])),hi=Math.max.apply(null,seg.map(b=>b[2]));if(hi<=lo)return{up:null,dn:null};
  const bins=24,step=(hi-lo)/bins,vol=new Array(bins).fill(0);
  for(const b of seg){const v=b[5]||0;if(v<=0)continue;let k=Math.floor(((b[2]+b[3]+b[4])/3-lo)/step);k=clamp(k,0,bins-1);vol[k]+=v;}
  const mx=Math.max.apply(null,vol)||1,peaks=[];
  for(let i=1;i<bins-1;i++)if(vol[i]>vol[i-1]&&vol[i]>vol[i+1]&&vol[i]>0)peaks.push([lo+step*(i+0.5),vol[i]/mx]);
  const up=peaks.filter(p=>p[0]>cur),dn=peaks.filter(p=>p[0]<cur);
  return{up:up.length?up.reduce((a,b)=>a[0]<b[0]?a:b):null,dn:dn.length?dn.reduce((a,b)=>a[0]>b[0]?a:b):null};}
function jliq(raw,cur){const bins=48,lb=240,mmr=0.005,levs=[10,25,50,100];
  const seg=raw.slice(-lb).filter(b=>b[4]>0);if(seg.length<20||cur<=0)return[];
  let lo=Math.min.apply(null,seg.map(b=>b[3])),hi=Math.max.apply(null,seg.map(b=>b[2]));if(hi<=lo)return[];
  const step=(hi-lo)/bins,grid=new Array(bins).fill(0);
  for(const b of seg){let v=b[5]||0;if(v<=0)v=1;const p=(b[2]+b[3]+b[4])/3;
    for(const L of levs)for(const liq of [p*(1-1/L)/(1-mmr),p*(1+1/L)/(1+mmr)])
      if(liq>=lo&&liq<hi)grid[Math.min(bins-1,Math.floor((liq-lo)/step))]+=v;}
  const mx=Math.max.apply(null,grid)||1,out=[];
  for(let i=0;i<bins;i++){const s=grid[i]/mx;if(s<=0)continue;
    const lft=i>0?grid[i-1]:-1,rgt=i<bins-1?grid[i+1]:-1;
    if(grid[i]>=lft&&grid[i]>=rgt&&s>=0.25)out.push([lo+step*(i+0.5),s]);}
  return out;}
function makeChart(cid,opt){
  opt=opt||{}; const cv=E(cid); const NF=opt.fmt||(v=>Math.round(v).toLocaleString());
  let CH=null,VIEW={start:0,count:120},CROSS=null,GEO=null;
  function setData(d){CH=d;const N=d.bars.length;VIEW.count=Math.min(120,N||1);VIEW.start=Math.max(0,N-VIEW.count);CROSS=null;draw();}
  function draw(){
    if(!CH||!CH.bars.length)return;
    const bars=CH.bars,hma=CH.hma,sma=CH.sma,N=bars.length,W=cv.clientWidth,H=cv.clientHeight;
    const dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;
    const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    let cnt=clamp(Math.round(VIEW.count),20,N),start=clamp(Math.round(VIEW.start),0,Math.max(0,N-cnt));
    VIEW.count=cnt;VIEW.start=start;const end=start+cnt,cur=bars[N-1][4];
    const x0=6,x1=W-56,y0=8,yEnd=H-16,yP=yEnd;
    let lo=Infinity,hi=-Infinity;
    for(let i=start;i<end;i++){lo=Math.min(lo,bars[i][3]);hi=Math.max(hi,bars[i][2]);
      for(const a of [hma,sma]){const v=a[i];if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}}}
    if(opt.walls&&CH.walls)for(const w of [CH.walls.up,CH.walls.dn])if(w&&Math.abs(w[0]/cur-1)<0.35){lo=Math.min(lo,w[0]);hi=Math.max(hi,w[0]);}
    if(!(hi>lo))hi=lo+1;const pd=(hi-lo)*0.06;lo-=pd;hi+=pd;
    const X=i=>x0+(x1-x0)*(cnt<=1?0.5:(i-start)/(cnt-1)),Y=v=>yP-(yP-y0)*(v-lo)/(hi-lo);
    GEO={x0,x1,y0,yEnd,start,cnt,N};
    if(opt.liq&&CH.liq)for(const lv of CH.liq){const y=Y(lv[0]);if(y<y0||y>yP)continue;
      const a=0.9*Math.pow(clamp(lv[1],0,1),1.7);if(a<0.09)continue;
      ctx.fillStyle="rgba(255,214,0,"+a.toFixed(3)+")";for(let x=x0;x<x1;x+=7)ctx.fillRect(x,y-3,6,6);}
    const cw=Math.max(1,(x1-x0)/cnt*0.62);
    for(let i=start;i<end;i++){const b=bars[i],up=b[4]>=b[1],col=up?"#00a868":"#ff433d",xc=X(i);
      ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(xc,Y(b[2]));ctx.lineTo(xc,Y(b[3]));ctx.stroke();
      const yo=Y(b[1]),yc=Y(b[4]);ctx.fillRect(xc-cw/2,Math.min(yo,yc),cw,Math.max(1,Math.abs(yc-yo)));}
    ctx.strokeStyle="#8a93a3";ctx.lineWidth=1.3;ctx.beginPath();let s2=false;
    for(let i=start;i<end;i++){const v=sma[i];if(v==null){s2=false;continue;}const xx=X(i),yy=Y(v);if(!s2){ctx.moveTo(xx,yy);s2=true;}else ctx.lineTo(xx,yy);}ctx.stroke();
    ctx.lineWidth=2.6;ctx.lineCap="round";
    for(let i=Math.max(start,1);i<end;i++){const a=hma[i-1],b=hma[i];if(a==null||b==null)continue;
      const ref=hma[i-2],up=(ref!=null)?(b>ref):(b>=a);ctx.strokeStyle=up?"#00c853":"#ff433d";
      ctx.beginPath();ctx.moveTo(X(i-1),Y(a));ctx.lineTo(X(i),Y(b));ctx.stroke();}
    ctx.lineCap="butt";
    if(opt.walls&&CH.walls){const dw=(w,isUp)=>{if(!w)return;const y=Y(w[0]);if(y<y0||y>yP)return;
      const col=isUp?"#ff6b6b":"#26c281";ctx.strokeStyle=col;ctx.lineWidth=1+2*(w[1]||0);
      ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=col;ctx.font="9px sans-serif";ctx.textAlign="left";ctx.fillText(NF(w[0]),x0+2,y-2);};
      dw(CH.walls.up,true);dw(CH.walls.dn,false);}
    const subc=(getComputedStyle(document.body).getPropertyValue("--sub")||"#889").trim();
    ctx.textAlign="left";ctx.font="10px sans-serif";ctx.fillStyle=subc;
    ctx.fillText(NF(hi),x1+3,y0+8);ctx.fillText(NF(lo),x1+3,yP);
    ctx.fillStyle="#5db4ff";ctx.fillText(NF(cur),x1+3,clamp(Y(cur),y0+8,yP));
    if(CROSS!=null){const ci=clamp(CROSS.i,start,end-1),xc=X(ci),b=bars[ci];
      ctx.strokeStyle="#ffffff";ctx.lineWidth=0.8;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(xc,y0);ctx.lineTo(xc,yEnd);ctx.stroke();
      if(CROSS.py!=null&&CROSS.py<=yP){ctx.beginPath();ctx.moveTo(x0,CROSS.py);ctx.lineTo(x1,CROSS.py);ctx.stroke();}
      ctx.setLineDash([]);
      ctx.fillStyle="#0b1220";ctx.fillRect(xc-40,yEnd+1,80,13);ctx.fillStyle="#cfd6e0";ctx.font="9px sans-serif";ctx.textAlign="center";ctx.fillText(b[0],xc,yEnd+11);
      if(CROSS.py!=null&&CROSS.py<=yP){const pv=lo+(yP-CROSS.py)/(yP-y0)*(hi-lo);
        ctx.fillStyle="#0b1220";ctx.fillRect(x1+1,CROSS.py-7,55,14);ctx.fillStyle="#5db4ff";ctx.textAlign="left";ctx.fillText(NF(pv),x1+3,CROSS.py+3);}
      ctx.fillStyle=subc;ctx.textAlign="left";ctx.font="10px sans-serif";
      ctx.fillText("시"+NF(b[1])+" 고"+NF(b[2])+" 저"+NF(b[3])+" 종"+NF(b[4]),x0+2,y0+9);}
  }
  let down=false,sx=0,sStart=0,pinch=null;
  const rel=(e)=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  const idxAt=(px)=>GEO?clamp(Math.round(GEO.start+(px-GEO.x0)/(GEO.x1-GEO.x0)*(GEO.cnt-1)),0,GEO.N-1):0;
  const barW=()=>GEO?(GEO.x1-GEO.x0)/GEO.cnt:1;
  cv.addEventListener("mousemove",e=>{if(!CH)return;const p=rel(e);
    if(down){VIEW.start=clamp(sStart-Math.round((p.x-sx)/barW()),0,CH.bars.length-VIEW.count);}
    CROSS={i:idxAt(p.x),py:p.y};draw();});
  cv.addEventListener("mousedown",e=>{if(e.button!==0)return;const p=rel(e);down=true;sx=p.x;sStart=VIEW.start;});
  window.addEventListener("mouseup",()=>{down=false;});
  cv.addEventListener("mouseleave",()=>{down=false;CROSS=null;draw();});
  cv.addEventListener("wheel",e=>{if(!CH)return;e.preventDefault();const p=rel(e),N=CH.bars.length;
    const f=e.deltaY>0?1.18:1/1.18,nc=clamp(Math.round(VIEW.count*f),20,N),ci=idxAt(p.x),frac=(ci-VIEW.start)/VIEW.count;
    VIEW.start=clamp(Math.round(ci-frac*nc),0,N-nc);VIEW.count=nc;draw();},{passive:false});
  cv.addEventListener("touchstart",e=>{if(!CH)return;
    if(e.touches.length===2){pinch={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),c:VIEW.count};down=false;return;}
    const p=rel(e);down=true;sx=p.x;sStart=VIEW.start;CROSS={i:idxAt(p.x),py:p.y};draw();},{passive:false});
  cv.addEventListener("touchmove",e=>{if(!CH)return;e.preventDefault();
    if(e.touches.length===2&&pinch){const nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      const N=CH.bars.length,nc=clamp(Math.round(pinch.c*pinch.d/Math.max(1,nd)),20,N),e0=VIEW.start+VIEW.count;VIEW.count=nc;VIEW.start=clamp(e0-nc,0,N-nc);draw();return;}
    const p=rel(e);if(down){VIEW.start=clamp(sStart-Math.round((p.x-sx)/barW()),0,CH.bars.length-VIEW.count);}
    CROSS={i:idxAt(p.x),py:p.y};draw();},{passive:false});
  cv.addEventListener("touchend",()=>{down=false;pinch=null;});
  function patchLast(price){if(!CH||!CH.bars.length||!(price>0))return;
    const b=CH.bars[CH.bars.length-1];b[4]=price;if(price>b[2])b[2]=price;if(price<b[3])b[3]=price;draw();}
  return {setData,patchLast};
}

let coinSym=null, coinTf="D", coinTimer=null, coinSearchTimer=null, coinList=null, coinLast=[];
function coinFmtTime(ms,tf){const d=new Date(ms),p=n=>String(n).padStart(2,"0"),md=p(d.getMonth()+1)+"/"+p(d.getDate());
  return tf==="D"?md:md+" "+p(d.getHours())+":"+p(d.getMinutes());}
async function coinSyms(){
  if(coinList)return coinList;
  try{const ei=await fetch("https://api.binance.com/api/v3/exchangeInfo").then(r=>r.json());
    coinList=ei.symbols.filter(s=>s.quoteAsset==="USDT"&&s.status==="TRADING").map(s=>s.baseAsset);}catch(e){coinList=[];}
  return coinList;
}
E("coinq").addEventListener("input",function(){clearTimeout(coinSearchTimer);const q=this.value.trim().toUpperCase();

// 종목 실시간 태그 — 정규장(평일 09:00~15:30 KST)만 켠다. 그 외엔 지연.
function krLiveNow(){const k=new Date(Date.now()+new Date().getTimezoneOffset()*60000+324e5);
  const m=k.getHours()*60+k.getMinutes();return k.getDay()>=1&&k.getDay()<=5&&m>=480&&m<1200;} // 평일 08:00~20:00
// 미국 동부시간(서머타임 자동) → {요일, 분}
function _etnow(){var p={};
  new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false})
    .formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  var wd={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[p.weekday],hh=parseInt(p.hour,10);if(hh>=24)hh-=24;
  return {d:wd,m:hh*60+parseInt(p.minute,10)};}
function usIndexLive(){var e=_etnow();return e.d>=1&&e.d<=5&&e.m>=570&&e.m<960;}   // 미국주식 정규장 09:30~16:00 ET
function usFutLive(){var e=_etnow();                                                // CME 선물(원자재·국채) ~24h
  if(e.d===6)return false; if(e.d===0&&e.m<1080)return false;                       // 토 휴장·일 18:00 ET 개장 전
  if(e.d===5&&e.m>=1020)return false; if(e.m>=1020&&e.m<1080)return false;          // 금 17:00 마감·매일 17~18시 정산휴장
  return true;}
function usFxLive(){var e=_etnow();                                                 // FX 24h(일 17시~금 17시 ET)
  if(e.d===6)return false; if(e.d===0&&e.m<1020)return false; if(e.d===5&&e.m>=1020)return false;
  return true;}

function shDone(){ const p=E("shPanel"); if(p)setTimeout(function(){p.hidden=true;},200); }
function shMsg(m){ const e=E("shMsg"); if(e)e.textContent=m; }
function shCopy(){
  const en=LANG==="en";
  const done=function(){ shMsg(en?"Link copied":"링크를 복사했습니다"); };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(SH_URL).then(done).catch(shCopyOld);
    } else shCopyOld();
  }catch(e){ shCopyOld(); }
}
function shCopyOld(){
  try{
    const ta=document.createElement("textarea"); ta.value=SH_URL;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    shMsg(LANG==="en"?"Link copied":"링크를 복사했습니다");
  }catch(e){ shMsg(SH_URL); }
}
function shKakao(){
  const en=LANG==="en";
  // 🔴 SDK 는 **미리** 불러 둔다(위 script 태그). 누른 뒤에 불러오면 클릭 권한이 풀려
  //    카카오 팝업창이 막히고 '복사'로 떨어진다(2026-09-16 실측).
  if(KAKAO_JS_KEY&&window.Kakao&&window.Kakao.Share){
    try{
      if(!window.Kakao.isInitialized())window.Kakao.init(KAKAO_JS_KEY);
      // 🔴 카카오 창은 몇 초 걸린다 — 안내를 먼저 띄운다("안 되는 줄 알고 나간다", 사장님 2026-09-16)
      shMsg(en?"Connecting… please wait":"연결중… 잠시 대기해주세요");
      setTimeout(function(){ shMsg(""); }, 6000);
      window.Kakao.Share.sendDefault({objectType:"feed",
        content:{title:SH_TTL_KO,description:shTxt(),imageUrl:SH_URL.replace("live.html","cover.png"),
                 link:{mobileWebUrl:SH_URL,webUrl:SH_URL}},
        buttons:[{title:en?"Open":"열어보기",link:{mobileWebUrl:SH_URL,webUrl:SH_URL}}]});
      return;                       // 패널은 열어 둔다 — 안내 문구가 보여야 한다

    }catch(e){ shMsg("카카오 공유 실패 — 링크를 복사합니다"); }
  }
  // ② 키가 없으면 — 폰은 기본 공유창(카톡 포함), PC 는 링크 복사
  if(navigator.share){
    navigator.share({title:SH_TTL_KO,text:shTxt(),url:SH_URL}).then(shDone).catch(function(){});
    return;
  }
  shCopy(); shMsg(LANG==="en"?"Link copied — paste into KakaoTalk":"링크를 복사했습니다 — 카카오톡에 붙여넣기");
}
