<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일일브리핑 LIVE</title>
<style>
*{margin:0;box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--bg:#0f1420;--card:#171d2b;--bd:#222a3a;--tx:#f4f5f7;--sub:#9aa4b2;--nm:#e8ecf2;--soon:#6b7688}
body.light{--bg:#f4f5f7;--card:#ffffff;--bd:#e6e8ec;--tx:#1a1a1a;--sub:#667;--nm:#222;--soon:#9aa}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Malgun Gothic",sans-serif;
 max-width:520px;margin:0 auto;padding:14px 14px 40px;transition:background .2s,color .2s;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
h1 .lv{color:#ff433d;font-size:12px;font-weight:800;vertical-align:super;margin-left:4px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.right{display:flex;align-items:center;gap:10px}
.clock{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.tgl{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:5px 9px;font-size:15px;cursor:pointer}
.asof{font-size:11.5px;color:var(--soon);margin-bottom:8px}
.gauges{display:flex;gap:10px;margin-bottom:4px}
.gnote{font-size:11px;color:#8a93a3;text-align:center;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 8px;text-align:center}
.stat .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--sub);font-weight:600;margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:12px 0}
.card h3{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px}
.tag.live{background:#0b2b16;color:#00e619}
.tag.soon{background:#2a2410;color:#e0a020}
.tag.delay{background:#3a2a0e;color:#e0a020}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none}
.nm{font-size:16px;font-weight:600;color:var(--nm);min-width:0;line-height:1.2;word-break:keep-all;overflow-wrap:break-word}
.rt{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:0 0 auto}
.val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.pc{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.up{color:#00a868}.dn{color:#ff433d}.fl{color:var(--sub)}
.soonrow{color:var(--soon);font-size:14px;padding:8px 2px}
.foot{color:var(--soon);font-size:11.5px;margin-top:14px;text-align:center;line-height:1.5}
.brow{display:grid;grid-template-columns:78px 1fr 62px;align-items:center;gap:6px;padding:5px 2px}
.bn{font-size:14px;color:var(--nm);line-height:1.15;word-break:keep-all;overflow-wrap:break-word}
.bbar{position:relative;height:11px;border-left:1px solid var(--bd)}
.bp{text-align:right;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.crow{display:flex;align-items:center;gap:7px;padding:5px 2px;border-bottom:1px solid var(--bd);font-size:13px}
.crow:last-child{border-bottom:none}
.ct{font-weight:800;font-variant-numeric:tabular-nums;color:var(--nm);min-width:42px}
.cc{color:var(--sub);min-width:36px}
.ci{flex:1;min-width:0;line-height:1.2;word-break:keep-all;overflow-wrap:break-word;color:var(--nm)}
.cd{color:#e0a020;font-size:10px}
.nhd{font-weight:800;color:var(--nm);font-size:13px;margin:8px 0 2px}
.nrow{display:block;color:var(--nm);text-decoration:none;font-size:13px;padding:5px 2px;border-bottom:1px solid var(--bd);opacity:.9}
.injh .srow{padding:6px 2px;color:var(--nm);font-size:14px}
.injh h3{color:var(--sub);font-size:13px;margin-bottom:4px}.injh .chdr{color:var(--soon);font-size:11px;font-weight:400}
.stkq{width:100%;padding:9px 11px;font-size:15px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--nm)}
.stkres a{display:flex;justify-content:space-between;gap:8px;padding:8px 6px;border-bottom:1px solid var(--bd);color:var(--nm);text-decoration:none;font-size:14px;cursor:pointer}
.stkres a:last-child{border-bottom:none}.stkres a .c{color:var(--sub);font-variant-numeric:tabular-nums}
.stktab{width:100%;border-collapse:collapse;margin-top:9px;font-size:13.5px}
.stktab td{padding:6px 4px;border-bottom:1px solid var(--bd)}
.stktab tr:last-child td{border-bottom:none}
.stktab td.k{color:var(--sub);white-space:nowrap}
.stktab td.v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--nm)}
.stkhd{font-size:17px;font-weight:800;color:var(--nm);margin-top:2px}
.stkchart{width:100%;height:240px;margin-top:10px;display:block;border-radius:8px;touch-action:none;cursor:crosshair}
.stkcl{font-size:11px;color:var(--sub);margin-top:3px;text-align:center}
.stktf{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.stktf button{flex:1;min-width:42px;background:var(--bg);border:1px solid var(--bd);color:var(--sub);border-radius:7px;padding:5px 0;font-size:12px;cursor:pointer}
.stktf button.on{background:#1b3a5a;color:#5db4ff;border-color:#2a5580}
</style></head><body>
<div class="top">
  <h1 id="ttl">일일브리핑<span class="lv">● LIVE</span></h1>
  <div class="right"><span class="clock" id="clk">--:--:--</span>
   <button class="tgl" id="lng" onclick="toggleLang()">EN</button>
   <button class="tgl" id="tg" onclick="toggle()">🌙</button></div>
</div>
<div class="asof" id="asof">불러오는 중…</div>

<div class="card" id="stock">
  <h3>종목 조회 <span class="tag live" id="stkTag">● 실시간</span></h3>
  <input id="stkq" class="stkq" placeholder="종목코드 또는 이름 (예: 005930, 삼성전자)" autocomplete="off">
  <div id="stkResults" class="stkres"></div>
  <div id="stkDetail"></div>
  <div id="stkTf" class="stktf" hidden>
    <button data-tf="3">3분</button><button data-tf="5">5분</button>
    <button data-tf="15">15분</button><button data-tf="30">30분</button>
    <button data-tf="60">60분</button><button data-tf="D" class="on">일</button>
  </div>
  <canvas id="stkChart" class="stkchart" hidden></canvas>
  <div id="stkChartLbl" class="stkcl" hidden></div>
</div>

<div class="card" id="coin2">
  <h3>코인 조회 <span class="tag live">● 바이낸스</span></h3>
  <input id="coinq" class="stkq" placeholder="코인 심볼 (예: BTC, ETH, SOL)" autocomplete="off">
  <div id="coinResults" class="stkres"></div>
  <div id="coinDetail"></div>
  <div id="coinTf" class="stktf" hidden>
    <button data-tf="3">3분</button><button data-tf="5">5분</button>
    <button data-tf="15">15분</button><button data-tf="30">30분</button>
    <button data-tf="60">60분</button><button data-tf="D" class="on">일</button>
  </div>
  <canvas id="coinChart" class="stkchart" hidden></canvas>
  <div id="coinChartLbl" class="stkcl" hidden></div>
</div>

<div class="gauges" id="gauges"></div>
<div class="gnote">시장온도 · VIX · 공포·탐욕 — 주식시장 기준</div>
<div id="cards"></div>

<div class="card" id="coin-card">
  <h3>암호화폐 <span class="tag live">● 바이낸스</span></h3>
  <div id="coin"><div class="soonrow">불러오는 중…</div></div>
</div>

<div id="news"></div>

<div class="foot" id="foot"></div>

<script>
// ---- 스파크라인 ----
function spark(a){
  if(!a||a.length<2)return"";
  const w=54,h=18,lo=Math.min(...a),hi=Math.max(...a),rg=(hi-lo)||1,n=a.length;
  const up=a[a.length-1]>=a[0],c=up?"#00a868":"#ff433d";
  let p="";for(let i=0;i<n;i++){p+=(i?" ":"")+(2+(w-4)*i/(n-1)).toFixed(1)+","+(h-2-(h-4)*(a[i]-lo)/rg).toFixed(1);}
  return'<svg width="'+w+'" height="'+h+'" style="vertical-align:middle"><polyline points="'+p+'" fill="none" stroke="'+c+'" stroke-width="1.4"/></svg>';
}
function pcrow(it){
  const p=it.pct,cls=p>0?"up":(p<0?"dn":"fl"),arw=p>0?"▲":(p<0?"▼":"");
  return'<div class="row"><span class="nm">'+tr(it.nm)+'</span><span class="rt">'
    +spark(it.spark)+'<span class="val">'+it.val+'</span>'
    +'<span class="pc '+cls+'">'+arw+Math.abs(p).toFixed(2)+'%</span></span></div>';
}
const TAG={"국내":'<span class="tag soon">실시간 예정</span>'};
function grpTag(t){return TAG[t]||'<span class="tag delay">D 지연</span>';}

// 배포 허브(Cloudflare WebSocket). 비우면 data.json 폴링(로컬/깃허브).
const HUB="https://brief-live-hub.emhwang3.workers.dev";  // Cloudflare WebSocket 허브
try{var _vid=localStorage.getItem("brief_vid");if(!_vid){_vid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem("brief_vid",_vid);}
  if(HUB)fetch(HUB.replace(/\/$/,"")+"/hit?vid="+_vid,{mode:"no-cors"}).catch(function(){});}catch(e){}  // 방문 카운트
// ---- 언어(한/영) ----
let LANG="ko"; try{LANG=localStorage.getItem("brief_lang")||"ko";}catch(e){}
const NM={"국내":"KR Indices","미국 지수":"US Indices","미국 야간선물":"US Futures (Night)","아시아":"Asia",
 "금리·채권":"Rates / Bonds","환율·달러":"FX / Dollar","원자재":"Commodities",
 "코스피":"KOSPI","코스닥":"KOSDAQ","코스피200":"KOSPI200","코스피200 야간선물":"KOSPI200 Night Fut.",
 "S&P500":"S&P500","나스닥100":"NASDAQ100","다우":"Dow","러셀2000":"Russell2000","반도체(SOX)":"SOX",
 "S&P 선물":"S&P Futures","나스닥 선물":"NASDAQ Futures","니케이225":"Nikkei225","상하이":"Shanghai","항셍":"Hang Seng",
 "미 10년물":"US 10Y","미 13주":"US 13W","미 30년물":"US 30Y",
 "원/달러":"USD/KRW","달러지수":"Dollar Index","엔/달러":"USD/JPY","위안/달러":"USD/CNY",
 "WTI 원유":"WTI Crude","브렌트":"Brent","금":"Gold","구리":"Copper","천연가스":"Nat Gas",
 "한국 기준금리":"BOK Base Rate","CD 91일":"CD 91D","국고채 3년":"KTB 3Y","국고채 10년":"KTB 10Y",
 "미국 10Y−13주":"US 10Y−13W","한국 10Y−3Y":"KR 10Y−3Y",
 "한국":"Korea","미국":"US","중국":"China","일본":"Japan","유로존":"Eurozone","독일":"Germany","영국":"UK","유럽":"Europe"};
function tr(k){return LANG==="en"?(NM[k]||k):k;}
const T={title:{ko:"일일브리핑",en:"Daily Brief"},stockH:{ko:"종목 조회",en:"Stock Search"},coinH:{ko:"코인 조회",en:"Coin Search"},
 krateH:{ko:"한국 금리",en:"Korea Rates"},spreadH:{ko:"장단기 금리차이",en:"Yield Spread"},spreadN:{ko:"음수=역전",en:"neg=inverted"},
 changesH:{ko:"주요 자산 전일대비",en:"Key Assets"},calH:{ko:"경제지표 일정 (오늘)",en:"Economic Calendar (Today)"},newsH:{ko:"헤드라인 뉴스",en:"Headlines (KR)"},coinCardH:{ko:"암호화폐",en:"Crypto"},
 live:{ko:"● 실시간",en:"● LIVE"},delay:{ko:"D 지연",en:"D delayed"},closed:{ko:"장마감",en:"Closed"},delayed2:{ko:"지연(장마감)",en:"Delayed (Closed)"},
 mtemp:{ko:"시장온도",en:"Mkt Temp"},vixL:{ko:"VIX · 공포",en:"VIX · Fear"},fgL:{ko:"공포·탐욕",en:"Fear & Greed"},
 gnote:{ko:"시장온도 · VIX · 공포·탐욕 — 주식시장 기준",en:"Market Temp · VIX · Fear&Greed — stock market basis"},
 price:{ko:"현재가",en:"Price"},vsOpen:{ko:"시초가 대비",en:"vs Open"},vsPrev:{ko:"전일종가 대비",en:"vs Prev Close"},
 vol:{ko:"거래량",en:"Volume"},turnover:{ko:"거래대금",en:"Turnover"},strength:{ko:"체결강도",en:"Trade Strength"},
 chg24:{ko:"24시간 변동율",en:"24h Change"},vol24:{ko:"거래량(24h)",en:"Volume (24h)"},tv24:{ko:"거래대금(24h)",en:"Turnover (24h)"},
 inverted:{ko:"역전⚠",en:"inverted⚠"},normal:{ko:"정상",en:"normal"},loading:{ko:"불러오는 중…",en:"Loading…"},
 chartLoading:{ko:"차트 불러오는 중…",en:"Loading chart…"},chartNone:{ko:"차트 없음",en:"No chart"},
 stkPH:{ko:"종목코드 또는 이름 (예: 005930, 삼성전자)",en:"Code or name (e.g. 005930, Samsung)"},
 coinPH:{ko:"코인 심볼 (예: BTC, ETH, SOL)",en:"Coin symbol (e.g. BTC, ETH, SOL)"},
 asof:{ko:" 기준",en:""},binance:{ko:"● 바이낸스",en:"● Binance"},snap:{ko:" · 스냅샷",en:" · snapshot"}};
function L(k){const t=T[k];return t?(t[LANG]||t.ko):k;}
const TEMPW={ko:["차가움","서늘","미지근","따뜻","뜨거움"],en:["Cold","Cool","Neutral","Warm","Hot"]};
const TFW={"3":{ko:"3분",en:"3m"},"5":{ko:"5분",en:"5m"},"15":{ko:"15분",en:"15m"},"30":{ko:"30분",en:"30m"},"60":{ko:"60분",en:"60m"},"D":{ko:"일",en:"1D"}};
function toggleLang(){LANG=LANG==="en"?"ko":"en";try{localStorage.setItem("brief_lang",LANG);}catch(e){}applyLang();}
function render(d){
  window._lastD=d;
  {
    document.getElementById("asof").textContent=d.asof+L("asof")+(d.__snap?L("snap"):"");
    // 게이지 (+ 시장온도)
    let g="";
    if(d.temp!=null){const t=d.temp,li=t<=25?0:t<=45?1:t<=60?2:t<=75?3:4,lab=TEMPW[LANG][li],
      col=t>=70?"#ff433d":(t<=30?"#3b82f6":"#e0a020");
      g+='<div class="stat"><div class="n" style="color:'+col+'">'+t+'°</div><div class="l">'+L("mtemp")+' · '+lab+'</div></div>';}
    if(d.gauges){
      if(d.gauges.vix!=null)g+='<div class="stat"><div class="n" style="color:'+(d.gauges.vix<20?"#00a868":(d.gauges.vix>30?"#ff433d":"#e0a020"))+'">'+d.gauges.vix+'</div><div class="l">'+L("vixL")+'</div></div>';
      if(d.gauges.fg!=null)g+='<div class="stat"><div class="n" style="color:'+(d.gauges.fg>=75?"#ff433d":(d.gauges.fg<=25?"#00a868":"#e0a020"))+'">'+d.gauges.fg+'</div><div class="l">'+L("fgL")+'</div></div>';
    }
    document.getElementById("gauges").innerHTML=g;
    // 카드 조각들(순서: 특이일 → 캘린더 → 주요자산막대 → 지수그룹 → 한국금리 → 장단기 → [코인] → 뉴스)
    let sGroups="";
    for(const gr of d.groups){
      if(!gr.items.length)continue;
      let live=gr.rt;
      if(gr.title==="국내")live=krLiveNow();   // 국내 지수: 평일 08~20시만
      else if(gr.title==="미국 지수"||gr.title==="원자재")live=gr.rt&&usLiveNow();  // 미국 CFD: 주말 휴장
      const tag=live?'<span class="tag live">'+L("live")+'</span>':'<span class="tag delay">'+L("closed")+'</span>';
      sGroups+='<div class="card"><h3>'+tr(gr.title)+' '+tag+'</h3>'+gr.items.map(pcrow).join("")+'</div>';
    }
    let sKrates="";
    if(d.krates&&d.krates.length){
      sKrates='<div class="card"><h3>'+L("krateH")+' <span class="tag delay">'+L("delay")+'</span></h3>'
        +d.krates.map(k=>{const c=k.chg>0?"up":(k.chg<0?"dn":"fl"),a=k.chg>0?"▲":(k.chg<0?"▼":"");
          return'<div class="row"><span class="nm">'+tr(k.nm)+'</span><span class="rt">'+spark(k.spark)+'<span class="val">'+k.val+'</span>'
          +'<span class="pc '+c+'">'+a+Math.abs(k.chg).toFixed(2)+'%p</span></span></div>';}).join("")+'</div>';
    }
    let sSpreads="";
    if(d.spreads&&d.spreads.length){
      sSpreads='<div class="card"><h3>'+L("spreadH")+' <span style="color:var(--soon);font-weight:400;font-size:11px">'+L("spreadN")+'</span></h3>'
        +d.spreads.map(s=>'<div class="row"><span class="nm">'+tr(s.nm)+'</span><span class="rt"><span class="val">'+s.val+'</span>'
          +'<span class="pc '+(s.inv?"dn":"up")+'">'+(s.inv?L("inverted"):L("normal"))+'</span></span></div>').join("")+'</div>';
    }
    let sChanges="";
    if(d.changes&&d.changes.length){
      const mx=Math.max.apply(null,d.changes.map(c=>Math.abs(c.pct)).concat([1]));
      sChanges='<div class="card"><h3>'+L("changesH")+'</h3>'+d.changes.map(c=>{
        const up=c.pct>=0,half=Math.abs(c.pct)/mx*50,col=up?"#00a868":"#ff433d";
        const bar=up?'<span style="position:absolute;left:50%;top:0;height:11px;width:'+half+'%;background:'+col+';border-radius:0 3px 3px 0"></span>'
                    :'<span style="position:absolute;right:50%;top:0;height:11px;width:'+half+'%;background:'+col+';border-radius:3px 0 0 3px"></span>';
        return '<div class="brow"><span class="bn">'+tr(c.nm)+'</span><span class="bbar">'+bar+'</span>'
          +'<span class="bp" style="color:'+col+'">'+(up?"+":"")+c.pct.toFixed(2)+'%</span></div>';}).join("")+'</div>';
    }
    let sSpecial="";
    if(LANG==="en"){                          // 영문판: 한글 특이일 대신 개장상태 카드
      if(d.kr_status){const st=d.kr_status;
        sSpecial='<div class="card injh"><h3>KR Market</h3><div class="srow" style="font-weight:700;color:'+(st.open?"#00a868":"#ff433d")+'">'+(st.open?"✅ Open":"🔴 "+st.en)+'</div></div>';}
    }else{
      sSpecial=d.special?'<div class="card injh">'+d.special+'</div>':"";
    }
    let sCalendar="";
    if(d.calendar&&d.calendar.length){
      sCalendar='<div class="card"><h3>'+L("calH")+'</h3>'+d.calendar.map(c=>
        '<div class="crow"><span class="ct">'+c.t+'</span><span class="cc">'+tr(c.cc)+'</span>'
        +'<span class="ci">'+c.title+'</span><span class="cd">'+c.imp+'</span></div>').join("")+'</div>';
    }
    let sNews="";
    const newsSrc=(LANG==="en"&&d.ennews&&d.ennews.length)?d.ennews:d.news;
    if(newsSrc&&newsSrc.length){
      sNews='<div class="card"><h3>'+(LANG==="en"?"Headlines":"헤드라인 뉴스")+'</h3>'+newsSrc.map(s=>
        '<div class="nhd">'+s.src+'</div>'+(s.items||[]).map(it=>
          '<a class="nrow" href="'+it.u+'" target="_blank" rel="noopener">'+it.t+'</a>').join("")).join("")+'</div>';
    }
    // 코인은 #coin-card(3초 갱신) 독립 슬롯 → #cards 는 장단기까지, #news 는 그 아래
    document.getElementById("cards").innerHTML=sSpecial+sCalendar+sChanges+sGroups+sKrates+sSpreads;
    document.getElementById("news").innerHTML=sNews;
  }
}
async function loadData(){
  let d=null;
  const src=HUB?(HUB.replace(/\/$/,"")+"/data"):("data.json?t="+Date.now());
  try{d=await fetch(src,{cache:"no-store"}).then(r=>r.json());}catch(e){}
  if(!d||d.loading||!d.groups)d=window.SNAP||null;
  if(!d||!d.groups){document.getElementById("asof").textContent="서버 준비 중…";return;}
  render(d);
}
let ws=null,wsTimer=null;
function connectWS(){
  try{
    const u=HUB.replace(/^http/,"ws").replace(/\/$/,"")+"/ws";
    ws=new WebSocket(u);
    ws.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d&&d.groups)render(d);}catch(e){}};
    ws.onclose=ws.onerror=()=>{ws=null;clearTimeout(wsTimer);wsTimer=setTimeout(connectWS,3000);loadData();};
  }catch(e){clearTimeout(wsTimer);wsTimer=setTimeout(connectWS,3000);}
}
if(HUB){connectWS();loadData();setInterval(loadData,30000);}  // WS 실시간 + 30초 HTTP 백업
else{loadData();setInterval(loadData,60000);}                  // 로컬/깃허브 폴링

async function krFetch(op,qs,tries){

    try{const d=await fetch(KRB+"/kr/"+op+"?"+qs,{cache:"no-store"}).then(r=>r.json());

}

// ---- 공용 헐 차트 엔진 (팬/줌·십자선, 옵션: 지지저항·청산맵) ----
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function jwma(v,n){const out=new Array(v.length).fill(null),den=n*(n+1)/2;
  for(let i=n-1;i<v.length;i++){let s=0,ok=true;for(let k=0;k<n;k++){const x=v[i-n+1+k];if(x==null){ok=false;break;}s+=x*(k+1);}if(ok)out[i]=s/den;}return out;}
function jhma(v,L){const h=Math.floor(L/2),r=Math.round(Math.sqrt(L)),w1=jwma(v,h),w2=jwma(v,L);
  const raw=v.map((_,i)=>(w1[i]!=null&&w2[i]!=null)?2*w1[i]-w2[i]:null);return jwma(raw,r);}
function jsma(v,w){const out=new Array(v.length).fill(null);let s=0;for(let i=0;i<v.length;i++){s+=v[i];if(i>=w)s-=v[i-w];if(i>=w-1)out[i]=s/w;}return out;}
function jwalls(raw,cur){const seg=raw.slice(-240).filter(b=>b[4]>0);if(seg.length<20||cur<=0)return{up:null,dn:null};
  let lo=Math.min.apply(null,seg.map(b=>b[3])),hi=Math.max.apply(null,seg.map(b=>b[2]));if(hi<=lo)return{up:null,dn:null};
  const bins=24,step=(hi-lo)/bins,vol=new Array(bins).fill(0);
  for(const b of seg){const v=b[5]||0;if(v<=0)continue;let k=Math.floor(((b[2]+b[3]+b[4])/3-lo)/step);k=clamp(k,0,bins-1);vol[k]+=v;}
  const mx=Math.max.apply(null,vol)||1,peaks=[];
  for(let i=1;i<bins-1;i++)if(vol[i]>vol[i-1]&&vol[i]>vol[i+1]&&vol[i]>0)peaks.push([lo+step*(i+0.5),vol[i]/mx]);
  const up=peaks.filter(p=>p[0]>cur),dn=peaks.filter(p=>p[0]<cur);
  return{up:up.length?up.reduce((a,b)=>a[0]<b[0]?a:b):null,dn:dn.length?dn.reduce((a,b)=>a[0]>b[0]?a:b):null};}
function jliq(raw,cur){const bins=48,lb=240,mmr=0.005,levs=[10,25,50,100];
  const seg=raw.slice(-lb).filter(b=>b[4]>0);if(seg.length<20||cur<=0)return[];
  let lo=Math.min.apply(null,seg.map(b=>b[3])),hi=Math.max.apply(null,seg.map(b=>b[2]));if(hi<=lo)return[];
  const step=(hi-lo)/bins,grid=new Array(bins).fill(0);
  for(const b of seg){let v=b[5]||0;if(v<=0)v=1;const p=(b[2]+b[3]+b[4])/3;
    for(const L of levs)for(const liq of [p*(1-1/L)/(1-mmr),p*(1+1/L)/(1+mmr)])
      if(liq>=lo&&liq<hi)grid[Math.min(bins-1,Math.floor((liq-lo)/step))]+=v;}
  const mx=Math.max.apply(null,grid)||1,out=[];
  for(let i=0;i<bins;i++){const s=grid[i]/mx;if(s<=0)continue;
    const lft=i>0?grid[i-1]:-1,rgt=i<bins-1?grid[i+1]:-1;
    if(grid[i]>=lft&&grid[i]>=rgt&&s>=0.25)out.push([lo+step*(i+0.5),s]);}
  return out;}
function makeChart(cid,opt){
  opt=opt||{}; const cv=E(cid); const NF=opt.fmt||(v=>Math.round(v).toLocaleString());
  let CH=null,VIEW={start:0,count:120},CROSS=null,GEO=null;
  function setData(d){CH=d;const N=d.bars.length;VIEW.count=Math.min(120,N||1);VIEW.start=Math.max(0,N-VIEW.count);CROSS=null;draw();}
  function draw(){
    if(!CH||!CH.bars.length)return;
    const bars=CH.bars,hma=CH.hma,sma=CH.sma,N=bars.length,W=cv.clientWidth,H=cv.clientHeight;
    const dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;
    const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    let cnt=clamp(Math.round(VIEW.count),20,N),start=clamp(Math.round(VIEW.start),0,Math.max(0,N-cnt));
    VIEW.count=cnt;VIEW.start=start;const end=start+cnt,cur=bars[N-1][4];
    const x0=6,x1=W-56,y0=8,yEnd=H-16,yP=yEnd;
    let lo=Infinity,hi=-Infinity;
    for(let i=start;i<end;i++){lo=Math.min(lo,bars[i][3]);hi=Math.max(hi,bars[i][2]);
      for(const a of [hma,sma]){const v=a[i];if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}}}
    if(opt.walls&&CH.walls)for(const w of [CH.walls.up,CH.walls.dn])if(w&&Math.abs(w[0]/cur-1)<0.35){lo=Math.min(lo,w[0]);hi=Math.max(hi,w[0]);}
    if(!(hi>lo))hi=lo+1;const pd=(hi-lo)*0.06;lo-=pd;hi+=pd;
    const X=i=>x0+(x1-x0)*(cnt<=1?0.5:(i-start)/(cnt-1)),Y=v=>yP-(yP-y0)*(v-lo)/(hi-lo);
    GEO={x0,x1,y0,yEnd,start,cnt,N};
    if(opt.liq&&CH.liq)for(const lv of CH.liq){const y=Y(lv[0]);if(y<y0||y>yP)continue;
      const a=0.9*Math.pow(clamp(lv[1],0,1),1.7);if(a<0.09)continue;
      ctx.fillStyle="rgba(255,214,0,"+a.toFixed(3)+")";for(let x=x0;x<x1;x+=7)ctx.fillRect(x,y-3,6,6);}
    const cw=Math.max(1,(x1-x0)/cnt*0.62);
    for(let i=start;i<end;i++){const b=bars[i],up=b[4]>=b[1],col=up?"#00a868":"#ff433d",xc=X(i);
      ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(xc,Y(b[2]));ctx.lineTo(xc,Y(b[3]));ctx.stroke();
      const yo=Y(b[1]),yc=Y(b[4]);ctx.fillRect(xc-cw/2,Math.min(yo,yc),cw,Math.max(1,Math.abs(yc-yo)));}
    ctx.strokeStyle="#8a93a3";ctx.lineWidth=1.3;ctx.beginPath();let s2=false;
    for(let i=start;i<end;i++){const v=sma[i];if(v==null){s2=false;continue;}const xx=X(i),yy=Y(v);if(!s2){ctx.moveTo(xx,yy);s2=true;}else ctx.lineTo(xx,yy);}ctx.stroke();
    ctx.lineWidth=2.6;ctx.lineCap="round";
    for(let i=Math.max(start,1);i<end;i++){const a=hma[i-1],b=hma[i];if(a==null||b==null)continue;
      const ref=hma[i-2],up=(ref!=null)?(b>ref):(b>=a);ctx.strokeStyle=up?"#00c853":"#ff433d";
      ctx.beginPath();ctx.moveTo(X(i-1),Y(a));ctx.lineTo(X(i),Y(b));ctx.stroke();}
    ctx.lineCap="butt";
    if(opt.walls&&CH.walls){const dw=(w,isUp)=>{if(!w)return;const y=Y(w[0]);if(y<y0||y>yP)return;
      const col=isUp?"#ff6b6b":"#26c281";ctx.strokeStyle=col;ctx.lineWidth=1+2*(w[1]||0);
      ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=col;ctx.font="9px sans-serif";ctx.textAlign="left";ctx.fillText(NF(w[0]),x0+2,y-2);};
      dw(CH.walls.up,true);dw(CH.walls.dn,false);}
    const subc=(getComputedStyle(document.body).getPropertyValue("--sub")||"#889").trim();
    ctx.textAlign="left";ctx.font="10px sans-serif";ctx.fillStyle=subc;
    ctx.fillText(NF(hi),x1+3,y0+8);ctx.fillText(NF(lo),x1+3,yP);
    ctx.fillStyle="#5db4ff";ctx.fillText(NF(cur),x1+3,clamp(Y(cur),y0+8,yP));
    if(CROSS!=null){const ci=clamp(CROSS.i,start,end-1),xc=X(ci),b=bars[ci];
      ctx.strokeStyle="#ffffff";ctx.lineWidth=0.8;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(xc,y0);ctx.lineTo(xc,yEnd);ctx.stroke();
      if(CROSS.py!=null&&CROSS.py<=yP){ctx.beginPath();ctx.moveTo(x0,CROSS.py);ctx.lineTo(x1,CROSS.py);ctx.stroke();}
      ctx.setLineDash([]);
      ctx.fillStyle="#0b1220";ctx.fillRect(xc-40,yEnd+1,80,13);ctx.fillStyle="#cfd6e0";ctx.font="9px sans-serif";ctx.textAlign="center";ctx.fillText(b[0],xc,yEnd+11);
      if(CROSS.py!=null&&CROSS.py<=yP){const pv=lo+(yP-CROSS.py)/(yP-y0)*(hi-lo);
        ctx.fillStyle="#0b1220";ctx.fillRect(x1+1,CROSS.py-7,55,14);ctx.fillStyle="#5db4ff";ctx.textAlign="left";ctx.fillText(NF(pv),x1+3,CROSS.py+3);}
      ctx.fillStyle=subc;ctx.textAlign="left";ctx.font="10px sans-serif";
      ctx.fillText("시"+NF(b[1])+" 고"+NF(b[2])+" 저"+NF(b[3])+" 종"+NF(b[4]),x0+2,y0+9);}
  }
  let down=false,sx=0,sStart=0,pinch=null;
  const rel=(e)=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  const idxAt=(px)=>GEO?clamp(Math.round(GEO.start+(px-GEO.x0)/(GEO.x1-GEO.x0)*(GEO.cnt-1)),0,GEO.N-1):0;
  const barW=()=>GEO?(GEO.x1-GEO.x0)/GEO.cnt:1;
  cv.addEventListener("mousemove",e=>{if(!CH)return;const p=rel(e);
    if(down){VIEW.start=clamp(sStart-Math.round((p.x-sx)/barW()),0,CH.bars.length-VIEW.count);}
    CROSS={i:idxAt(p.x),py:p.y};draw();});
  cv.addEventListener("mousedown",e=>{if(e.button!==0)return;const p=rel(e);down=true;sx=p.x;sStart=VIEW.start;});
  window.addEventListener("mouseup",()=>{down=false;});
  cv.addEventListener("mouseleave",()=>{down=false;CROSS=null;draw();});
  cv.addEventListener("wheel",e=>{if(!CH)return;e.preventDefault();const p=rel(e),N=CH.bars.length;
    const f=e.deltaY>0?1.18:1/1.18,nc=clamp(Math.round(VIEW.count*f),20,N),ci=idxAt(p.x),frac=(ci-VIEW.start)/VIEW.count;
    VIEW.start=clamp(Math.round(ci-frac*nc),0,N-nc);VIEW.count=nc;draw();},{passive:false});
  cv.addEventListener("touchstart",e=>{if(!CH)return;
    if(e.touches.length===2){pinch={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),c:VIEW.count};down=false;return;}
    const p=rel(e);down=true;sx=p.x;sStart=VIEW.start;CROSS={i:idxAt(p.x),py:p.y};draw();},{passive:false});
  cv.addEventListener("touchmove",e=>{if(!CH)return;e.preventDefault();
    if(e.touches.length===2&&pinch){const nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      const N=CH.bars.length,nc=clamp(Math.round(pinch.c*pinch.d/Math.max(1,nd)),20,N),e0=VIEW.start+VIEW.count;VIEW.count=nc;VIEW.start=clamp(e0-nc,0,N-nc);draw();return;}
    const p=rel(e);if(down){VIEW.start=clamp(sStart-Math.round((p.x-sx)/barW()),0,CH.bars.length-VIEW.count);}
    CROSS={i:idxAt(p.x),py:p.y};draw();},{passive:false});
  cv.addEventListener("touchend",()=>{down=false;pinch=null;});
  function patchLast(price){if(!CH||!CH.bars.length||!(price>0))return;
    const b=CH.bars[CH.bars.length-1];b[4]=price;if(price>b[2])b[2]=price;if(price<b[3])b[3]=price;draw();}
  return {setData,patchLast};
}

     +'<tr><td class="k">'+L("price")+'</td><td class="v">$'+coinFmt(+d.lastPrice)+'</td></tr>'
     +'<tr><td class="k">'+L("chg24")+'</td><td class="v '+cls+'">'+arw+Math.abs(p).toFixed(2)+'%</td></tr>'
     +'<tr><td class="k">'+L("vol24")+'</td><td class="v">'+Math.round(+d.volume).toLocaleString()+'</td></tr>'
     +'<tr><td class="k">'+L("tv24")+'</td><td class="v">$'+Math.round(+d.quoteVolume).toLocaleString()+'</td></tr>'
     +'</table>';
    coinChart.patchLast(+d.lastPrice);   // 차트 마지막 봉 종가를 현재가와 일치
  }catch(e){}
}
document.querySelectorAll("#coinTf button").forEach(b=>b.onclick=()=>{coinTf=b.dataset.tf;
  document.querySelectorAll("#coinTf button").forEach(x=>x.classList.toggle("on",x===b));loadCoin2Chart();});
async function loadCoin2Chart(){if(!coinSym)return;E("coinChartLbl").textContent=L("chartLoading");
  const iv={"3":"3m","5":"5m","15":"15m","30":"30m","60":"1h","D":"1d"}[coinTf]||"1d";
  let kl;try{kl=await fetch("https://api.binance.com/api/v3/klines?symbol="+coinSym+"&interval="+iv+"&limit=400").then(r=>r.json());}catch(e){E("coinChartLbl").textContent=L("chartNone");return;}
  if(!Array.isArray(kl)||!kl.length){E("coinChartLbl").textContent=L("chartNone");return;}
  const bars=kl.map(c=>[coinFmtTime(c[0],coinTf),+c[1],+c[2],+c[3],+c[4]]);
  const raw=kl.map(c=>[c[0],+c[1],+c[2],+c[3],+c[4],+c[7]]);
  const closes=bars.map(b=>b[4]),cur=closes[closes.length-1];
  const hma=jhma(closes,100),sma=jsma(closes,120),walls=jwalls(raw,cur),liq=jliq(raw,cur);
  coinChart.setData({bars,hma,sma,hl:100,gate:120,walls,liq});
  E("coinChartLbl").textContent=LANG==="en"?("Hull MA100 · SMA120 · red=resist green=support · yellow=liq map · drag/pinch")
    :("헐 이동평균선 HMA100 · SMA120 · 빨강=저항 초록=지지 · 노랑=청산맵(어림) · 밀어서 과거·핀치");
}

// 종목 실시간 태그 — 정규장(평일 09:00~15:30 KST)만 켠다. 그 외엔 지연.
function krLiveNow(){const k=new Date(Date.now()+new Date().getTimezoneOffset()*60000+324e5);
  const m=k.getHours()*60+k.getMinutes();return k.getDay()>=1&&k.getDay()<=5&&m>=480&&m<1200;} // 평일 08:00~20:00
function usLiveNow(){const k=new Date(Date.now()+new Date().getTimezoneOffset()*60000+324e5);
  const d=k.getDay(),m=k.getHours()*60+k.getMinutes();  // 미국 CFD: 주말 휴장
  if(d===0)return false; if(d===6&&m>=360)return false; if(d===1&&m<420)return false; return true;}
function updStkTag(){const live=krLiveNow();
  const el=E("stkTag");if(el){el.className="tag "+(live?"live":"delay");el.textContent=live?L("live"):L("delayed2");}}
updStkTag();setInterval(updStkTag,20000);

function apply(t){document.body.classList.toggle("light",t==="light");document.getElementById("tg").textContent=t==="light"?"☀️":"🌙";}
function toggle(){const t=document.body.classList.contains("light")?"dark":"light";try{localStorage.setItem("brief_theme",t);}catch(e){}apply(t);}
(function(){let t;try{t=localStorage.getItem("brief_theme");}catch(e){}
  if(!t)t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";apply(t);})();
