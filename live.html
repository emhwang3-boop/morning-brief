<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일일브리핑 LIVE</title>
<style>
*{margin:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--bg:#0f1420;--card:#171d2b;--bd:#222a3a;--tx:#f4f5f7;--sub:#9aa4b2;--nm:#e8ecf2;--soon:#6b7688}
body.light{--bg:#f4f5f7;--card:#ffffff;--bd:#e6e8ec;--tx:#1a1a1a;--sub:#667;--nm:#222;--soon:#9aa}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Malgun Gothic",sans-serif;
 max-width:520px;margin:0 auto;padding:14px 14px 40px;transition:background .2s,color .2s;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
h1 .lv{color:#ff433d;font-size:12px;font-weight:800;vertical-align:super;margin-left:4px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.right{display:flex;align-items:center;gap:10px}
.clock{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.tgl{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;
 padding:5px 9px;font-size:15px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:12px 0}
.card h3{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:8px;display:flex;
 justify-content:space-between;align-items:center}
.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px}
.tag.live{background:#0b2b16;color:#00e619}
.tag.delay{background:#3a2a0e;color:#e0a020}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none}
.nm{font-size:17px;font-weight:600;color:var(--nm);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{text-align:right;white-space:nowrap;flex:0 0 auto}
.val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.pc{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:6px}
.up{color:#00a868}.dn{color:#ff433d}.fl{color:var(--sub)}
.srow{display:flex;justify-content:space-between;color:var(--soon);font-size:15px;padding:9px 2px;border-bottom:1px solid var(--bd)}
.srow:last-child{border-bottom:none}
.foot{color:var(--soon);font-size:11.5px;margin-top:14px;text-align:center;line-height:1.5}
</style></head><body>
<div class="top">
  <h1>일일브리핑<span class="lv">● LIVE</span></h1>
  <div class="right"><span class="clock" id="clk">--:--:--</span>
   <button class="tgl" id="tg" onclick="toggle()">🌙</button></div>
</div>

<div class="card">
  <h3>국내 지수 <span class="tag live">● 실시간</span></h3>
  <div class="row"><span class="nm">코스피</span><span class="rt" id="ix_kospi"><span class="fl">연동 예정</span></span></div>
  <div class="row"><span class="nm">코스닥</span><span class="rt" id="ix_kosdaq"><span class="fl">연동 예정</span></span></div>
  <div class="row"><span class="nm">코스피200 야간선물</span><span class="rt" id="ix_k200n"><span class="fl">연동 예정</span></span></div>
</div>

<div class="card">
  <h3>미국 지수 <span class="tag delay">D 지연</span></h3>
  <div class="srow"><span>S&amp;P500 · 나스닥 · 다우 · 러셀 · SOX</span></div>
</div>

<div class="card">
  <h3>아시아 <span class="tag delay">D 지연</span></h3>
  <div class="srow"><span>니케이225 · 상하이 · 항셍</span></div>
</div>

<div class="card">
  <h3>금리·환율·원자재 <span class="tag delay">D 지연</span></h3>
  <div class="srow"><span>미 국채금리 · 원/달러·달러지수 · WTI·금 등</span></div>
</div>

<div class="card">
  <h3>암호화폐 <span class="tag live">● 바이낸스</span></h3>
  <div id="coin"><div class="srow"><span>불러오는 중…</span></div></div>
</div>

<div class="foot">국내 지수 = 코스콤 실시간(연동 예정) · 코인 = 바이낸스 실시간 · <b>D = 지연 시세</b><br>장중 실시간 브리핑 — 개발판</div>

<script>
const COINS=[["비트코인","BTCUSDT"],["이더리움","ETHUSDT"],["리플","XRPUSDT"],["솔라나","SOLUSDT"]];
function fmt(n){n=+n;return n>=1000?n.toLocaleString(undefined,{maximumFractionDigits:0})
  :n.toLocaleString(undefined,{maximumFractionDigits:n>=1?2:4});}
async function loadCoin(){
  try{const out=[];
    for(const [nm,sym] of COINS){
      const r=await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol="+sym);
      const d=await r.json();const p=parseFloat(d.priceChangePercent);
      const cls=p>0?"up":(p<0?"dn":"fl"),arw=p>0?"▲":(p<0?"▼":"");
      out.push('<div class="row"><span class="nm">'+nm+'</span>'
        +'<span class="rt"><span class="val">$'+fmt(d.lastPrice)+'</span>'
        +'<span class="pc '+cls+'">'+arw+Math.abs(p).toFixed(2)+'%</span></span></div>');}
    document.getElementById("coin").innerHTML=out.join("");
  }catch(e){document.getElementById("coin").innerHTML='<div class="srow"><span>코인 불러오기 실패</span></div>';}
}
loadCoin();setInterval(loadCoin,3000);

// ===== 국내 지수 실시간 어댑터 (코스콤) =====
// 접속정보(피드 방식·인증키) 나오면 loadIndices() 안만 채우면 3지수 실시간 들어온다.
function setIndex(id,price,pct){
  const el=document.getElementById("ix_"+id);if(!el)return;
  const cls=pct>0?"up":(pct<0?"dn":"fl"),arw=pct>0?"▲":(pct<0?"▼":"");
  el.innerHTML='<span class="val">'+(+price).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</span>'
    +'<span class="pc '+cls+'">'+arw+Math.abs(pct).toFixed(2)+'%</span>';
}
async function loadIndices(){
  // ⭐코스콤 실시간 연동 자리 — 계약 후 접속정보 오면 여기만 채운다:
  //   const d = await fetch(KOSCOM_ENDPOINT,{headers:{Authorization:KOSCOM_KEY}}).then(r=>r.json());
  //   setIndex("kospi",  d.kospi.price,  d.kospi.chgPct);
  //   setIndex("kosdaq", d.kosdaq.price, d.kosdaq.chgPct);
  //   setIndex("k200n",  d.k200n.price,  d.k200n.chgPct);
  return;   // 피드 붙기 전엔 '연동 예정' 유지
}
loadIndices();setInterval(loadIndices,1000);   // 피드 붙으면 1초마다 실시간 갱신

function tick(){const d=new Date();document.getElementById("clk").textContent=
  d.toLocaleTimeString("ko-KR",{hour12:false})+" "+["일","월","화","수","목","금","토"][d.getDay()];}
tick();setInterval(tick,1000);
function apply(t){document.body.classList.toggle("light",t==="light");
  document.getElementById("tg").textContent=t==="light"?"☀️":"🌙";}
function toggle(){const t=document.body.classList.contains("light")?"dark":"light";
  try{localStorage.setItem("brief_theme",t);}catch(e){}apply(t);}
(function(){let t;try{t=localStorage.getItem("brief_theme");}catch(e){}
  if(!t)t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
  apply(t);})();
</script>
</body></html>
