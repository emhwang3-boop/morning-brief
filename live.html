<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일일브리핑 LIVE</title>
<style>
*{margin:0;box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--bg:#0f1420;--card:#171d2b;--bd:#222a3a;--tx:#f4f5f7;--sub:#9aa4b2;--nm:#e8ecf2;--soon:#6b7688}
body.light{--bg:#f4f5f7;--card:#ffffff;--bd:#e6e8ec;--tx:#1a1a1a;--sub:#667;--nm:#222;--soon:#9aa}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Malgun Gothic",sans-serif;
 max-width:520px;margin:0 auto;padding:14px 14px 40px;transition:background .2s,color .2s;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
h1 .lv{color:#ff433d;font-size:12px;font-weight:800;vertical-align:super;margin-left:4px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.right{display:flex;align-items:center;gap:10px}
.clock{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.tgl{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:5px 9px;font-size:15px;cursor:pointer}
.asof{font-size:11.5px;color:var(--soon);margin-bottom:8px}
.gauges{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 8px;text-align:center}
.stat .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--sub);font-weight:600;margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:12px 0}
.card h3{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px}
.tag.live{background:#0b2b16;color:#00e619}
.tag.soon{background:#2a2410;color:#e0a020}
.tag.delay{background:#3a2a0e;color:#e0a020}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none}
.nm{font-size:16px;font-weight:600;color:var(--nm);min-width:0;line-height:1.2;word-break:keep-all;overflow-wrap:break-word}
.rt{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:0 0 auto}
.val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.pc{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.up{color:#00a868}.dn{color:#ff433d}.fl{color:var(--sub)}
.soonrow{color:var(--soon);font-size:14px;padding:8px 2px}
.foot{color:var(--soon);font-size:11.5px;margin-top:14px;text-align:center;line-height:1.5}
.brow{display:grid;grid-template-columns:78px 1fr 62px;align-items:center;gap:6px;padding:5px 2px}
.bn{font-size:14px;color:var(--nm);line-height:1.15;word-break:keep-all;overflow-wrap:break-word}
.bbar{position:relative;height:11px;border-left:1px solid var(--bd)}
.bp{text-align:right;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.crow{display:flex;align-items:center;gap:7px;padding:5px 2px;border-bottom:1px solid var(--bd);font-size:13px}
.crow:last-child{border-bottom:none}
.ct{font-weight:800;font-variant-numeric:tabular-nums;color:var(--nm);min-width:42px}
.cc{color:var(--sub);min-width:36px}
.ci{flex:1;min-width:0;line-height:1.2;word-break:keep-all;overflow-wrap:break-word;color:var(--nm)}
.cd{color:#e0a020;font-size:10px}
.nhd{font-weight:800;color:var(--nm);font-size:13px;margin:8px 0 2px}
.nrow{display:block;color:var(--nm);text-decoration:none;font-size:13px;padding:5px 2px;border-bottom:1px solid var(--bd);opacity:.9}
.injh .srow{padding:6px 2px;color:var(--nm);font-size:14px}
.injh h3{color:var(--sub);font-size:13px;margin-bottom:4px}.injh .chdr{color:var(--soon);font-size:11px;font-weight:400}
.stkq{width:100%;padding:9px 11px;font-size:15px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--nm)}
.stkres a{display:flex;justify-content:space-between;gap:8px;padding:8px 6px;border-bottom:1px solid var(--bd);color:var(--nm);text-decoration:none;font-size:14px;cursor:pointer}
.stkres a:last-child{border-bottom:none}.stkres a .c{color:var(--sub);font-variant-numeric:tabular-nums}
.stktab{width:100%;border-collapse:collapse;margin-top:9px;font-size:13.5px}
.stktab td{padding:6px 4px;border-bottom:1px solid var(--bd)}
.stktab tr:last-child td{border-bottom:none}
.stktab td.k{color:var(--sub);white-space:nowrap}
.stktab td.v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--nm)}
.stkhd{font-size:17px;font-weight:800;color:var(--nm);margin-top:2px}
.stkchart{width:100%;height:240px;margin-top:10px;display:block;border-radius:8px;touch-action:none;cursor:crosshair}
.stkcl{font-size:11px;color:var(--sub);margin-top:3px;text-align:center}
.stktf{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.stktf button{flex:1;min-width:42px;background:var(--bg);border:1px solid var(--bd);color:var(--sub);border-radius:7px;padding:5px 0;font-size:12px;cursor:pointer}
.stktf button.on{background:#1b3a5a;color:#5db4ff;border-color:#2a5580}
</style></head><body>
<div class="top">
  <h1>일일브리핑<span class="lv">● LIVE</span></h1>
  <div class="right"><span class="clock" id="clk">--:--:--</span>
   <button class="tgl" id="tg" onclick="toggle()">🌙</button></div>
</div>
<div class="asof" id="asof">불러오는 중…</div>

<div class="card" id="stock">
  <h3>종목 조회 <span class="tag live">● 실시간</span></h3>
  <input id="stkq" class="stkq" placeholder="종목코드 또는 이름 (예: 005930, 삼성전자)" autocomplete="off">
  <div id="stkResults" class="stkres"></div>
  <div id="stkDetail"></div>
  <div id="stkTf" class="stktf" hidden>
    <button data-tf="3">3분</button><button data-tf="5">5분</button>
    <button data-tf="15">15분</button><button data-tf="30">30분</button>
    <button data-tf="60">60분</button><button data-tf="D" class="on">일</button>
  </div>
  <canvas id="stkChart" class="stkchart" hidden></canvas>
  <div id="stkChartLbl" class="stkcl" hidden></div>
</div>

<div class="gauges" id="gauges"></div>
<div id="cards"></div>

<div class="card" id="coin-card">
  <h3>암호화폐 <span class="tag live">● 바이낸스</span></h3>
  <div id="coin"><div class="soonrow">불러오는 중…</div></div>
</div>

<div id="news"></div>

<div class="foot" id="foot"></div>

<script>
// ---- 스파크라인 ----
function spark(a){
  if(!a||a.length<2)return"";
  const w=54,h=18,lo=Math.min(...a),hi=Math.max(...a),rg=(hi-lo)||1,n=a.length;
  const up=a[a.length-1]>=a[0],c=up?"#00a868":"#ff433d";
  let p="";for(let i=0;i<n;i++){p+=(i?" ":"")+(2+(w-4)*i/(n-1)).toFixed(1)+","+(h-2-(h-4)*(a[i]-lo)/rg).toFixed(1);}
  return'<svg width="'+w+'" height="'+h+'" style="vertical-align:middle"><polyline points="'+p+'" fill="none" stroke="'+c+'" stroke-width="1.4"/></svg>';
}
function pcrow(it){
  const p=it.pct,cls=p>0?"up":(p<0?"dn":"fl"),arw=p>0?"▲":(p<0?"▼":"");
  return'<div class="row"><span class="nm">'+it.nm+'</span><span class="rt">'
    +spark(it.spark)+'<span class="val">'+it.val+'</span>'
    +'<span class="pc '+cls+'">'+arw+Math.abs(p).toFixed(2)+'%</span></span></div>';
}
const TAG={"국내":'<span class="tag soon">실시간 예정</span>'};
function grpTag(t){return TAG[t]||'<span class="tag delay">D 지연</span>';}

// 배포 허브(Cloudflare WebSocket). 비우면 data.json 폴링(로컬/깃허브).
const HUB="https://brief-live-hub.emhwang3.workers.dev";  // Cloudflare WebSocket 허브
function render(d){
  {
    document.getElementById("asof").textContent=d.asof+" 기준"+(d.__snap?" · 스냅샷":"");
    // 게이지 (+ 시장온도)
    let g="";
    if(d.temp!=null){const t=d.temp,lab=t<=25?"차가움":t<=45?"서늘":t<=60?"미지근":t<=75?"따뜻":"뜨거움",
      col=t>=70?"#ff433d":(t<=30?"#3b82f6":"#e0a020");
      g+='<div class="stat"><div class="n" style="color:'+col+'">'+t+'°</div><div class="l">시장온도 · '+lab+'</div></div>';}
    if(d.gauges){
      if(d.gauges.vix!=null)g+='<div class="stat"><div class="n" style="color:'+(d.gauges.vix<20?"#00a868":(d.gauges.vix>30?"#ff433d":"#e0a020"))+'">'+d.gauges.vix+'</div><div class="l">VIX · 공포</div></div>';
      if(d.gauges.fg!=null)g+='<div class="stat"><div class="n" style="color:'+(d.gauges.fg>=75?"#ff433d":(d.gauges.fg<=25?"#00a868":"#e0a020"))+'">'+d.gauges.fg+'</div><div class="l">공포·탐욕</div></div>';
    }
    document.getElementById("gauges").innerHTML=g;
    // 카드 조각들(순서: 특이일 → 캘린더 → 주요자산막대 → 지수그룹 → 한국금리 → 장단기 → [코인] → 뉴스)
    let sGroups="";
    for(const gr of d.groups){
      if(!gr.items.length)continue;
      const tag=gr.rt?'<span class="tag live">● 실시간</span>':'<span class="tag delay">D 지연</span>';
      sGroups+='<div class="card"><h3>'+gr.title+' '+tag+'</h3>'+gr.items.map(pcrow).join("")+'</div>';
    }
    let sKrates="";
    if(d.krates&&d.krates.length){
      sKrates='<div class="card"><h3>한국 금리 <span class="tag delay">D 지연</span></h3>'
        +d.krates.map(k=>{const c=k.chg>0?"up":(k.chg<0?"dn":"fl"),a=k.chg>0?"▲":(k.chg<0?"▼":"");
          return'<div class="row"><span class="nm">'+k.nm+'</span><span class="rt">'+spark(k.spark)+'<span class="val">'+k.val+'</span>'
          +'<span class="pc '+c+'">'+a+Math.abs(k.chg).toFixed(2)+'%p</span></span></div>';}).join("")+'</div>';
    }
    let sSpreads="";
    if(d.spreads&&d.spreads.length){
      sSpreads='<div class="card"><h3>장단기 금리차이 <span style="color:var(--soon);font-weight:400;font-size:11px">음수=역전</span></h3>'
        +d.spreads.map(s=>'<div class="row"><span class="nm">'+s.nm+'</span><span class="rt"><span class="val">'+s.val+'</span>'
          +'<span class="pc '+(s.inv?"dn":"up")+'">'+(s.inv?"역전⚠":"정상")+'</span></span></div>').join("")+'</div>';
    }
    let sChanges="";
    if(d.changes&&d.changes.length){
      const mx=Math.max.apply(null,d.changes.map(c=>Math.abs(c.pct)).concat([1]));
      sChanges='<div class="card"><h3>주요 자산 전일대비</h3>'+d.changes.map(c=>{
        const up=c.pct>=0,half=Math.abs(c.pct)/mx*50,col=up?"#00a868":"#ff433d";
        const bar=up?'<span style="position:absolute;left:50%;top:0;height:11px;width:'+half+'%;background:'+col+';border-radius:0 3px 3px 0"></span>'
                    :'<span style="position:absolute;right:50%;top:0;height:11px;width:'+half+'%;background:'+col+';border-radius:3px 0 0 3px"></span>';
        return '<div class="brow"><span class="bn">'+c.nm+'</span><span class="bbar">'+bar+'</span>'
          +'<span class="bp" style="color:'+col+'">'+(up?"+":"")+c.pct.toFixed(2)+'%</span></div>';}).join("")+'</div>';
    }
    let sSpecial=d.special?'<div class="card injh">'+d.special+'</div>':"";
    let sCalendar="";
    if(d.calendar&&d.calendar.length){
      sCalendar='<div class="card"><h3>경제지표 일정 (오늘)</h3>'+d.calendar.map(c=>
        '<div class="crow"><span class="ct">'+c.t+'</span><span class="cc">'+c.cc+'</span>'
        +'<span class="ci">'+c.title+'</span><span class="cd">'+c.imp+'</span></div>').join("")+'</div>';
    }
    let sNews="";
    if(d.news&&d.news.length){
      sNews='<div class="card"><h3>헤드라인 뉴스</h3>'+d.news.map(s=>
        '<div class="nhd">'+s.src+'</div>'+(s.items||[]).map(it=>
          '<a class="nrow" href="'+it.u+'" target="_blank" rel="noopener">'+it.t+'</a>').join("")).join("")+'</div>';
    }
    // 코인은 #coin-card(3초 갱신) 독립 슬롯 → #cards 는 장단기까지, #news 는 그 아래
    document.getElementById("cards").innerHTML=sSpecial+sCalendar+sChanges+sGroups+sKrates+sSpreads;
    document.getElementById("news").innerHTML=sNews;
  }
}
async function loadData(){
  let d=null;
  const src=HUB?(HUB.replace(/\/$/,"")+"/data"):("data.json?t="+Date.now());
  try{d=await fetch(src,{cache:"no-store"}).then(r=>r.json());}catch(e){}
  if(!d||d.loading||!d.groups)d=window.SNAP||null;
  if(!d||!d.groups){document.getElementById("asof").textContent="서버 준비 중…";return;}
  render(d);
}
let ws=null,wsTimer=null;
function connectWS(){
  try{
    const u=HUB.replace(/^http/,"ws").replace(/\/$/,"")+"/ws";
    ws=new WebSocket(u);
    ws.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d&&d.groups)render(d);}catch(e){}};
    ws.onclose=ws.onerror=()=>{ws=null;clearTimeout(wsTimer);wsTimer=setTimeout(connectWS,3000);loadData();};
  }catch(e){clearTimeout(wsTimer);wsTimer=setTimeout(connectWS,3000);}
}
if(HUB){connectWS();loadData();setInterval(loadData,30000);}  // WS 실시간 + 30초 HTTP 백업
else{loadData();setInterval(loadData,60000);}                  // 로컬/깃허브 폴링

// ---- 코인 (바이낸스 실시간) ----
const COINS=[["비트코인","BTCUSDT"],["이더리움","ETHUSDT"],["리플","XRPUSDT"],["솔라나","SOLUSDT"]];
function fmt(n){n=+n;return n>=1000?n.toLocaleString(undefined,{maximumFractionDigits:0}):n.toLocaleString(undefined,{maximumFractionDigits:n>=1?2:4});}
const coinSpark={};   // 심볼→최근 종가 배열(선그래프용, 5분마다 갱신)
async function loadCoinKlines(){
  for(const [nm,sym] of COINS){
    try{const k=await fetch("https://api.binance.com/api/v3/klines?symbol="+sym+"&interval=1h&limit=30").then(r=>r.json());
      coinSpark[sym]=k.map(c=>+c[4]);}catch(e){}
  }
}
loadCoinKlines();setInterval(loadCoinKlines,300000);
async function loadCoin(){
  try{const out=[];
    for(const [nm,sym] of COINS){
      const d=await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol="+sym).then(r=>r.json());
      const p=parseFloat(d.priceChangePercent),cls=p>0?"up":(p<0?"dn":"fl"),arw=p>0?"▲":(p<0?"▼":"");
      const sp=(coinSpark[sym]||[]).concat([+d.lastPrice]);
      out.push('<div class="row"><span class="nm">'+nm+'</span><span class="rt">'+spark(sp)+'<span class="val">$'+fmt(d.lastPrice)+'</span>'
        +'<span class="pc '+cls+'">'+arw+Math.abs(p).toFixed(2)+'%</span></span></div>');}
    document.getElementById("coin").innerHTML=out.join("");
  }catch(e){document.getElementById("coin").innerHTML='<div class="soonrow">코인 불러오기 실패</div>';}
}
loadCoin();setInterval(loadCoin,3000);

// ---- 종목 조회 (키움, 허브 릴레이) ----
const KRB=HUB?HUB.replace(/\/$/,""):"";
const E=id=>document.getElementById(id);
let stkCode=null, stkTf="D", stkTimer=null, searchTimer=null, lastResults=[];
async function krFetch(op,qs,tries){
  if(!KRB)return null; tries=tries||12;
  for(let i=0;i<tries;i++){
    try{const d=await fetch(KRB+"/kr/"+op+"?"+qs,{cache:"no-store"}).then(r=>r.json());
      if(d&&d.ok)return d.data;}catch(e){}
    await new Promise(r=>setTimeout(r,700));
  }
  return null;
}
E("stkq").addEventListener("input",function(){
  clearTimeout(searchTimer); const q=this.value.trim();
  if(q.length<1){E("stkResults").innerHTML="";lastResults=[];return;}
  searchTimer=setTimeout(async()=>{
    const rows=await krFetch("search","q="+encodeURIComponent(q),4);
    lastResults=rows||[];
    if(!rows){E("stkResults").innerHTML='<div class="soonrow">검색 중…</div>';return;}
    E("stkResults").innerHTML=rows.map(r=>'<a onclick="pickStock(\''+r.code+'\',\''+(r.name||"").replace(/[\'"]/g,"")+'\')"><span>'+(r.name||"")+'</span><span class="c">'+r.code+'</span></a>').join("")||'<div class="soonrow">결과 없음</div>';
  },350);
});
E("stkq").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&lastResults.length){pickStock(lastResults[0].code,lastResults[0].name);this.blur();}
});
function pickStock(code,name){
  stkCode=code; E("stkResults").innerHTML=""; E("stkq").value=name+" ("+code+")";
  E("stkTf").hidden=false; E("stkChart").hidden=false; E("stkChartLbl").hidden=false;
  E("stkDetail").innerHTML='<div class="soonrow">불러오는 중…</div>';
  loadStock(); loadChart();
  clearInterval(stkTimer); stkTimer=setInterval(loadStock,3000);
}
async function loadStock(){
  if(!stkCode)return;
  const d=await krFetch("stock","code="+stkCode,3);
  if(!d||d.error)return;
  const cls=x=>x>0?"up":(x<0?"dn":"fl"), arw=x=>x>0?"▲":(x<0?"▼":""), won=n=>Math.round(n).toLocaleString();
  const co=d.chg_open, cp=d.chg_prev;
  E("stkDetail").innerHTML=
    '<div class="stkhd">'+d.name+' <span style="color:var(--sub);font-size:13px;font-weight:600">'+d.code+'</span></div>'
   +'<table class="stktab">'
   +'<tr><td class="k">현재가</td><td class="v">'+won(d.cur)+'</td></tr>'
   +'<tr><td class="k">시초가 대비</td><td class="v '+cls(co)+'">'+arw(co)+Math.abs(co).toFixed(2)+'%</td></tr>'
   +'<tr><td class="k">전일종가 대비</td><td class="v '+cls(cp)+'">'+arw(cp)+Math.abs(cp).toFixed(2)+'%</td></tr>'
   +'<tr><td class="k">거래량</td><td class="v">'+won(d.vol)+'주</td></tr>'
   +'<tr><td class="k">거래대금</td><td class="v">'+(d.value!=null?won(d.value)+'억':'-')+'</td></tr>'
   +'<tr><td class="k">체결강도</td><td class="v '+(d.strength>=100?"up":(d.strength>0?"dn":"fl"))+'">'+(d.strength||0).toFixed(2)+'</td></tr>'
   +'</table>';
}
async function loadChart(){
  if(!stkCode)return;
  E("stkChartLbl").textContent="차트 불러오는 중…";
  const d=await krFetch("chart","code="+stkCode+"&tf="+stkTf,14);
  if(!d||!d.bars){E("stkChartLbl").textContent="차트 없음";return;}
  setChart(d);
  E("stkChartLbl").textContent="헐 리본 HMA"+d.hl+" · SMA"+d.gate+" · 빨강=저항 초록=지지 · 밀어서 과거·핀치 확대";
}
document.querySelectorAll("#stkTf button").forEach(b=>b.onclick=()=>{
  stkTf=b.dataset.tf;
  document.querySelectorAll("#stkTf button").forEach(x=>x.classList.toggle("on",x===b));
  loadChart();
});
// ---- 인터랙티브 헐 차트 (팬/줌·십자선·측정자·지지저항) ----
let CH=null, VIEW={start:0,count:120}, CROSS=null, GEO=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setChart(d){
  CH=d; const N=d.bars.length;
  VIEW.count=Math.min(120,N||1); VIEW.start=Math.max(0,N-VIEW.count);
  CROSS=null; drawChart();
}
function drawChart(){
  const cv=E("stkChart"); if(!CH||!CH.bars.length)return;
  const bars=CH.bars,hma=CH.hma,sma=CH.sma,N=bars.length,W=cv.clientWidth,H=cv.clientHeight;
  const dpr=window.devicePixelRatio||1; cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  let cnt=clamp(Math.round(VIEW.count),20,N), start=clamp(Math.round(VIEW.start),0,Math.max(0,N-cnt));
  VIEW.count=cnt; VIEW.start=start; const end=start+cnt;
  const x0=6,x1=W-54,y0=8,y1=H-16, cur=bars[N-1][4];
  let lo=Infinity,hi=-Infinity;
  for(let i=start;i<end;i++){lo=Math.min(lo,bars[i][3]);hi=Math.max(hi,bars[i][2]);
    for(const a of [hma,sma]){const v=a[i];if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}}}
  const wl=CH.walls||{};
  for(const w of [wl.up,wl.dn])if(w&&Math.abs(w[0]/cur-1)<0.3){lo=Math.min(lo,w[0]);hi=Math.max(hi,w[0]);}
  if(!(hi>lo))hi=lo+1; const pd=(hi-lo)*0.06; lo-=pd; hi+=pd;
  const X=i=>x0+(x1-x0)*(cnt<=1?0.5:(i-start)/(cnt-1)), Y=v=>y1-(y1-y0)*(v-lo)/(hi-lo);
  GEO={x0,x1,y0,y1,start,cnt,lo,hi,N};
  const cw=Math.max(1,(x1-x0)/cnt*0.62);
  for(let i=start;i<end;i++){const b=bars[i],up=b[4]>=b[1],col=up?"#00a868":"#ff433d",xc=X(i);
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(xc,Y(b[2]));ctx.lineTo(xc,Y(b[3]));ctx.stroke();
    const yo=Y(b[1]),yc=Y(b[4]);ctx.fillRect(xc-cw/2,Math.min(yo,yc),cw,Math.max(1,Math.abs(yc-yo)));}
  ctx.strokeStyle="#8a93a3";ctx.lineWidth=1.3;ctx.beginPath();let st=false;
  for(let i=start;i<end;i++){const v=sma[i];if(v==null){st=false;continue;}const xx=X(i),yy=Y(v);if(!st){ctx.moveTo(xx,yy);st=true;}else ctx.lineTo(xx,yy);}ctx.stroke();
  ctx.lineWidth=2.6;ctx.lineCap="round";
  for(let i=Math.max(start,1);i<end;i++){const a=hma[i-1],b=hma[i];if(a==null||b==null)continue;
    const ref=hma[i-2],up=(ref!=null)?(b>ref):(b>=a);ctx.strokeStyle=up?"#00c853":"#ff433d";
    ctx.beginPath();ctx.moveTo(X(i-1),Y(a));ctx.lineTo(X(i),Y(b));ctx.stroke();}
  ctx.lineCap="butt";
  const drawWall=(w,isUp)=>{if(!w)return;const y=Y(w[0]);if(y<y0||y>y1)return;
    const col=isUp?"#ff6b6b":"#26c281";ctx.strokeStyle=col;ctx.lineWidth=1+2*(w[1]||0);
    ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=col;ctx.font="9px sans-serif";ctx.textAlign="left";
    ctx.fillText(Math.round(w[0]).toLocaleString(),x0+2,y-2);};
  drawWall(wl.up,true); drawWall(wl.dn,false);
  ctx.textAlign="left";ctx.font="10px sans-serif";
  const subc=(getComputedStyle(document.body).getPropertyValue("--sub")||"#889").trim();
  ctx.fillStyle=subc;ctx.fillText(Math.round(hi).toLocaleString(),x1+3,y0+8);
  ctx.fillText(Math.round(lo).toLocaleString(),x1+3,y1);
  ctx.fillStyle="#5db4ff";ctx.fillText(Math.round(cur).toLocaleString(),x1+3,clamp(Y(cur),y0+8,y1));
  if(CROSS!=null){const ci=clamp(CROSS.i,start,end-1),xc=X(ci),b=bars[ci];
    ctx.strokeStyle="rgba(140,150,170,0.75)";ctx.lineWidth=0.7;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(xc,y0);ctx.lineTo(xc,y1);ctx.stroke();
    if(CROSS.py!=null){ctx.beginPath();ctx.moveTo(x0,CROSS.py);ctx.lineTo(x1,CROSS.py);ctx.stroke();}
    ctx.setLineDash([]);
    ctx.fillStyle="#0b1220";ctx.fillRect(xc-38,y1+1,76,13);ctx.fillStyle="#cfd6e0";ctx.font="9px sans-serif";ctx.textAlign="center";ctx.fillText(b[0],xc,y1+11);
    if(CROSS.py!=null){const pv=lo+(y1-CROSS.py)/(y1-y0)*(hi-lo);
      ctx.fillStyle="#0b1220";ctx.fillRect(x1+1,CROSS.py-7,53,14);ctx.fillStyle="#5db4ff";ctx.textAlign="left";ctx.fillText(Math.round(pv).toLocaleString(),x1+3,CROSS.py+3);}
    ctx.fillStyle=subc;ctx.textAlign="left";ctx.font="10px sans-serif";
    ctx.fillText("시"+Math.round(b[1]).toLocaleString()+" 고"+Math.round(b[2]).toLocaleString()+" 저"+Math.round(b[3]).toLocaleString()+" 종"+Math.round(b[4]).toLocaleString(),x0+2,y0+9);}
}
(function(){
  const cv=E("stkChart"); if(!cv)return;
  let down=false,sx=0,sStart=0,pinch=null;
  const rel=(e)=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  const idxAt=(px)=>GEO?clamp(Math.round(GEO.start+(px-GEO.x0)/(GEO.x1-GEO.x0)*(GEO.cnt-1)),0,GEO.N-1):0;
  const barW=()=>GEO?(GEO.x1-GEO.x0)/GEO.cnt:1;
  cv.addEventListener("mousemove",e=>{if(!CH)return;const p=rel(e);
    if(down){VIEW.start=clamp(sStart-Math.round((p.x-sx)/barW()),0,CH.bars.length-VIEW.count);}
    CROSS={i:idxAt(p.x),py:p.y};drawChart();});
  cv.addEventListener("mousedown",e=>{if(e.button!==0)return;const p=rel(e);down=true;sx=p.x;sStart=VIEW.start;});
  window.addEventListener("mouseup",()=>{down=false;});
  cv.addEventListener("mouseleave",()=>{down=false;CROSS=null;drawChart();});
  cv.addEventListener("wheel",e=>{if(!CH)return;e.preventDefault();const p=rel(e),N=CH.bars.length;
    const f=e.deltaY>0?1.18:1/1.18,nc=clamp(Math.round(VIEW.count*f),20,N),ci=idxAt(p.x),frac=(ci-VIEW.start)/VIEW.count;
    VIEW.start=clamp(Math.round(ci-frac*nc),0,N-nc);VIEW.count=nc;drawChart();},{passive:false});
  cv.addEventListener("touchstart",e=>{if(!CH)return;
    if(e.touches.length===2){pinch={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),c:VIEW.count};down=false;return;}
    const p=rel(e);down=true;sx=p.x;sStart=VIEW.start;CROSS={i:idxAt(p.x),py:p.y};drawChart();},{passive:false});
  cv.addEventListener("touchmove",e=>{if(!CH)return;e.preventDefault();
    if(e.touches.length===2&&pinch){const nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      const N=CH.bars.length,nc=clamp(Math.round(pinch.c*pinch.d/Math.max(1,nd)),20,N),e0=VIEW.start+VIEW.count;VIEW.count=nc;VIEW.start=clamp(e0-nc,0,N-nc);drawChart();return;}
    const p=rel(e);
    if(down){VIEW.start=clamp(sStart-Math.round((p.x-sx)/barW()),0,CH.bars.length-VIEW.count);}
    CROSS={i:idxAt(p.x),py:p.y};drawChart();},{passive:false});
  cv.addEventListener("touchend",()=>{down=false;pinch=null;});
})();

// ---- 시계 · 테마 ----
function tick(){const d=new Date();document.getElementById("clk").textContent=
  d.toLocaleTimeString("ko-KR",{hour12:false});}
tick();setInterval(tick,1000);
function apply(t){document.body.classList.toggle("light",t==="light");document.getElementById("tg").textContent=t==="light"?"☀️":"🌙";}
function toggle(){const t=document.body.classList.contains("light")?"dark":"light";try{localStorage.setItem("brief_theme",t);}catch(e){}apply(t);}
(function(){let t;try{t=localStorage.getItem("brief_theme");}catch(e){}
  if(!t)t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";apply(t);})();
</script>
